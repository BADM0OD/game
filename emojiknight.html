  advanceDialogue() {
    const d = this.dialogue;
    if (!d) return;
    d.index++;
    SFX.play('talk');
    if (d.index >= d.lines.length) {
      this.endDialogue();
      return;
    }
    const line = d.lines[d.index];
    if (line.action) line.action();
  },

  endDialogue() {
    const npcId = this.dialogue ? this.dialogue.npcId : 'nengrongze';
    const tag = this.dialogue ? this.dialogue.tag : null;
    this.dialogue = null;
    this.stats.talk++;
    this.state = 'playing';
    this.skipUpdate = true;

    if (tag === 'tear') {
      this.save.world.tearsQuest = 2;
      this.save.world.homeworkUnlocked = true;
      const main = this.save.quests.main.find(q => q.id === 'main1');
      if (main) main.desc = '去高一十班（后）使用💧试试';
      this.saveGame();
      UI.toast('已解锁委托任务功能', 3000);
      SFX.play('quest');
      return;
    }

    if (npcId === 'nengrongze') {
      this.npcTalked = true;
      if (!this.save.unlocked.includes('nengrongze')) {
        this.save.unlocked.push('nengrongze');
        this.save.progress.nengrongze = { level: 1, e: 1, q: 1 };
        this.player.addCharacter('nengrongze');
        this.saveGame();
        UI.toast('获得新角色 🌵 能荣泽', 2400);
        SFX.play('quest');
      }
    } else if (npcId === 'litou') {
      this.save.world.litouTalked = true;
      this.grantQuestExp('litou', 100);
      const main = this.save.quests.main.find(q => q.id === 'main1');
      if (main && this.save.world.tearsQuest === 0 && !this.save.world.houBossDefeated) {
        main.desc = '去会会孙点黑';
      }
      this.saveGame();
    } else if (npcId === 'sundianhei') {
      this.save.world.houBossTalked = true;
      this.startSunFight();
      this.saveGame();
    }
  },

  startSunFight() {
    const npc = (LEVEL.npcs || []).find(n => n.id === 'sundianhei');
    const base = npc ? npc.x : 1300;
    const away = Math.sign(base - this.player.x) || 1;
    const boss = new BossSun(base + away * 200, false);
    this.enemies.push(boss);
    UI.toast('孙点黑进入战斗', 2200);
    SFX.play('quest');
  },

  giveMathBook() {
    if (this.save.world.gotMathBook || this.save.inventory.items.includes('mathbook')) return;
    this.save.world.gotMathBook = true;
    this.addItem('mathbook');
    UI.showLoot(['📕 数学书×1', '可在背包中装备到 Z / X / C / V'], 3200, '获得道具');
    this.effects.push({ type: 'ring', x: this.player.x, y: this.player.y - 40, t: 0, life: 0.5, color: '#ffd166' });
    SFX.play('quest');
  },

  acceptQuest() {
    if (this.save.quests.side.some(q => q.id === 'pear')) return;
    this.save.quests.side.push({
      id: 'pear', name: '梨花又开放',
      desc: '帮助能荣泽追回前妻姐', status: 'active'
    });
    this.saveGame();
    UI.toast('⚠️ 已接取支线任务“梨花又开放”', 2600);
  },

  /* ---------------- 主循环 ---------------- */

  loop(ts) {
    if (!this.last) this.last = ts;
    let dt = (ts - this.last) / 1000;
    this.last = ts;
    dt = Math.min(dt, 0.05);

    Input.update(dt);
    this.handleGlobalInput();

    if (this.state === 'playing' && !this.skipUpdate) this.update(dt);
    else if (this.state === 'cutscene') this.updateScene(dt);
    else if (this.state === 'wipe') this.updateWipe(dt);
    this.skipUpdate = false;

    this.render();
    if (this.player) UI.render(this);

    if (this.player) {
      this.autoSaveTimer = (this.autoSaveTimer || 0) + dt;
      if (this.autoSaveTimer >= 8) {
        this.autoSaveTimer = 0;
        this.saveGame();
      }
    }

    Input.endFrame();
    requestAnimationFrame((t) => this.loop(t));
  },

  updateWipe(dt) {
    this.wipeTimer -= dt;
    if (this.wipeTimer <= 0) this.respawn();
  },

  update(dt) {
    if (this.hitstop > 0) {
      this.hitstop -= dt;
      return;
    }

    this.focusTimer = Math.max(0, this.focusTimer - dt);
    const wdt = dt * (this.focusTimer > 0 ? CFG.focus.timeScale : 1);

    this.player.update(dt, wdt);

    for (const e of this.enemies) e.update(wdt, this);
    this.enemies = this.enemies.filter(e => !e.dead);
    this.updateExam(wdt);

    for (const p of this.projectiles) p.update(wdt, this);
    this.projectiles = this.projectiles.filter(p => !p.dead);

    for (const h of this.hazards) h.update(wdt, this);
    this.hazards = this.hazards.filter(h => !h.dead);

    for (const k in this.itemCds) {
      if (this.itemCds[k] > 0) this.itemCds[k] = Math.max(0, this.itemCds[k] - dt);
    }

    for (const fx of this.effects) fx.t += dt;
    this.effects = this.effects.filter(fx => fx.t < fx.life);

    for (const t of this.texts) {
      t.t += dt;
      t.y -= 28 * dt;
    }
    this.texts = this.texts.filter(t => t.t < t.life);

    this.shake = Math.max(0, this.shake - dt * 40);
    this.hurtFlash = Math.max(0, this.hurtFlash - dt);
    this.spikeCd = Math.max(0, this.spikeCd - dt);

    this.achievementTimer = (this.achievementTimer || 0) - dt;
    if (this.achievementTimer <= 0) {
      this.achievementTimer = 0.5;
      this.checkAchievements(true);
    }

    this.checkEnemyRespawns();
    this.updateCamera(dt);
    this.updateTutorial();
    this.updateChest();
    this.updateZhongChests();
    this.updateHouChest();
    this.updateKeyPickup();
    this.updateCheckpoint();
    this.updateCheckpointHeal();
    this.updateNpc();

    if (LEVEL.exit && this.player.x > LEVEL.exit.x - 30) {
      if (this.levelObjectiveDone()) this.clearLevel();
      else this.notifyExitLocked();
    }
  },

  levelObjectiveDone() {
    if (this.levelId === 'qian') {
      return this.save.world.tutorialDone ||
        this.tutorialIndex >= LEVEL.tutorial.length - 1;
    }
    if (this.levelId === 'zhong') {
      return !!this.save.world.litouTalked;
    }
    return true;
  },

  notifyExitLocked() {
    const now = performance.now();
    if (now < (this.exitLockedAt || 0)) return;
    this.exitLockedAt = now + 2600;
    let msg = '关卡目标尚未完成，出口暂未开放';
    if (this.levelId === 'qian') msg = '先完成全部教学指引，出口才会开放';
    else if (this.levelId === 'zhong') msg = '先在荔头办公室找到 👩🏻荔头交谈';
    UI.toast(msg, 2200);
  },

  updateCamera(dt) {
    const target = this.player.x - 480 + this.player.dir * 70;
    const clamped = Math.max(0, Math.min(LEVEL.width - CFG.view.w, target));
    this.camera.x += (clamped - this.camera.x) * Math.min(1, dt * 7);
  },

  updateTutorial() {
    if (this.levelId !== 'qian') return;
    if (this.save.world.tutorialDone) return;
    const list = LEVEL.tutorial;
    if (this.tutorialIndex >= list.length) return;
    const step = list[this.tutorialIndex];
    if (!step) return;
    const s = this.stats;
    const needEnemy =
      (step.key === 'block' && s.blocked <= 0 && s.perfectBlock <= 0) ||
      (step.key === 'perfectDodge' && s.perfectDodge <= 0) ||
      (step.key === 'perfectBlock' && s.perfectBlock <= 0) ||
      (step.key === 'toughness' && s.kills <= 0) ||
      (step.key === 'ult' && s.ult <= 0);
    if (needEnemy) this.ensureTutorialEnemy();

    const now = performance.now();
    if (this.tutorialHoldUntil && now < this.tutorialHoldUntil) return;

    if (this.tutorialStepDone(step)) {
      this.tutorialIndex++;
      this.tutorialHoldUntil = 0;
      this.shake = Math.max(this.shake, 2);
      // 若下一条在之前就已经完成，先显示 5 秒，再自动推进
      const nxt = list[this.tutorialIndex];
      if (nxt && nxt.key !== 'pass' && this.tutorialStepDone(nxt)) {
        this.tutorialHoldUntil = now + 5000;
      }
      this.saveGame();
    }
  },

  tutorialStepDone(step) {
    const s = this.stats;
    switch (step.key) {
      case 'move':         return Math.abs(this.player.x - LEVEL.spawn.x) > 100;
      case 'jump':         return s.jump > 0;
      case 'light':        return s.lightSwing > 0;
      case 'heavy':        return s.heavySwing > 0;
      case 'dash':         return s.dash > 0;
      case 'sprint':       return s.sprint > 0;
      case 'block':        return s.blocked > 0 || s.perfectBlock > 0;
      case 'perfectDodge': return s.perfectDodge > 0;
      case 'perfectBlock': return s.perfectBlock > 0;
      case 'toughness':    return s.kills > 0;
      case 'skill':        return s.stealth > 0 || s.shield > 0 || s.sprout > 0;
      case 'ult':          return s.ult > 0;
      case 'clear':        return !this.enemies.some(e => !e.dead && (e.kind === 'dog' || e.kind === 'pig'));
      case 'chest':        return this.chestOpened && this.save.world.checkpoints.includes('qian-cp');
      case 'bag':          return s.bag > 0;
      case 'useItem':      return s.itemUsed > 0 || (this.save.world.itemsUsed || 0) > 0;
      case 'char':         return s.panel > 0;
      case 'equip':        return s.weaponEquipped > 0;
      case 'upgrade':      return s.skillViewed > 0;
      case 'quest':        return s.quest > 0;
      case 'achieve':      return s.achieve > 0;
      case 'map':          return s.teleport > 0;
      case 'talk':         return !!this.npcTalked;
      case 'pass':         return false;
    }
    return false;
  },

  // 终结技指引阶段：场上没有敌人时补一只黑犬，直到完成
  ensureTutorialEnemy() {
    if (this.enemies.some(e => !e.dead && (e.kind === 'dog' || e.kind === 'pig'))) return;
    const now = performance.now();
    if (now < (this.tutorialSpawnAt || 0)) return;
    this.tutorialSpawnAt = now + 1600;
    const dir = this.player.dir >= 0 ? 1 : -1;
    let x = this.player.x + dir * 300;
    x = Math.max(120, Math.min(LEVEL.width - 120, x));
    const spot = { x, a: Math.max(60, x - 200), b: Math.min(LEVEL.width - 60, x + 200) };
    const e = new Enemy(spot, 'tut:' + Date.now());
    e.homework = true;
    this.enemies.push(e);
    this.effects.push({ type: 'ring', x, y: LEVEL.floorY - 40, t: 0, life: 0.5, r0: 10, r1: 70, width: 4, color: '#ff9f6e' });
    UI.toast('又一只黑犬出现了', 1600);
  },

  updateChest() {
    if (this.levelId !== 'qian') return;
    if (!LEVEL.chest) return;
    if (this.chestOpened && this.save.world.chestChocolateTaken) return;
    if (Math.abs(this.player.x - LEVEL.chest.x) > 52) return;

    // 教学关宝箱：消灭全部敌人后才开放
    if (this.enemies.some(e => !e.dead && (e.kind === 'dog' || e.kind === 'pig'))) {
      const now = performance.now();
      if (now > (this.chestLockedAt || 0)) {
        this.chestLockedAt = now + 2800;
        UI.toast('宝箱被封印：先消灭全部敌人', 2200);
        this.effects.push({ type: 'ring', x: LEVEL.chest.x, y: LEVEL.floorY - 30, t: 0, life: 0.4, r0: 8, r1: 50, width: 3, color: '#8f7b5d' });
      }
      return;
    }

    const firstOpen = !this.chestOpened;
    const loot = [];
    this.chestOpened = true;
    this.save.world.chestOpened = true;
    this.stats.chest++;
    if (firstOpen) this.gainWorldExp(5);

    if (firstOpen) {
      this.save.gold += 10;
      this.save.materials.goldenPythonSkin = (this.save.materials.goldenPythonSkin || 0) + 1;
      loot.push('💰 金币×10', '💩 黄金巨蟒皮×1');
      if (!this.save.inventory.equipment.includes('dagger')) {
        this.save.inventory.equipment.push('dagger');
        loot.push('🔪 匕首×1');
      }
    }
    if (!this.save.world.chestChocolateTaken) {
      this.save.world.chestChocolateTaken = true;
      this.addItem('chocolate');
      loot.push('🍫 巧克力×1');
    }

    this.saveGame();
    UI.showLoot(loot, 3400, '🎁 宝箱');
    SFX.play('pickup');
    this.effects.push({ type: 'ring', x: LEVEL.chest.x, y: LEVEL.floorY - 30, t: 0, life: 0.5, r0: 10, r1: 90, width: 5, color: '#ffd166' });
  },

  materialInfo(id) {
    if (id === 'haochengji') return { emoji: '💯', name: '好成绩' };
    if (id === 'gear') return { emoji: '⚙️', name: '齿轮' };
    if (id === 'music') return { emoji: '🎶', name: '音乐细菌' };
    if (id === 'goldenPythonSkin') return { emoji: '💩', name: '黄金巨蟒皮' };
    if (id === 'dianmo') return { emoji: '⚫️', name: '点墨' };
    return { emoji: '📦', name: id };
  },

  updateZhongChests() {
    if (!LEVEL.chests) return;
    for (const c of LEVEL.chests) {
      if (this.save.world.zhongChests.includes(c.id)) continue;
      if (!this.save.world.pigDefeated.includes(c.pigKey)) continue;
      if (Math.abs(this.player.x - c.x) > 56) continue;
      if (Math.abs(this.player.y - c.y) > 90) continue;
      this.openZhongChest(c);
    }
  },

  openZhongChest(chest) {
    this.save.world.zhongChests.push(chest.id);
    this.stats.chest++;
    this.gainWorldExp(5);
    const r = chest.rewards || {};
    const rows = [];

    if (r.gold) {
      this.save.gold += r.gold;
      rows.push(`💰 金币×${r.gold}`);
    }
    for (const m of (r.materials || [])) {
      this.save.materials[m.id] = (this.save.materials[m.id] || 0) + m.n;
      const info = this.materialInfo(m.id);
      rows.push(`${info.emoji} ${info.name}×${m.n}`);
    }
    for (const it of (r.items || [])) {
      const info = CFG.items[it.id];
      for (let i = 0; i < it.n; i++) this.addItem(it.id);
      rows.push(`${info ? info.emoji : '🎁'} ${info ? info.name : it.id}×${it.n}`);
    }
    for (const id of (r.equipment || [])) {
      if (!this.save.inventory.equipment.includes(id)) {
        this.save.inventory.equipment.push(id);
      }
      const w = CFG.weapons[id];
      rows.push(`${w ? w.emoji : '📦'} ${w ? w.name : id}×1`);
    }

    this.saveGame();
    UI.showLoot(rows, 3400, '🎁 宝箱');
    this.effects.push({ type: 'ring', x: chest.x, y: chest.y - 30, t: 0, life: 0.6, color: '#ffd166' });
    SFX.play('pickup');
  },

  updateHouChest() {
    if (this.levelId !== 'hou' || !LEVEL.chest || !LEVEL.chest.bossChest) return;

  startStory(lines, done) {
    this.story = { lines, index: 0, done };
    this.storyGuard = performance.now();
    this.state = 'story';
    UI.showStory(this, 0);
  },

  advanceStory() {
    if (this.state !== 'story' || !this.story) return;
    if (performance.now() - this.storyGuard < 250) return;
    this.story.index++;
    if (this.story.index >= this.story.lines.length) {
      const done = this.story.done;
      this.story = null;
      this.state = 'playing';
      UI.hideOverlay();
      if (done) done();
      return;
    }
    UI.showStory(this, this.story.index);
  },

  /* ---------------- 鎏知寞剧情 ---------------- */

  startLiumoScene() {
    this.state = 'cutscene';
    this.scene = {
      phase: 'throw',
      t: 0,
      guard: performance.now(),
      tear: {
        x: this.player.x + this.player.dir * 40,
        y: this.player.y - 30,
        vx: this.player.dir * 190,
        vy: -260,
        landed: false
      },
      actor: {
        x: this.camera.x + 1420,
        y: LEVEL.floorY,
        dir: -1,
        walk: 0
      },
      line: 0,
      lines: [
        { who: 'liumo', text: '这是……' },
        { who: 'player', text: '你应该认得' },
        { who: 'liumo', text: '你杀了他吗' },
        { who: 'player', text: '或许吧' },
        { who: 'liumo', text: '……' },
        { who: 'liumo', text: '其实我想过或许会有这一天，毕竟他是这样的人，注定会是这样的结局' },
        { who: 'player', text: '我还以为你会打我呢' },
        { who: 'liumo', text: '我不介意如你所愿' },
        { who: 'player', text: '还是算了吧' },
        { who: 'liumo', text: '你的目的是什么' },
        { who: 'player', text: '打败烤鸡恶魔' },
        { who: 'liumo', text: '就凭你吗' },
        { who: 'player', text: '别瞧不起我' },
        { who: 'liumo', text: '好吧，你想要我帮忙吗' },
        { who: 'player', text: '那是最好的' }
      ]
    };
    UI.hideOverlay();
    SFX.play('talk');
  },

  updateScene(dt) {
    const sc = this.scene;
    if (!sc) { this.endLiumoScene(); return; }
    sc.t += dt;

    if (sc.phase === 'throw') {
      const te = sc.tear;
      if (!te.landed) {
        te.vy += 1000 * dt;
        te.x += te.vx * dt;
        te.y += te.vy * dt;
        if (te.y >= LEVEL.floorY - 8) {
          te.y = LEVEL.floorY - 8;
          te.vx = 0;
          te.vy = 0;
          te.landed = true;
          sc.t = 0;
          this.effects.push({ type: 'ring', x: te.x, y: te.y, t: 0, life: 0.5, r0: 6, r1: 42, width: 3, color: '#8fd7ff' });
          SFX.play('pickup');
        }
      } else if (sc.t > 0.9) {
        sc.phase = 'walk';
        sc.t = 0;
      }
      return;
    }

    if (sc.phase === 'walk') {
      sc.actor.x -= 230 * dt;
      sc.actor.walk += dt;
      const stopX = Math.min(this.player.x + 250, LEVEL.width - 140);
      if (sc.actor.x <= stopX) {
        sc.actor.x = stopX;
        sc.actor.dir = this.player.x < sc.actor.x ? -1 : 1;
        sc.phase = 'talk';
        sc.t = 0;
        sc.guard = performance.now();
        SFX.play('talk');
      }
      return;
    }

    if (sc.phase === 'talk') {
      if (Input.rawLeft.pressed && performance.now() - sc.guard > 200) {
        sc.line++;
        sc.guard = performance.now();
        SFX.play('talk');
        if (sc.line >= sc.lines.length) {
          sc.phase = 'done';
          this.endLiumoScene();
        }
      }
    }
  },

  endLiumoScene() {
    const sc = this.scene;
    this.scene = null;
    this.state = 'playing';
    if (!this.save.world.liumoJoined) {
      this.save.world.liumoJoined = true;
      this.grantQuestExp('liumo', 100);
      if (!this.save.unlocked.includes('liumo')) this.save.unlocked.push('liumo');
      this.save.progress.liumo = { level: 1, e: 1, q: 1 };
      if (this.player && !this.player.characters.some(c => c.def.id === 'liumo')) {
        this.player.addCharacter('liumo');
      }
      const main = this.save.quests.main.find(q => q.id === 'main1');
      if (main) main.desc = '与鎏知寞一起探索控江秘境';
      UI.toast('获得新角色 🐱 鎏知寞', 3200);
      UI.showLoot(['🐱 鎏知寞 加入队伍'], 3000, '新伙伴');
      SFX.play('quest');
      this.effects.push({ type: 'burst', x: this.player.x, y: this.player.y - 40, t: 0, life: 0.6 });
      this.effects.push({ type: 'ring', x: this.player.x, y: this.player.y - 40, t: 0, life: 0.6, r0: 10, r1: 90, width: 5, color: '#c9c9d6' });
    }
    this.saveGame();
  },

  npcAvailable(npc) {
    if (!npc) return false;
    if (npc.id === 'nengrongze' && this.levelId === 'qian' &&
        !this.save.world.tutorialDone && this.tutorialIndex < 22) {
      return false;
    }
    return true;
  },

  npcOptions(npc) {
    if (npc.id === 'litou') {
      const list = [{ key: 'talk', label: '交谈' }];
      if (this.save.world.tearsQuest === 1) list.push({ key: 'ask', label: '询问' });
      if (this.save.world.homeworkUnlocked) list.push({ key: 'work', label: '做作业' });
      return list;
    }
    return [{ key: 'talk', label: '交谈' }];
  },

  openHomeworkPanel() {
    this.menuFrom = 'playing';
    this.state = 'menu';
    this.panel = 'homework';
    this.stats.panel++;
    UI.showHomework(this);
  },

  startTearDialogue() {
    const npc = (LEVEL.npcs || []).find(n => n.id === 'litou') || { x: 0, y: 0 };
    this.state = 'dialogue';
    this.dialogue = {
      npcId: 'litou',
      tag: 'tear',
      npc: { x: npc.x, y: npc.y, name: npc.name, emoji: npc.emoji },
      index: 0,

        { who: 'player', text: '我：老师老师，这是什么？' },
        { who: 'npc', text: '荔头：唉……你还是跟它对上了啊……' },
        { who: 'player', text: '我：嗯……' },
        { who: 'npc', text: '荔头：这是鎏知寞的眼泪' },
        { who: 'player', text: '我：哦哦噢噢噢噢！！！' },
        { who: 'npc', text: '荔头：他们已经很久不说话了，如果给他看了这个，或许他会加入你' },
        { who: 'player', text: '我：收到！' },
        { who: 'npc', text: '荔头：前方困难重重，或许你需要一些历练？' },
        { who: 'player', text: '我：哦？' },

        { who: 'player', text: '我：诶……好吧。。。' }
      ]
    };

  updateNpc() {
    if (this.state !== 'playing') return;
    const npcs = LEVEL.npcs || [];
    for (const npc of npcs) {
      if (!this.npcAvailable(npc)) continue;
      if (npc.id === 'nengrongze' && this.npcTalked) continue;
      if (npc.id === 'sundianhei' && (this.save.world.houBossTalked || this.save.world.houBossDefeated)) continue;
      if (Math.abs(this.player.x - npc.x) > 76) continue;
      if (Math.abs(this.player.y - npc.y) > 110) continue;

      const opts = this.npcOptions(npc);
      let sel = this.npcSel[npc.id] || 0;
      if (sel >= opts.length) sel = 0;
      if (opts.length > 1 && Input.wheel) {
        sel = (sel + (Input.wheel > 0 ? 1 : -1) + opts.length) % opts.length;
        SFX.play('click');
      }
      this.npcSel[npc.id] = sel;

      if (Input.keyPressed('KeyF')) {
        const opt = opts[sel];
        if (opt.key === 'talk') this.startDialogue(npc);
        else if (opt.key === 'ask') this.startTearDialogue();
        else if (opt.key === 'work') this.openHomeworkPanel();
        return;
      }
    }
  },

  updateKeyPickup() {
    const key = LEVEL.key;
    if (!key || this.save.world.keyTaken || this.save.world.lockOpened) return;
    if (Math.abs(this.player.x - key.x) > 50) return;
    if (Math.abs(this.player.y - key.y) > 90) return;
    this.save.world.keyTaken = true;
    this.addItem(key.itemId || 'classroomKey');
    this.saveGame();
    UI.showLoot(['🔑 十班的钥匙×1', '按 B 在背包中装备到 Z / X / C / V'], 3200, '获得道具');
    this.effects.push({ type: 'ring', x: key.x, y: key.y - 30, t: 0, life: 0.5, color: '#ffd166' });
    SFX.play('pickup');
  },

  updateCheckpoint() {
    if (!LEVEL.checkpoints) return;
    for (const cp of LEVEL.checkpoints) {
      if (Math.abs(this.player.x - cp.x) > 40) continue;
      if (Math.abs(this.player.y - cp.y) > 110) continue;

      this.checkpointActive = true;
      this.checkpointId = cp.id;
      this.checkpointX = cp.x;
      this.checkpointY = cp.y;

      if (!this.save.world.checkpoints.includes(cp.id)) {
        this.save.world.checkpoints.push(cp.id);
        // 教学关内也允许打开地图（用于教学指引里的传送）
        if (this.levelId === 'qian' && !this.save.world.maps.includes('qian')) {
          this.save.world.maps.push('qian');
        }
        this.saveGame();
        UI.toast('检查点已激活 · 已解锁传送点：' + cp.name, 2400);
        this.effects.push({ type: 'ring', x: cp.x, y: cp.y - 40, t: 0, life: 0.5, color: '#7fe0ff' });
      }
    }
  },

  updateCheckpointHeal() {
    if (!this.player || !LEVEL.checkpoints) return;
    const now = Date.now();
    for (const cp of LEVEL.checkpoints) {
      if (!this.save.world.checkpoints.includes(cp.id)) continue;
      if (Math.abs(this.player.x - cp.x) > 90) continue;
      if (now < (this.save.world.checkpointHeal[cp.id] || 0)) continue;
      if (!this.player.characters.some(c => c.hp < c.hpMax)) continue;

      for (const c of this.player.characters) c.hp = c.hpMax;
      this.save.world.checkpointHeal[cp.id] = now + CFG.checkpoint.healSeconds * 1000;
      this.checkpointActive = true;
      this.checkpointId = cp.id;
      this.checkpointX = cp.x;
      this.checkpointY = cp.y;
      this.saveGame();
      UI.toast('检查点：全队已复活并恢复生命（5 分钟后可再次使用）', 2600);
      this.effects.push({ type: 'ring', x: cp.x, y: cp.y - 40, t: 0, life: 0.6, color: '#4be0a0' });
      SFX.play('quest');
      return;
    }
  },

  checkEnemyRespawns() {
    const now = Date.now();
    const list = this.save.world.enemyRespawn;
    for (const k in list) {
      if (list[k] > now) continue;
      const parts = k.split(':');
      if (parts[0] !== LEVEL.id) continue;
      const i = Number(parts[1]);
      const spot = (LEVEL.enemies || [])[i];
      delete list[k];
      if (!spot || this.enemies.some(e => e.index === k)) continue;
      this.enemies.push(this.createEnemy(spot, k));
      this.effects.push({ type: 'ring', x: spot.x, y: LEVEL.floorY - 40, t: 0, life: 0.5, color: '#ff9f6e' });
      this.stats.respawned++;
    }
  },

  /* ---------------- 事件 ---------------- */

  gainUltFor(state, amount) {
    if (!state) return;
    if (state.def.id === 'liuhanyi' && state.awake > 0) return;
    state.ult = Math.min(state.def.ultMax, state.ult + amount);
  },

  // 场上角色命中带 📖 印记的敌人：为当前场上角色回复（鎏知寞生命上限的 10%，每级 +5%）
  onPlayerHitEnemy(enemy) {
    if (!enemy || !(enemy.markT > 0)) return;
    if (!this.player) return;
    const liumo = this.player.characters.find(c => c.def.id === 'liumo');
    if (!liumo) return;
    const target = this.player.ch;
    if (!target || target.hp <= 0) return;
    if (target.hp >= target.hpMax) return;
    const now = performance.now();
    if (now < (this.markHealAt || 0)) return;
    this.markHealAt = now + 1000;

    const qLv = Math.max(1, (liumo.progress && liumo.progress.q) || 1);
    const ratio = 0.10 + 0.05 * (qLv - 1);
    const heal = Math.max(1, Math.round(liumo.hpMax * ratio));
    const before = target.hp;
    target.hp = Math.min(target.hpMax, target.hp + heal);
    const gain = Math.round(target.hp - before);
    if (gain > 0) {
      this.spawnText(this.player.x, this.player.y - 96, target.def.name + ' +' + gain, '#8ef0a0');
      this.effects.push({ type: 'ring', x: this.player.x, y: this.player.y - 40, t: 0, life: 0.3, r0: 8, r1: 52, width: 3, color: '#8ef0a0' });
      const card = UI.cards && UI.cards[this.player.active];
      if (card && card.el) {
        card.el.classList.add('healFlash');
        setTimeout(() => card.el.classList.remove('healFlash'), 320);
      }
    }
  },

  onEnemyKilled(enemy) {
    this.stats.kills++;
    this.save.records.kills = (this.save.records.kills || 0) + 1;
    if (enemy.kind === 'dog') this.save.records.dogKills = (this.save.records.dogKills || 0) + 1;
    if (enemy.kind === 'pig') this.save.records.pigKills = (this.save.records.pigKills || 0) + 1;
    this.gainWorldExp(enemy.kind === 'pig' ? 10 : 1);
    if (enemy.index && !enemy.homework && !enemy.exam) {
      // 通过教学关之前，被击败的敌人不会刷新
      const tutorialLock = this.levelId === 'qian' && !this.save.world.tutorialDone;
      if (!tutorialLock) {
        this.save.world.enemyRespawn[enemy.index] = Date.now() + CFG.respawn.enemySeconds * 1000;
      }
      this.saveGame();
    }
    this.effects.push({ type: 'ring', x: enemy.x, y: enemy.y - 30, t: 0, life: 0.35, color: '#ffffff' });
    this.effects.push({ type: 'burst', x: enemy.x, y: enemy.y - 30, t: 0, life: 0.4 });

    const gold = 1 + Math.floor(Math.random() * 3);
    this.save.gold += gold;
    SFX.play('coin');
    const loot = [`💰 金币×${gold}`];
    if (this.worldLevel() >= 2) {
      // 世界等级 2：黑犬必定掉落 3-6 个点墨
      const n = 3 + Math.floor(Math.random() * 4);
      this.save.materials.dianmo = (this.save.materials.dianmo || 0) + n;
      loot.push(`⚫️ 点墨×${n}`);
    } else if (Math.random() < 0.5) {
      this.save.materials.dianmo = (this.save.materials.dianmo || 0) + 1;
      loot.push('⚫️ 点墨×1');
    }
    if (enemy.kind === 'pig') {
      const gears = 1 + Math.floor(Math.random() * 3);
      this.save.materials.gear = (this.save.materials.gear || 0) + gears;
      const bonusGold = 5 + Math.floor(Math.random() * 6);
      this.save.gold += bonusGold;
      loot.push(`💰 金币×${bonusGold}`);
      loot.push(`⚙️ 齿轮×${gears}`);
      if (this.worldLevel() >= 2) {
        const n = 5 + Math.floor(Math.random() * 6);
        this.save.materials.dianmo = (this.save.materials.dianmo || 0) + n;
        loot.push(`⚫️ 点墨×${n}`);
      }

      if (!enemy.homework && !enemy.exam) {
        const chest = (LEVEL.chests || []).find(c => c.pigKey === enemy.index);
        const alreadyDefeated = this.save.world.pigDefeated.includes(enemy.index);
        const chestOpened = chest && this.save.world.zhongChests.includes(chest.id);
        const firstUnlock = !alreadyDefeated && chest && !chestOpened;
        if (!alreadyDefeated) this.save.world.pigDefeated.push(enemy.index);
        if (firstUnlock) {
          loot.push('🔓 对应宝箱已解锁');
          UI.toast('🐷 王明猪已击败 · 获得 ⚙️×' + gears + ' · 对应宝箱解锁', 2800);
        } else {
          UI.toast('🐷 王明猪已击败 · 获得 ⚙️×' + gears, 1600);
        }
      }
    }

    if (enemy.homework) {
      if (enemy.role === 'math') {
        this.save.materials.dianmo = (this.save.materials.dianmo || 0) + 10;
        loot.push('⚫️ 点墨×10（作业奖励）');
      } else if (enemy.role === 'tech') {
        this.save.materials.gear = (this.save.materials.gear || 0) + 10;
        loot.push('⚙️ 齿轮×10（作业奖励）');
      }
      if (this.homeworkFight && this.homeworkFight.type === enemy.role) {
        this.homeworkFight.remaining--;
        if (this.homeworkFight.remaining <= 0) {
          this.homeworkFight = null;
          this.completeHomework(enemy.role);
        }
      }
    }

    UI.showLoot(loot, enemy.kind === 'pig' ? 2800 : 2000);
    this.saveGame();
  },

  /* ---------------- 交际花尖刺 ---------------- */

  sproutOwner() {
    if (!this.player) return null;
    return this.player.characters.find(c => c.def.id === 'nengrongze' && c.sprout > 0) || null;
  },

  trySpike(dir) {
    const owner = this.sproutOwner();
    if (!owner) return;
    if (this.spikeCd > 0) return;
    this.spikeCd = CFG.sprout.spikeCd;
    this.stats.spike++;
    this.projectiles.push(new Spike(this, owner, dir));
  },

  shieldSplash(ownerState) {
    const p = this.player;
    const cx = p.x;
    const cy = p.y - 25;
    this.effects.push({ type: 'ring', x: cx, y: cy, t: 0, life: 0.4, color: '#8ef0a0' });
    for (const e of this.enemies) {
      if (e.dead) continue;
      if (!circleRect(cx, cy, CFG.shield.splashRadius, e.box())) continue;
      const d = calcDamage(ownerState.atk, this.player.shieldSplashMult || CFG.shield.splashMult, e.def.def, ownerState.def.critRate, ownerState.def.critDmg);
      e.hurt(d.dmg, p.dir, this);
      this.spawnDamage(e.x, e.y - 60, d.dmg, d.crit);
      this.gainUltFor(ownerState, CFG.ult.perHit);
    }
  },

  onCharacterDown() {
    if (this.state !== 'playing') return;
    const p = this.player;
    const n = p.characters.length;
    let next = -1;
    for (let k = 1; k <= n; k++) {
      const i = (p.active + k) % n;
      if (p.characters[i].alive) { next = i; break; }
    }

    if (next === -1) {
      this.onWipe();
      return;
    }

    p.active = next;
    p.switchCd = 0;
    p.invuln = 1.6;
    p.attack = null;
    p.blocking = false;
    p.vx = 0;
    this.stats.autoSwitch++;
    UI.toast(p.ch.def.name + ' 接替战斗');
  },

  onStealthBreak(reason) {
    // 破隐时给一点视觉反馈
    this.effects.push({ type: 'ring', x: this.player.x, y: this.player.y - 30, t: 0, life: 0.3, color: '#9fd7ff' });
  },

  triggerFocus() {
    this.focusTimer = CFG.focus.duration;
    this.effects.push({ type: 'ring', x: this.player.x, y: this.player.y - 30, t: 0, life: 0.4, color: '#d6b3ff' });
  },

  spawnDamage(x, y, dmg, crit, isPlayer) {
    this.texts.push({
      x, y, t: 0, life: 0.75,
      text: String(dmg),
      color: isPlayer ? '#ff7b8a' : (crit ? '#ffd166' : '#ffffff'),
      size: crit ? 26 : 20
    });
  },

  spawnText(x, y, text, color) {
    this.texts.push({ x, y, t: 0, life: 0.9, text, color, size: 18 });
  },

  toast(msg) { UI.toast(msg); },

  /* ---------------- 渲染 ---------------- */

  render() {
    const ctx = this.ctx;
    ctx.save();
    ctx.clearRect(0, 0, CFG.view.w, CFG.view.h);

    if (this.state === 'title' || !this.player) {
      this.drawTitleBackdrop();
      ctx.restore();
      return;
    }

    const cam = this.camera.x;
    const sx = this.shake > 0 ? (Math.random() * 2 - 1) * this.shake : 0;
    const sy = this.shake > 0 ? (Math.random() * 2 - 1) * this.shake * 0.6 : 0;
    ctx.translate(sx, sy);

    this.drawClassroom(cam);
    this.drawPlatforms(cam);
    this.drawLadders(cam);
    this.drawDoor(cam);
    this.drawCheckpoint(cam);
    this.drawChest(cam);
    this.drawZhongChests(cam);
    this.drawKey(cam);
    this.drawExit(cam);
    this.drawNpc(cam);

    for (const e of this.enemies) this.drawEnemy(e, cam);
    this.drawHazards(cam);
    this.drawPlayer(cam);
    this.drawProjectiles(cam);
    this.drawEffects(cam);
    this.drawTexts(cam);
    if (this.state === 'cutscene') this.drawScene(cam);
    if (this.state === 'dialogue') this.drawDialogue(cam);

    ctx.restore();
    this.drawScreenFx();
    this.drawBossBar();
  },

  drawTitleBackdrop() {
    const ctx = this.ctx;
    const g = ctx.createLinearGradient(0, 0, 0, 720);
    g.addColorStop(0, '#131a28');
    g.addColorStop(1, '#080b12');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, 1280, 720);

    ctx.globalAlpha = 0.12;
    ctx.font = '90px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('👻', 300, 560);
    ctx.fillText('🥔', 980, 560);
    ctx.fillText('🐕', 640, 620);
    ctx.globalAlpha = 1;
  },

  drawClassroom(cam) {
    const ctx = this.ctx;

    const wall = ctx.createLinearGradient(0, 0, 0, 660);
    wall.addColorStop(0, '#dcd5c6');
    wall.addColorStop(0.65, '#c3b8a3');
    wall.addColorStop(1, '#a2957d');
    ctx.fillStyle = wall;
    ctx.fillRect(0, 0, 1280, 660);

    // 墙面分格
    ctx.strokeStyle = 'rgba(120, 106, 86, .16)';
    ctx.lineWidth = 2;
    for (let x = 0; x <= LEVEL.width; x += 160) {
      const sx = x - cam;
      if (sx < -10 || sx > 1290) continue;
      ctx.beginPath();
      ctx.moveTo(sx, 0);
      ctx.lineTo(sx, 620);
      ctx.stroke();
    }

    // 窗户
    for (const wx of LEVEL.windows) {
      const sx = wx - cam;
      if (sx < -300 || sx > 1500) continue;
      this.drawWindow(sx, 170, 260, 270);
    }

    // 黑板
    this.drawBlackboard((LEVEL.blackboardX || 240) - cam, 176, 600, 236);

    // 墙面标语
    ctx.save();
    ctx.fillStyle = 'rgba(90, 78, 60, .55)';
    ctx.font = 'bold 20px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('时代之音响彻未来', 1080 - cam, 150);
    ctx.restore();

    // 天花板灯
    for (let x = 240; x < LEVEL.width; x += 460) {
      const sx = x - cam;
      if (sx < -100 || sx > 1400) continue;
      ctx.fillStyle = 'rgba(255, 250, 230, .55)';
      ctx.beginPath();
      ctx.roundRect(sx - 80, 70, 160, 16, 8);
      ctx.fill();
      const glow = ctx.createRadialGradient(sx, 120, 10, sx, 120, 180);
      glow.addColorStop(0, 'rgba(255, 245, 210, .16)');
      glow.addColorStop(1, 'rgba(255, 245, 210, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(sx - 190, 60, 380, 260);
    }

    // 踢脚线
    ctx.fillStyle = '#8b7b63';
    ctx.fillRect(0, 616, 1280, 6);

    // 前景暗角
    const vig = ctx.createRadialGradient(640, 360, 320, 640, 360, 780);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(20, 14, 8, .34)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, 1280, 720);
  },

  drawWindow(x, y, w, h) {
    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = '#f4f0e6';
    ctx.fillRect(x - 8, y - 8, w + 16, h + 16);

    const sky = ctx.createLinearGradient(0, y, 0, y + h);
    sky.addColorStop(0, '#b9e4f4');
    sky.addColorStop(1, '#e3f4f8');
    ctx.fillStyle = sky;
    ctx.fillRect(x, y, w, h);

    // 云
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath();
    ctx.ellipse(x + w * 0.28, y + h * 0.3, 34, 15, 0, 0, Math.PI * 2);
    ctx.ellipse(x + w * 0.42, y + h * 0.27, 26, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(x + w * 0.68, y + h * 0.52, 30, 12, 0, 0, Math.PI * 2);
    ctx.fill();

    // 窗框
    ctx.strokeStyle = '#e8e2d4';
    ctx.lineWidth = 6;
    ctx.strokeRect(x, y, w, h);
    ctx.beginPath();
    ctx.moveTo(x + w / 2, y);
    ctx.lineTo(x + w / 2, y + h);
    ctx.moveTo(x, y + h * 0.55);
    ctx.lineTo(x + w, y + h * 0.55);
    ctx.stroke();

    // 光
    ctx.globalAlpha = 0.13;
    ctx.fillStyle = '#fff6cf';
    ctx.beginPath();
    ctx.moveTo(x, y + h);
    ctx.lineTo(x + w, y + h);
    ctx.lineTo(x + w + 150, 700);
    ctx.lineTo(x - 60, 700);
    ctx.fill();
    ctx.restore();
  },

  drawBlackboard(x, y, w, h) {
    const ctx = this.ctx;
    ctx.save();
    ctx.fillStyle = '#8a6a45';
    ctx.beginPath();
    ctx.roundRect(x - 10, y - 10, w + 20, h + 20, 6);
    ctx.fill();

    ctx.fillStyle = '#2b4a3f';
    ctx.fillRect(x, y, w, h);

    ctx.strokeStyle = 'rgba(255,255,255,.28)';
    ctx.lineWidth = 2;
    ctx.font = 'bold 30px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('高一十班', x + w / 2, y + 78);

    ctx.font = '18px "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,.22)';
    ctx.fillText(LEVEL.blackboardSub || '高一十班', x + w / 2, y + 120);

    ctx.strokeStyle = 'rgba(255,255,255,.12)';
    ctx.beginPath();
    ctx.moveTo(x + 70, y + 150);
    ctx.lineTo(x + w - 70, y + 150);
    ctx.moveTo(x + 70, y + 180);
    ctx.lineTo(x + w - 160, y + 180);
    ctx.stroke();

    // 粉笔槽
    ctx.fillStyle = '#6f5236';
    ctx.fillRect(x, y + h, w, 8);
    ctx.restore();
  },

  drawPlatforms(cam) {
    const ctx = this.ctx;

    for (const p of LEVEL.platforms) {
      const sx = p.x - cam;
      if (sx + p.w < -40 || sx > 1330) continue;

      if (p.type === 'floor') {
        ctx.fillStyle = '#7a5b40';
        ctx.fillRect(sx, p.y, p.w, p.h);
        ctx.fillStyle = '#96714f';
        ctx.fillRect(sx, p.y, p.w, 8);
        ctx.strokeStyle = 'rgba(50, 32, 20, .35)';
        ctx.lineWidth = 2;
        for (let x = p.x; x < p.x + p.w; x += 120) {
          const lx = x - cam;
          ctx.beginPath();
          ctx.moveTo(lx, p.y + 8);
          ctx.lineTo(lx, p.y + p.h);
          ctx.stroke();
        }
        ctx.strokeStyle = 'rgba(255, 230, 190, .12)';
        ctx.beginPath();
        ctx.moveTo(sx, p.y + 8);
        ctx.lineTo(sx + p.w, p.y + 8);
        ctx.stroke();
        continue;
      }

      if (p.type === 'wall') {
        ctx.fillStyle = '#b7aa95';
        ctx.fillRect(sx, p.y, p.w, p.h);
        ctx.fillStyle = 'rgba(255,255,255,.12)';
        ctx.fillRect(sx + 3, p.y + 3, Math.max(2, p.w - 6), Math.max(2, p.h - 6));
        ctx.strokeStyle = 'rgba(90, 76, 58, .45)';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx, p.y, p.w, p.h);
        continue;
      }

      if (p.type === 'desk') {
        // 桌腿
        ctx.fillStyle = '#6d4c33';
        ctx.fillRect(sx + 14, p.y + 12, 10, LEVEL.floorY - p.y - 12);
        ctx.fillRect(sx + p.w - 24, p.y + 12, 10, LEVEL.floorY - p.y - 12);
        // 桌面
        ctx.fillStyle = '#c08d5c';
        ctx.beginPath();
        ctx.roundRect(sx, p.y, p.w, 14, 4);
        ctx.fill();
        ctx.fillStyle = '#a97b52';
        ctx.fillRect(sx + 4, p.y + 6, p.w - 8, 8);
        continue;
      }

      if (p.type === 'shelf') {
        ctx.fillStyle = '#8a6746';
        ctx.beginPath();
        ctx.roundRect(sx, p.y, p.w, p.h, 6);
        ctx.fill();
        ctx.fillStyle = '#6f4f33';
        for (let i = 1; i <= 2; i++) {
          ctx.fillRect(sx + 8, p.y + i * (p.h / 3), p.w - 16, 6);
        }
        const colors = ['#d46a6a', '#e0b45c', '#6aa9d4', '#7fc98a', '#b48ad4'];
        for (let i = 0; i < 12; i++) {
          const bx = sx + 12 + (i % 6) * ((p.w - 24) / 6);
          const by = p.y + Math.floor(i / 6) * (p.h / 3) + 8;
          ctx.fillStyle = colors[i % colors.length];
          ctx.fillRect(bx, by, (p.w - 24) / 6 - 4, 26);
        }
        continue;
      }
    }
  },

  drawCheckpoint(cam) {
    const ctx = this.ctx;
    for (const cp of (LEVEL.checkpoints || [])) {
      const x = cp.x - cam;
      if (x < -60 || x > 1340) continue;
      const active = this.save.world.checkpoints.includes(cp.id);

      ctx.save();
      ctx.fillStyle = '#6a5a48';
      ctx.fillRect(x - 3, cp.y - 120, 6, 120);
      const t = performance.now() / 500;
      ctx.fillStyle = active ? '#4be0a0' : '#b9c6d8';
      ctx.beginPath();
      ctx.moveTo(x + 3, cp.y - 118);
      ctx.lineTo(x + 52 + Math.sin(t) * 4, cp.y - 104);
      ctx.lineTo(x + 3, cp.y - 78);
      ctx.fill();

      if (active) {
        const glow = ctx.createRadialGradient(x, cp.y - 90, 6, x, cp.y - 90, 60);
        glow.addColorStop(0, 'rgba(75, 224, 160, .28)');
        glow.addColorStop(1, 'rgba(75, 224, 160, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(x - 70, cp.y - 160, 140, 140);

        // 恢复机会倒计时
        const until = this.save.world.checkpointHeal[cp.id] || 0;
        const remain = Math.max(0, until - Date.now());
        if (remain > 0) {
          const sec = Math.ceil(remain / 1000);
          const mm = Math.floor(sec / 60);
          const ss = String(sec % 60).padStart(2, '0');
          const label = '恢复机会 ' + mm + ':' + ss;
          ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
          const tw = ctx.measureText(label).width;
          const bw = tw + 20;
          const by = cp.y - 168;
          ctx.fillStyle = 'rgba(8, 16, 22, .82)';
          ctx.beginPath();
          ctx.roundRect(x - bw / 2, by, bw, 24, 9);
          ctx.fill();
          ctx.strokeStyle = 'rgba(110, 220, 170, .45)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = '#b9f5cf';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, x, by + 12);
        } else {
          const label = '恢复机会已就绪';
          ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
          const tw = ctx.measureText(label).width;
          const bw = tw + 20;
          const by = cp.y - 168;
          ctx.fillStyle = 'rgba(8, 16, 22, .72)';
          ctx.beginPath();
          ctx.roundRect(x - bw / 2, by, bw, 24, 9);
          ctx.fill();
          ctx.strokeStyle = 'rgba(120, 200, 255, .35)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = '#9fd7ff';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, x, by + 12);
        }
      }
      ctx.restore();
    }
  },

  drawChest(cam) {
    if (!LEVEL.chest) return;
    const ctx = this.ctx;
    const x = LEVEL.chest.x - cam;
    if (x < -80 || x > 1360) return;

    const isHou = !!LEVEL.chest.bossChest;
    const opened = isHou
      ? this.save.world.houChestOpened
      : (this.chestOpened && this.save.world.chestChocolateTaken);
    const enemiesLeft = this.enemies.some(e => !e.dead && (e.kind === 'dog' || e.kind === 'pig'));
    const unlocked = isHou ? this.save.world.houBossDefeated : !enemiesLeft;
    ctx.save();
    const bob = opened ? 0 : Math.sin(performance.now() / 420) * 3;
    if (!opened && unlocked) {
      const glow = ctx.createRadialGradient(x, LEVEL.floorY - 40, 6, x, LEVEL.floorY - 40, 78);
      glow.addColorStop(0, 'rgba(255, 209, 102, .38)');
      glow.addColorStop(1, 'rgba(255, 209, 102, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(x - 88, LEVEL.floorY - 118, 176, 118);
    }
    ctx.globalAlpha = opened ? 0.45 : 1;
    ctx.font = '66px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('📦', x, LEVEL.floorY - 4 + bob);
    ctx.globalAlpha = 1;

    if (opened) {
      ctx.fillStyle = 'rgba(255,255,255,.4)';
      ctx.font = '12px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('已开启', x, LEVEL.floorY - 76);
    } else if (!unlocked) {
      ctx.font = '26px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.fillText('🔒', x, LEVEL.floorY - 62 + bob);
      ctx.fillStyle = 'rgba(255, 209, 102, .85)';
      ctx.font = '11px "Microsoft YaHei", sans-serif';
      ctx.fillText(isHou ? '击败孙点黑解锁' : '消灭全部敌人解锁', x, LEVEL.floorY - 80);
    } else if (!isHou && this.save.world.chestChocolateTaken === false && this.chestOpened) {
      ctx.fillStyle = 'rgba(255, 233, 176, .9)';
      ctx.font = '11px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('还有 🍫 巧克力', x, LEVEL.floorY - 80);
    }
    ctx.restore();
  },

  drawExit(cam) {
    if (!LEVEL.exit) return;
    const ctx = this.ctx;
    const x = LEVEL.exit.x - cam;
    if (x < -140 || x > 1420) return;
    const locked = !this.levelObjectiveDone();

    ctx.save();
    ctx.fillStyle = '#3a2a1e';
    ctx.beginPath();
    ctx.roundRect(x - 52, LEVEL.floorY - 116, 104, 116, 8);
    ctx.fill();

    ctx.strokeStyle = locked ? '#b06a4a' : '#ffd166';
    ctx.lineWidth = 4;
    ctx.strokeRect(x - 46, LEVEL.floorY - 110, 92, 110);

    if (locked) {
      ctx.globalAlpha = 0.9;
      ctx.fillStyle = '#3a2a1e';
      ctx.fillRect(x - 46, LEVEL.floorY - 110, 92, 110);
      ctx.globalAlpha = 1;
      ctx.font = '30px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🔒', x, LEVEL.floorY - 66);
      ctx.fillStyle = '#e8b48f';
      ctx.font = 'bold 13px "Microsoft YaHei", sans-serif';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('完成关卡目标后开启', x, LEVEL.floorY - 128);
    } else {
      ctx.fillStyle = '#ffe6ac';
      ctx.font = 'bold 16px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('出口 →', x + 10, LEVEL.floorY - 130);
    }
    ctx.restore();
  },

  drawNpc(cam) {
    const ctx = this.ctx;
    for (const npc of (LEVEL.npcs || [])) {
      if (!this.npcAvailable(npc)) continue;
      if (npc.id === 'nengrongze' && this.npcTalked) continue;
      if (npc.id === 'sundianhei' && (this.save.world.houBossTalked || this.save.world.houBossDefeated)) continue;
      const x = npc.x - cam;
      if (x < -120 || x > 1400) continue;
      const big = !!npc.big;
      const br = big ? 42 : 25;
      // 大体型 NPC（孙点黑）与 Boss 保持同一圆心与 emoji 尺寸
      const cy = npc.y - (big ? 44 : 25);

      ctx.save();
      ctx.fillStyle = 'rgba(20, 12, 8, .3)';
      ctx.beginPath();
      ctx.ellipse(x, npc.y - 3, big ? 42 : 20, big ? 11 : 6, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = npc.bg || '#dff1d6';
      ctx.beginPath();
      ctx.arc(x, cy, br, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = npc.edge || '#8fb47c';
      ctx.lineWidth = 3;
      ctx.stroke();

      ctx.font = (big ? this.bodyEmojiSize(42) : 27) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(npc.emoji, x, cy + (big ? 6 : 1));

      ctx.fillStyle = 'rgba(220, 240, 220, .85)';
      ctx.font = '12px "Microsoft YaHei", sans-serif';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText(npc.name, x, cy - (big ? 54 : 34));

      if (this.state === 'playing' &&
          Math.abs(this.player.x - npc.x) <= 76 &&
          Math.abs(this.player.y - npc.y) <= 110) {
        const opts = this.npcOptions(npc);
        let sel = this.npcSel[npc.id] || 0;
        if (sel >= opts.length) sel = 0;
        const startY = cy - 78 - (opts.length - 1) * 30;
        ctx.font = 'bold 13px "Microsoft YaHei", sans-serif';
        opts.forEach((opt, i) => {
          const label = Input.keyNameOf('KeyF') + ' ' + opt.label;
          const tw = ctx.measureText(label).width;
          const bw = Math.max(78, tw + 24);
          const by = startY + i * 30;
          const active = i === sel;
          ctx.fillStyle = active ? 'rgba(255, 209, 102, .92)' : 'rgba(8, 12, 20, .82)';
          ctx.beginPath();
          ctx.roundRect(x - bw / 2, by, bw, 26, 8);
          ctx.fill();
          ctx.strokeStyle = active ? '#fff0c4' : 'rgba(255, 209, 102, .5)';
          ctx.lineWidth = 1.5;
          ctx.stroke();
          ctx.fillStyle = active ? '#2a2416' : '#ffe6ac';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(label, x, by + 13);
        });
        if (opts.length > 1) {
          ctx.fillStyle = 'rgba(200, 220, 245, .7)';
          ctx.font = '10px "Microsoft YaHei", sans-serif';
          ctx.fillText('滚轮切换', x, startY + opts.length * 30 + 6);
        }
      }
      ctx.restore();
    }
  },

  drawLadders(cam) {
    const ctx = this.ctx;
    for (const l of (LEVEL.ladders || [])) {
      const x = l.x - cam;
      if (x < -60 || x > 1340) continue;
      const top = l.top;
      const bot = l.bottom;
      ctx.save();
      ctx.strokeStyle = '#8a6a48';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(x - 16, top);
      ctx.lineTo(x - 16, bot);
      ctx.moveTo(x + 16, top);
      ctx.lineTo(x + 16, bot);
      ctx.stroke();
      ctx.strokeStyle = '#b08a5e';
      ctx.lineWidth = 4;
      for (let y = top + 14; y < bot; y += 26) {
        ctx.beginPath();
        ctx.moveTo(x - 16, y);
        ctx.lineTo(x + 16, y);
        ctx.stroke();
      }
      if (this.state === 'playing' && !this.player.onLadder &&
          Math.abs(this.player.x - l.x) < 56 &&
          this.player.y >= l.top - 10 && this.player.y <= l.bottom + 12) {
        ctx.fillStyle = 'rgba(8, 12, 20, .78)';
        ctx.beginPath();
        ctx.roundRect(x - 75, this.player.y - 96, 150, 24, 8);
        ctx.fill();
        ctx.fillStyle = '#ffe6ac';
        ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('W / S 攀爬 · A / D 离开', x, this.player.y - 84);
      }
      ctx.restore();
    }
  },

  drawDoor(cam) {
    const door = LEVEL.door;
    if (!door || this.save.world.lockOpened) return;
    const ctx = this.ctx;
    const x = door.x - cam;
    if (x < -120 || x > 1400) return;
    const cx = x + door.w / 2;
    const baseY = door.y + door.h;

    ctx.save();
    ctx.fillStyle = '#4a3524';
    ctx.beginPath();
    ctx.roundRect(x - 6, door.y - 4, door.w + 12, door.h + 4, 5);
    ctx.fill();
    ctx.font = '54px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('🚪', cx, baseY - 2);

    const bob = Math.sin(performance.now() / 360) * 2;
    ctx.font = '30px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.fillText('🔒', cx, door.y - 8 + bob);

    ctx.fillStyle = 'rgba(255, 230, 172, .85)';
    ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
    ctx.fillText('上锁', cx, door.y - 46);

    const near = this.state === 'playing' &&
      Math.abs(this.player.x - cx) < 120 &&
      Math.abs(this.player.y - baseY) < 110;
    if (near) {
      const slot = ['Z', 'X', 'C', 'V'].find(s => this.save.itemSlots[s] === 'classroomKey');
      let hint = '需要 🔑 十班的钥匙';
      if (slot) hint = '按 ' + slot + ' 开锁';
      else if (this.save.inventory.items.includes('classroomKey')) hint = '按 B 在背包装备 🔑';
      ctx.fillStyle = 'rgba(8, 12, 20, .82)';
      ctx.beginPath();
      ctx.roundRect(cx - 88, door.y - 88, 176, 26, 8);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 209, 102, .55)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.fillStyle = '#ffe6ac';
      ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(hint, cx, door.y - 75);
    }
    ctx.restore();
  },

  drawZhongChests(cam) {
    const ctx = this.ctx;
    for (const c of (LEVEL.chests || [])) {
      const x = c.x - cam;
      if (x < -100 || x > 1380) continue;
      const unlocked = this.save.world.pigDefeated.includes(c.pigKey);
      const opened = this.save.world.zhongChests.includes(c.id);
      const bob = opened ? 0 : Math.sin(performance.now() / 420) * 3;

      if (!opened && unlocked) {
        const glow = ctx.createRadialGradient(x, c.y - 34, 6, x, c.y - 34, 70);
        glow.addColorStop(0, 'rgba(255, 209, 102, .34)');
        glow.addColorStop(1, 'rgba(255, 209, 102, 0)');
        ctx.fillStyle = glow;
        ctx.fillRect(x - 80, c.y - 104, 160, 110);
      }

      ctx.save();
      ctx.globalAlpha = opened ? 0.45 : 1;
      ctx.font = '58px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'alphabetic';
      ctx.fillText('📦', x, c.y - 4 + bob);
      ctx.globalAlpha = 1;

      if (!unlocked) {
        ctx.font = '26px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
        ctx.fillText('🔒', x, c.y - 62 + bob);
        ctx.fillStyle = 'rgba(255, 209, 102, .85)';
        ctx.font = '11px "Microsoft YaHei", sans-serif';
        ctx.fillText('击败王明猪解锁', x, c.y - 80);
      } else if (opened) {
        ctx.fillStyle = 'rgba(255,255,255,.45)';
        ctx.font = '12px "Microsoft YaHei", sans-serif';
        ctx.fillText('已开启', x, c.y - 72);
      } else {
        ctx.fillStyle = 'rgba(255, 230, 172, .85)';
        ctx.font = '12px "Microsoft YaHei", sans-serif';
        ctx.fillText('靠近开启', x, c.y - 72);
      }
      ctx.restore();
    }
  },

  drawKey(cam) {
    const key = LEVEL.key;
    if (!key || this.save.world.keyTaken || this.save.world.lockOpened) return;
    const ctx = this.ctx;
    const x = key.x - cam;
    if (x < -100 || x > 1380) return;
    const bob = Math.sin(performance.now() / 380) * 5;

    ctx.save();
    const glow = ctx.createRadialGradient(x, key.y - 34, 4, x, key.y - 34, 52);
    glow.addColorStop(0, 'rgba(255, 209, 102, .4)');
    glow.addColorStop(1, 'rgba(255, 209, 102, 0)');
    ctx.fillStyle = glow;
    ctx.fillRect(x - 64, key.y - 98, 128, 128);
    ctx.font = '34px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';

    ctx.textBaseline = 'middle';

    ctx.fillStyle = 'rgba(255, 230, 172, .9)';
    ctx.font = '12px "Microsoft YaHei", sans-serif';
    ctx.textBaseline = 'alphabetic';
