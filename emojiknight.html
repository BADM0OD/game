  /* ---------------- 角色面板 ---------------- */

  showCharacter(game) {
    const p = game.player;
    const ch = p.characters.find(c => c.def.id === this.charId) || p.ch;
    this.charId = ch.def.id;
    const d = ch.def;
    const prog = game.save.progress[d.id] || { level: 1, e: 1, q: 1 };
    const w = CFG.weapons[ch.weapon] || CFG.weapons.fist;

    let detail = '';
    if (this.charView === 'equip') {
      const eq = game.save.inventory.equipment;
      const rows = [`<div class="itemRow equipRow" data-equip=""><div class="itemIcon">👊</div><div class="itemInfo"><div class="itemName">空手</div><div class="itemDesc">攻击距离不变 · 普攻 50% / 0.4s · 重击 75% / 0.75s</div></div><div class="itemTag">${!ch.weapon ? '装备中' : ''}</div></div>`]
        .concat(eq.map(id => {
          const ww = CFG.weapons[id];
          if (!ww) return '';
          const holder = p.characters.find(c => c.weapon === id);
          return `<div class="itemRow equipRow" data-equip="${id}">
            <div class="itemIcon">${ww.emoji}</div>
            <div class="itemInfo"><div class="itemName">${ww.name}</div><div class="itemDesc">${ww.desc || `普攻 ${Math.round(ww.light.mult * 100)}% / ${ww.light.time}s · 重击 ${Math.round(ww.heavy.mult * 100)}% / ${ww.heavy.time}s`}</div></div>
            <div class="itemTag">${ch.weapon === id ? '装备中' : (holder ? '已装备：' + holder.def.name : '')}</div>
          </div>`;
        })).join('');
      detail = `<div class="detailTitle">装备 · 点击装备</div><div class="equipList">${rows}</div>`;
    } else if (this.charView === 'upgrade') {
      detail = this.buildUpgrade(game, d, prog, ch);
    } else {
      detail = `<div class="detailTitle">属性</div>
        <div class="kv"><span>生命值</span><b>${Math.ceil(ch.hp)} / ${ch.hpMax}</b></div>
        <div class="kv"><span>攻击力</span><b>${ch.atk}</b></div>
        <div class="kv"><span>防御力</span><b>${ch.defense}</b></div>
        <div class="kv"><span>暴击率</span><b>${Math.round(d.critRate * 100)}%</b></div>
        <div class="kv"><span>暴击伤害</span><b>${Math.round(d.critDmg * 100)}%</b></div>
        <div class="kv"><span>终结技充能</span><b>${Math.floor(ch.ult)} / ${d.ultMax}</b></div>
        <div class="kv"><span>武器</span><b>${w.emoji} ${w.name}</b></div>`;
    }

    const tabs = p.characters.map(c => `
      <button class="charTab ${c.def.id === d.id ? 'on' : ''}" data-char="${c.def.id}">
        <span class="ctAvatar" style="background:${c.def.bg};border-color:${c.def.edge}">${c.def.emoji}</span>
        <span class="ctName">${c.def.name}</span>
        <span class="ctLv">Lv.${c.level}</span>
      </button>`).join('');

    this.showOverlay(`
      <h2>角色面板</h2>
      <div class="charTabs">${tabs}</div>
      <div class="charPanel">
        <div class="charLeft">
          <div class="charAvatar" style="background:${d.bg};border-color:${d.edge}">${d.emoji}</div>
          <div class="charBigName">${d.name}</div>
          <div class="charLv">Lv.${ch.level}</div>
        </div>
        <div class="charRight">
          <div class="charStats">${detail}</div>
          <div class="charBtns">
            <button id="btnCharEquip" class="tab ${this.charView === 'equip' ? 'on' : ''}">装备</button>
            <button id="btnCharUpgrade" class="tab ${this.charView === 'upgrade' ? 'on' : ''}">升级</button>
          </div>
        </div>
      </div>
      <div class="btnrow"><button id="btnCharClose" class="ghost">返回</button></div>
    `);

    document.querySelectorAll('[data-char]').forEach(tab => {
      tab.onclick = () => {
        this.charId = tab.dataset.char;
        this.upgSel = 'level';
        this.upgOpen = { e: false, q: false };
        SFX.play('click');
        this.showCharacter(game);
      };
    });
    document.querySelectorAll('[data-equip]').forEach(row => {
      row.onclick = () => {
        game.equipWeapon(row.dataset.equip || null, this.charId);
      };
    });
    document.querySelectorAll('[data-sel]').forEach(card => {
      card.onclick = () => {
        const kind = card.dataset.sel;
        this.upgSel = kind;
        if (kind !== 'level') {
          this.upgOpen[kind] = !this.upgOpen[kind];
          if (this.upgOpen[kind]) game.stats.skillViewed++;
        }
        SFX.play('click');
        this.showCharacter(game);
      };
    });
    const buUp = document.getElementById('btnUpgrade');
    if (buUp) buUp.onclick = () => { game.upgradeSelected(this.upgSel, this.charId); };
    const be = document.getElementById('btnCharEquip');
    const bu = document.getElementById('btnCharUpgrade');
    const bc = document.getElementById('btnCharClose');
    if (be) be.onclick = () => { this.charView = 'equip'; SFX.play('click'); this.showCharacter(game); };
    if (bu) bu.onclick = () => { this.charView = 'upgrade'; SFX.play('click'); this.showCharacter(game); };
    if (bc) bc.onclick = () => { this.charView = 'stats'; SFX.play('click'); game.closePanel(); };
  },

  buildUpgrade(game, d, prog, ch) {
    const sel = this.upgSel;
    const skillCfg = CFG.upgrade.skills[d.id] || {};
    const eUp = skillCfg.e && skillCfg.e.upgradable !== false;
    const qUp = skillCfg.q && skillCfg.q.upgradable !== false;
    const eOpen = this.upgOpen.e;
    const qOpen = this.upgOpen.q;

    let eNow = '';
    if (d.id === 'nengrongze') {
      const ratio = CFG.shield.hpRatio + CFG.shield.hpRatioStep * (prog.e - 1);
      const shieldVal = Math.round(ch.hpMax * ratio);
      const splash = Math.round((CFG.shield.splashMult + CFG.shield.splashStep * (prog.e - 1)) * 100);
      eNow = `<div class="upgNow">当前护盾：${shieldVal}　反伤：${splash}%</div>`;
    }

    let qNow = '';
    if (d.id === 'liuhanyi') {
      const step = CFG.upgrade.skills.liuhanyi.q.multStep;
      const cur = CFG.awake.paperMult + step * (prog.q - 1);
      const maxLv = game.maxSkillLevel();
      const next = prog.q < maxLv ? cur + step : null;
      qNow = `<div class="upgNow">当前倍率：${Math.round(cur * 100)}%</div>` +
        `<div class="upgNow">下一级倍率：${next ? Math.round(next * 100) + '%' : '已满级'}</div>`;
    } else if (d.id === 'nengrongze') {
      const mult = CFG.sprout.spikeMult + CFG.sprout.spikeStep * (prog.q - 1);
      qNow = `<div class="upgNow">当前尖刺倍率：${Math.round(mult * 100)}%</div>`;
    }

    return `
      <div class="detailTitle">升级 · 单击选中，再点击下方按钮</div>
      <div class="upgCard ${sel === 'level' ? 'sel' : ''}" data-sel="level">
        <div class="upgCardHead"><span class="upgCardName">角色等级</span><b>Lv.${prog.level} / ${game.maxCharLevel()}</b></div>
      </div>
      <div class="upgCard ${sel === 'e' ? 'sel' : ''}" data-sel="e">
        <div class="upgCardHead">
          <span class="upgCardName">E · ${d.e.name}</span>
          <b>Lv.${prog.e}${eUp ? ' / ' + game.maxSkillLevel() : '<span class="upgNo">不可升级</span>'}</b>
        </div>
        <div class="upgCardDesc ${eOpen ? 'open' : ''}">${eOpen ? (d.e.desc || '暂无说明') + eNow : '点击展开技能介绍'}</div>
      </div>
      <div class="upgCard ${sel === 'q' ? 'sel' : ''}" data-sel="q">
        <div class="upgCardHead">
          <span class="upgCardName">Q · ${d.q.name}</span>
          <b>Lv.${prog.q}${qUp ? ' / ' + game.maxSkillLevel() : '<span class="upgNo">不可升级</span>'}</b>
        </div>
        <div class="upgCardDesc ${qOpen ? 'open' : ''}">${qOpen ? (d.q.desc || '暂无说明') + qNow : '点击展开技能介绍'}</div>
      </div>
      <div class="upgFoot">${this.upgradeFoot(game, sel, d.id)}</div>`;
  },

  upgradeFoot(game, sel, charId) {
    const d = CFG.characters[charId] || game.player.ch.def;
    const skillCfg = CFG.upgrade.skills[d.id] || {};
    if (sel !== 'level' && (!skillCfg[sel] || skillCfg[sel].upgradable === false)) {
      return `<div class="upgCost">该项暂不可升级</div>
        <button class="upgBtn" disabled>无法升级</button>`;
    }
    const cost = game.upgradeCost(sel, d.id);
    if (!cost) {
      return `<div class="upgCost">已达到最高等级</div>
        <button class="upgBtn" disabled>已满级</button>`;
    }
    const ok = game.canAfford(cost);
    const parts = [`💰 ${cost.gold}/${game.save.gold}`];
    if (cost.mat) {
      const info = game.materialInfo(cost.mat);
      parts.push(`${info.emoji} ${cost.matN}/${game.save.materials[cost.mat] || 0}`);
    }
    return `<div class="upgCost">升级消耗：${parts.join('　')}</div>
      <button class="upgBtn" id="btnUpgrade" ${ok ? '' : 'disabled'}>${ok ? '升级' : '资源不足'}</button>`;
  },

  /* ---------------- 地图 ---------------- */

  showMap(game) {
    const info = game.mapInfo();
    const popup = `
      <div id="mapPopup" class="mapPopup hidden">
        <div class="mapPopupTitle">传送锚点</div>
        ${info.anchors.map(a => `
          <div class="tpRow ${a.unlocked ? 'on' : 'locked'} ${a.current ? 'cur' : ''}" data-tp="${a.id}">
            <span class="tpIcon">${a.unlocked ? '📍' : '🔒'}</span>
            <span class="tpName">${a.name}</span>
            <span class="tpState">${a.unlocked ? (a.current ? '当前区域' : '传送') : '未激活'}</span>
          </div>`).join('')}
      </div>`;

    this.showOverlay(`
      <h2>地图</h2>
      <div class="sub">点击 🏫 展开传送锚点</div>
      <div class="mapBoard">
        <div class="mapFog"></div>
        <div class="mapClearing"></div>
        <div class="fogTag f1">？？？</div>
        <div class="fogTag f2">？？？</div>
        <div class="fogTag f3">未设计区域</div>
        <div class="mapNodeWrap">
          <div class="mapNodeName">${info.name}</div>
          <button class="mapNode on" id="mapNode">${info.emoji}</button>
        </div>
        ${popup}
      </div>
      <div class="btnrow"><button id="btnMapClose" class="ghost">返回</button></div>
    `);

    const nodeEl = document.getElementById('mapNode');
    const popupEl = document.getElementById('mapPopup');
    if (nodeEl && popupEl) {
      nodeEl.onclick = () => {
        SFX.play('click');
        popupEl.classList.toggle('hidden');
      };
    }
    document.querySelectorAll('[data-tp]').forEach(row => {
      row.onclick = () => {
        if (!row.classList.contains('on')) {
          UI.toast('该传送锚点尚未解锁');
          return;
        }
        game.teleportTo(row.dataset.tp);
      };
    });
    const close = document.getElementById('btnMapClose');
    if (close) close.onclick = () => { SFX.play('click'); game.closePanel(); };
  },

  /* ---------------- 结算 ---------------- */

  showClear(game, firstClear) {
    this.showOverlay(`
      <h2>关卡完成 · ${LEVEL.name}</h2>
      <div class="sub">秘境试炼通过</div>
      <div class="btnrow">
        <button id="btnClearMap">返回地图</button>
        <button id="btnClearSave">存档</button>
        <button id="btnTitle" class="ghost">返回标题</button>
      </div>
    `);

    const bm = document.getElementById('btnClearMap');
    const bs = document.getElementById('btnClearSave');
    const bt = document.getElementById('btnTitle');
    if (bm) bm.onclick = () => { SFX.play('click'); game.openMapFromClear(); };
    if (bs) bs.onclick = () => { SFX.play('click'); game.openClearSave(); };
    if (bt) bt.onclick = () => { SFX.play('click'); game.toTitle(); };
  },

  showWipe() {
    this.showOverlay(`
      <h2>全队阵亡</h2>
      <div class="sub">正在返回检查点……</div>
    `);
  }
};

</script>
<script>
'use strict';

const Game = {
  canvas: null,
  ctx: null,
  state: 'title',
  player: null,
  levelId: 'qian',
  enemies: [],
  projectiles: [],
  hazards: [],
  effects: [],
  texts: [],
  itemCds: {},
  camera: { x: 0 },
  focusTimer: 0,
  hitstop: 0,
  shake: 0,
  hurtFlash: 0,
  tutorialIndex: 0,
  tutorialHoldUntil: 0,
  tutorialReplay: false,
  chestOpened: false,
  checkpointActive: false,
  checkpointId: null,
  checkpointX: LEVEL.spawn.x,
  checkpointY: LEVEL.spawn.y,
  wipeTimer: 0,
  cleared: false,
  save: null,
  last: 0,
  stats: null,
  introIndex: 0,
  introGuardAt: 0,
  npcTalked: false,
  npcSel: {},
  dialogue: null,
  panel: null,
  menuFrom: 'playing',
  settingsFrom: 'title',
  skipUpdate: false,

  INTRO: [
    '随着互联网的发展，各种各样的思想，理论，迷因等精神产物层出不穷，人类世界的精神能量迅速膨胀。',
    '庞大的精神能量进入了现实，在现实中产生了许多秘境。',
    '秘境中释放出了各种各样的怪物，只有通过秘境的试炼，取走，封印，或破坏秘境核心才能消除危害。',
    '有些人觉醒了特殊的能力，可以进入秘境挑战，这些人被称为骑士。',
    '骑士有很多不同的种类，emoji骑士已经迫不及待了',
    '2025年9月1日，第一位emoji骑士勇敢地闯入了控江秘境',
    '开始你的冒险吧'
  ],

  init() {
    this.canvas = document.getElementById('game');
    this.ctx = this.canvas.getContext('2d');

    Input.init(this.canvas);
    SFX.init();
    UI.init();
    this.save = this.freshSave();
    this.hasLoadedSave = false;
    try {
      const raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        this.save = this.normalizeSave(JSON.parse(raw));
        this.hasLoadedSave = true;
      }
    } catch (e) { /* 忽略损坏的本地存档 */ }
    this.resetStats();

    window.addEventListener('resize', () => this.resize());
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && this.player) this.saveGame();
    });
    window.addEventListener('beforeunload', () => {
      if (this.player) this.saveGame();
    });
    this.resize();

    UI.showTitle(this);
    this.bindTitle();

    requestAnimationFrame((t) => this.loop(t));
  },

  resize() {
    const stage = document.getElementById('stage');
    const s = Math.min(window.innerWidth / CFG.view.w, window.innerHeight / CFG.view.h);
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  },

  /* ---------------- 存档 ---------------- */

  freshSave() {
    return {
      version: SAVE_VERSION,
      unlocked: ['liuhanyi'],
      gold: 0,
      saveName: '控江异闻',
      avatar: '👻',
      materials: { goldenPythonSkin: 0, dianmo: 0, haochengji: 0, gear: 0, music: 0 },
      inventory: { equipment: [], items: [], materials: [] },
      itemCounts: {},
      itemSlots: { Z: null, X: null, C: null, V: null },
      equipped: {},
      quests: {
        main: [{
          id: 'main1', name: '控江异闻',
          desc: '通过控江秘境的试炼，抵达高一十班的出口。', status: 'active'
        }],
        side: [],
        commission: []
      },
      progress: { liuhanyi: { level: 1, e: 1, q: 1 } },
      world: {
        chestOpened: false,
        enemyRespawn: {},
        maps: [],
        checkpoints: [],
        tutorialDone: false,
        checkpointHeal: {},
        keyTaken: false,
        lockOpened: false,
        litouTalked: false,
        gotMathBook: false,
        zhongIntroShown: false,
        zhongGuideDone: false,
        houBossDefeated: false,
        houBossTalked: false,
        houChestOpened: false,
        tearsQuest: 0,
        homeworkUnlocked: false,
        sunGuideDone: false,
        pigDefeated: [],
        zhongChests: [],
        chestChocolateTaken: false,
        qianCleared: false,
        tutorialRedo: true,
        itemsUsed: 0,
        worldLevel: 1,
        worldExp: 0,
        questExp: {},
        liumoJoined: false,
        examDone: false
      },
      runtime: null,
      records: {
        kills: 0,
        dogKills: 0,
        pigKills: 0,
        homeworkDone: 0,
        maxGold: 0,
        weaponKills: {}
      },
      achievements: {}
    };
  },

  normalizeSave(data) {
    const base = this.freshSave();
    if (!data || typeof data !== 'object') return base;

    // 世界等级与上限（旧存档没有时按 1 级处理）
    const wlvl = Math.max(1, Math.floor(Number(data.world && data.world.worldLevel) || 1));
    const capLv = CFG.upgrade.level.maxPerWorld * wlvl;
    const capSkill = CFG.upgrade.skillMaxPerWorld * wlvl;
    let refundGold = 0;
    const refundMats = {};

    if (typeof data.saveName === 'string' && data.saveName.trim()) {
      base.saveName = data.saveName.trim().slice(0, 24);
    }
    if (typeof data.avatar === 'string' && AVATARS.includes(data.avatar)) {
      base.avatar = data.avatar;
    }

    if (Array.isArray(data.unlocked) && data.unlocked.length) {
      base.unlocked = data.unlocked.filter(id => CFG.characters[id]);
      if (!base.unlocked.length) base.unlocked = ['liuhanyi'];
    }
    if (typeof data.gold === 'number') base.gold = Math.max(0, Math.floor(data.gold));
    if (data.materials && typeof data.materials === 'object') {
      base.materials.goldenPythonSkin = Math.max(0, data.materials.goldenPythonSkin || 0);
      base.materials.dianmo = Math.max(0, data.materials.dianmo || 0);
      base.materials.haochengji = Math.max(0, data.materials.haochengji || 0);
      base.materials.gear = Math.max(0, data.materials.gear || 0);
      base.materials.music = Math.max(0, data.materials.music || 0);
    }
    if (data.inventory && typeof data.inventory === 'object') {
      if (Array.isArray(data.inventory.equipment)) {
        base.inventory.equipment = data.inventory.equipment.filter(id => CFG.weapons[id]);
      }
      if (Array.isArray(data.inventory.items)) {
        base.inventory.items = [...new Set(data.inventory.items)]
          .filter(id => typeof id === 'string' && CFG.items[id]);
      }
      if (Array.isArray(data.inventory.materials)) base.inventory.materials = data.inventory.materials;
    }
    if (data.itemCounts && typeof data.itemCounts === 'object') {
      for (const id in data.itemCounts) {
        if (!base.inventory.items.includes(id)) continue;
        const n = Math.floor(Number(data.itemCounts[id]));
        if (Number.isFinite(n) && n > 0) base.itemCounts[id] = n;
      }
    }
    for (const id of base.inventory.items) {
      if (!base.itemCounts[id]) base.itemCounts[id] = 1;
    }
    if (data.itemSlots && typeof data.itemSlots === 'object') {
      for (const slot of ['Z', 'X', 'C', 'V']) {
        const id = data.itemSlots[slot];
        if (typeof id === 'string' && base.inventory.items.includes(id)) base.itemSlots[slot] = id;
      }
    }
    if (data.equipped && typeof data.equipped === 'object') {
      for (const id in data.equipped) {
        if (CFG.characters[id] && CFG.weapons[data.equipped[id]]) base.equipped[id] = data.equipped[id];
      }
    }
    if (data.quests && typeof data.quests === 'object') {
      for (const type of ['main', 'side', 'commission']) {
        if (Array.isArray(data.quests[type])) {
          base.quests[type] = data.quests[type].filter(q => q && typeof q.name === 'string');
        }
      }
    }
    const mainQuest = base.quests.main.find(q => q && q.id === 'main1');
    if (mainQuest) mainQuest.name = '控江异闻';
    if (data.progress && typeof data.progress === 'object') {
      for (const id in data.progress) {
        if (!CFG.characters[id]) continue;
        const p = data.progress[id] || {};
        const skillCfg = CFG.upgrade.skills[id] || {};
        const oldLevel = Math.max(1, Math.floor(Number(p.level) || 1));
        const oldE = Math.max(1, Math.floor(Number(p.e) || 1));
        const oldQ = Math.max(1, Math.floor(Number(p.q) || 1));
        // 世界等级降低后，超出上限的等级退回金币与材料
        for (let l = capLv; l < oldLevel; l++) refundGold += l * CFG.upgrade.level.goldBase;
        for (const kind of ['e', 'q']) {
          const cfg = skillCfg[kind];
          if (!cfg || cfg.upgradable === false) continue;
          const old = kind === 'e' ? oldE : oldQ;
          for (let l = capSkill; l < old; l++) {
            refundGold += l * CFG.upgrade.skillGoldBase;
            const mat = cfg.mat || 'dianmo';
            refundMats[mat] = (refundMats[mat] || 0) + CFG.upgrade.skillMatStart + (l - 1) * CFG.upgrade.skillMatStep;
          }
        }
        base.progress[id] = {
          level: Math.min(capLv, oldLevel),
          e: Math.min(capSkill, oldE),
          q: Math.min(capSkill, oldQ)
        };
      }
    }
    if (refundGold) base.gold += refundGold;
    for (const m in refundMats) base.materials[m] = (base.materials[m] || 0) + refundMats[m];
    if (data.world && typeof data.world === 'object') {
      base.world.chestOpened = !!data.world.chestOpened;
      if (data.world.enemyRespawn && typeof data.world.enemyRespawn === 'object') {
        for (const k in data.world.enemyRespawn) {
          const v = Number(data.world.enemyRespawn[k]);
          if (!isFinite(v) || v <= 0) continue;
          const key = /^\d+$/.test(k) ? 'qian:' + k : k;
          base.world.enemyRespawn[key] = v;
        }
      }
      if (Array.isArray(data.world.maps)) {
        const alias = { classroom: 'qian' };
        base.world.maps = data.world.maps
          .map(id => alias[id] || id)
          .filter(id => LEVELS[id]);
      }
      if (Array.isArray(data.world.checkpoints)) {
        const alias = { 'classroom-cp': 'qian-cp' };
        const valid = ANCHORS.map(a => a.id);
        base.world.checkpoints = data.world.checkpoints
          .map(id => alias[id] || id)
          .filter(id => valid.includes(id));
      }
      base.world.tutorialDone = !!data.world.tutorialDone;
      // 旧版本存档：已通过教学关的，强制重走一遍新指引（其他进度不变）
      if (base.world.tutorialDone && !data.world.tutorialRedo) {
        this.tutorialReplay = true;
        base.world.tutorialDone = false;
      }
      base.world.tutorialRedo = true;
      base.world.qianCleared = !!data.world.qianCleared || base.world.maps.includes('qian');
      base.world.chestChocolateTaken = !!data.world.chestChocolateTaken;
      base.world.itemsUsed = Math.max(0, Math.floor(Number(data.world.itemsUsed) || 0));
      base.world.worldLevel = wlvl;
      base.world.worldExp = Math.max(0, Math.floor(Number(data.world.worldExp) || 0));
      base.world.liumoJoined = !!data.world.liumoJoined;
      base.world.examDone = !!data.world.examDone || wlvl >= 2;
      base.world.questExp = (data.world.questExp && typeof data.world.questExp === 'object')
        ? Object.assign({}, data.world.questExp) : {};
      if (base.world.liumoJoined && !base.unlocked.includes('liumo')) base.unlocked.push('liumo');
      if (base.world.maps.includes('qian') && !base.world.maps.includes('zhong')) {
        base.world.maps.push('zhong');
      }
      if (base.world.maps.includes('zhong') && !base.world.checkpoints.includes('zhong-start')) {
        base.world.checkpoints.push('zhong-start');
      }
      if (data.world.checkpointHeal && typeof data.world.checkpointHeal === 'object') {
        for (const k in data.world.checkpointHeal) {
          const v = Number(data.world.checkpointHeal[k]);
          if (isFinite(v) && v > 0) base.world.checkpointHeal[k] = v;
        }
      }
      if (typeof data.world.checkpointHealAt === 'number' && data.world.checkpointHealAt > 0) {
        base.world.checkpointHeal['qian-cp'] = data.world.checkpointHealAt;
      }
      base.world.keyTaken = !!data.world.keyTaken;
      base.world.lockOpened = !!data.world.lockOpened;
      base.world.litouTalked = !!data.world.litouTalked;
      base.world.gotMathBook = !!data.world.gotMathBook;
      base.world.zhongIntroShown = !!data.world.zhongIntroShown;
      base.world.zhongGuideDone = !!data.world.zhongGuideDone;
      base.world.houBossDefeated = !!data.world.houBossDefeated;
      base.world.houBossTalked = !!data.world.houBossTalked;
      base.world.houChestOpened = !!data.world.houChestOpened;
      base.world.tearsQuest = Math.max(0, Math.min(2, Math.floor(Number(data.world.tearsQuest) || 0)));
      base.world.homeworkUnlocked = !!data.world.homeworkUnlocked;
      base.world.sunGuideDone = !!data.world.sunGuideDone || base.world.houBossDefeated;
      if (base.world.zhongGuideDone) {
        if (!base.world.maps.includes('hou')) base.world.maps.push('hou');
        if (!base.world.checkpoints.includes('hou-start')) base.world.checkpoints.push('hou-start');
      }
      if (Array.isArray(data.world.pigDefeated)) {
        base.world.pigDefeated = data.world.pigDefeated.filter(id => typeof id === 'string');
      }
      if (Array.isArray(data.world.zhongChests)) {
        const valid = (LEVELS.zhong.chests || []).map(c => c.id);
        base.world.zhongChests = data.world.zhongChests.filter(id => valid.includes(id));
      }
      if (base.world.gotMathBook && !base.inventory.items.includes('mathbook')) {
        base.inventory.items.push('mathbook');
      }
      if (base.world.keyTaken && !base.world.lockOpened &&
          !base.inventory.items.includes('classroomKey')) {
        base.inventory.items.push('classroomKey');
      }
      if (base.world.lockOpened) {
        base.inventory.items = base.inventory.items.filter(id => id !== 'classroomKey');
      }
    }
    // 清理失效的道具栏装备
    for (const id of base.inventory.items) {
      if (!base.itemCounts[id]) base.itemCounts[id] = 1;
    }
    for (const slot of ['Z', 'X', 'C', 'V']) {
      const id = base.itemSlots[slot];
      if (id && !base.inventory.items.includes(id)) base.itemSlots[slot] = null;
    }
    if (data.records && typeof data.records === 'object') {
      const r = data.records;
      for (const k of ['kills', 'dogKills', 'pigKills', 'homeworkDone', 'maxGold']) {
        const v = Math.floor(Number(r[k]));
        if (Number.isFinite(v) && v > 0) base.records[k] = v;
      }
      if (r.weaponKills && typeof r.weaponKills === 'object') {
        for (const id in r.weaponKills) {
          const v = Math.floor(Number(r.weaponKills[id]));
          if (Number.isFinite(v) && v > 0) base.records.weaponKills[id] = v;
        }
      }
    }
    base.records.pigKills = Math.max(base.records.pigKills, base.world.pigDefeated.length);
    base.records.maxGold = Math.max(base.records.maxGold, base.gold);
    // 已完成任务的补充经验（一次性，旧存档自动补上）
    const qe = base.world.questExp;
    let questExpAdd = 0;
    const backfill = (key, n, done) => {
      if (!done || qe[key]) return;
      qe[key] = true;
      questExpAdd += n;
    };
    backfill('tutorial', 50, base.world.qianCleared || base.world.tutorialDone);
    backfill('litou', 100, base.world.litouTalked);
    backfill('sundianhei', 100, base.world.houBossDefeated);
    backfill('liumo', 100, base.world.liumoJoined);
    backfill('yuekao', 200, base.world.examDone);
    if (questExpAdd > 0) {
      base.world.worldExp = Math.max(0, Math.floor(Number(base.world.worldExp) || 0)) + questExpAdd;
    }

    // 世界经验满 500（世界等级 1 满）→ 自动接取「月考」并发放 📄 月考试卷
    const examQ = base.quests.side.find(q => q && q.id === 'yuekao');
    if (base.world.worldExp >= CFG.world.expCap && base.world.worldLevel === 1 && !base.world.examDone) {
      if (examQ) {
        examQ.desc = '前往高一十班（后）进行考试';
        examQ.status = 'active';
      } else {
        base.quests.side.push({
          id: 'yuekao', name: '月考',
          desc: '前往高一十班（后）进行考试', status: 'active'
        });
      }
      if (!base.inventory.items.includes('examPaper')) {
        base.inventory.items.push('examPaper');
        base.itemCounts.examPaper = 1;
      }
    } else if (examQ && (base.world.examDone || base.world.worldLevel >= 2)) {
      examQ.status = 'done';
    } else if (examQ) {
      examQ.desc = '前往高一十班（后）进行考试';
    }
    if (data.achievements && typeof data.achievements === 'object') {
      const valid = CFG.achievements.map(a => a.id);
      for (const id in data.achievements) {
        if (data.achievements[id] && valid.includes(id)) base.achievements[id] = true;
      }
    }
    // 任务描述与世界进度同步（旧存档里残留的「去寻找鎏知寞」会被纠正）
    const mainQ = base.quests.main.find(q => q && q.id === 'main1');
    if (mainQ && !base.world.liumoJoined) {
      if (base.world.tearsQuest >= 2) mainQ.desc = '去高一十班（后）使用💧试试';
      else if (base.world.tearsQuest === 1) mainQ.desc = '向荔头询问眼泪的信息';
    }
    base.runtime = this.normalizeRuntime(data.runtime);
    return base;
  },

  normalizeRuntime(rt) {
    if (!rt || typeof rt !== 'object') return null;
    const num = (v, d) => (Number.isFinite(Number(v)) ? Number(v) : d);
    const str = (v, d) => (typeof v === 'string' ? v : d);
    const chars = Array.isArray(rt.characters)
      ? rt.characters
          .filter(c => c && typeof c.id === 'string' && CFG.characters[c.id])
          .map(c => ({
            id: c.id,
            hp: num(c.hp, 0),
            ult: num(c.ult, 0),
            eCd: num(c.eCd, 0),
            qCd: num(c.qCd, 0),
            stealth: num(c.stealth, 0),
            awake: num(c.awake, 0),
            sprout: num(c.sprout, 0),
            weapon: CFG.weapons[c.weapon] ? c.weapon : null
          }))
      : [];
    const cds = {};
    if (rt.itemCds && typeof rt.itemCds === 'object') {
      for (const k in rt.itemCds) {
        if (Number.isFinite(Number(rt.itemCds[k]))) cds[k] = Math.max(0, Number(rt.itemCds[k]));
      }
    }
    const enemies = Array.isArray(rt.enemies)
      ? rt.enemies
          .filter(e => e && typeof e.index === 'string' && Number.isFinite(Number(e.x)))
          .map(e => ({
            index: e.index,
            x: Number(e.x),
            y: Number(e.y),
            hp: Number(e.hp),
            dir: e.dir < 0 ? -1 : 1,
            state: str(e.state, 'patrol'),
            t: Math.max(0, num(e.t, 0)),
            shotTimer: num(e.shotTimer, 0),
            weldTimer: num(e.weldTimer, 0),
            reactTimer: num(e.reactTimer, 0)
          }))
      : [];
    return {
      levelId: LEVELS[rt.levelId] ? rt.levelId : 'qian',
      x: num(rt.x, LEVELS.qian.spawn.x),
      y: num(rt.y, LEVELS.qian.spawn.y),
      dir: rt.dir < 0 ? -1 : 1,
      cameraX: Math.max(0, num(rt.cameraX, 0)),
      active: Math.max(0, Math.min(3, Math.floor(num(rt.active, 0)))),
      characters: chars,
      shield: Math.max(0, num(rt.shield, 0)),
      shieldTime: Math.max(0, num(rt.shieldTime, 0)),
      shieldOwnerId: str(rt.shieldOwnerId, null),
      shieldSplashMult: Math.max(0, num(rt.shieldSplashMult, CFG.shield.splashMult)),
      haste: Math.max(0, num(rt.haste, 0)),
      paralyzed: Math.max(0, num(rt.paralyzed, 0)),
      invuln: Math.max(0, num(rt.invuln, 0)),
      stamina: num(rt.stamina, CFG.stamina.max),
      combo: Math.max(0, Math.floor(num(rt.combo, 0))),
      comboIdle: Math.max(0, num(rt.comboIdle, 0)),
      itemCds: cds,
      enemies,
      checkpointActive: !!rt.checkpointActive,
      checkpointId: str(rt.checkpointId, null),
      checkpointX: num(rt.checkpointX, LEVELS.qian.spawn.x),
      checkpointY: num(rt.checkpointY, LEVELS.qian.spawn.y),
      tutorialIndex: Math.max(0, Math.floor(num(rt.tutorialIndex, 0))),
      cleared: !!rt.cleared,
      state: str(rt.state, 'playing')
    };
  },

  saveGame() {
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(this.buildSaveData()));
      this.hasLoadedSave = true;
    } catch (e) { /* 忽略存储失败 */ }
  },

  buildSaveData() {
    const data = JSON.parse(JSON.stringify(this.save));
    if (this.player) {
      data.runtime = this.runtimeSnapshot();
      this.save.runtime = data.runtime;
    } else {
      data.runtime = data.runtime || null;
    }
    return data;
  },

  runtimeSnapshot() {
    const p = this.player;
    if (!p || !p.ch) return null;
    const characters = p.characters.map(c => ({
      id: c.def.id,
      hp: c.hp,
      ult: c.ult,
      eCd: c.eCd,
      qCd: c.qCd || 0,
      stealth: c.stealth,
      awake: c.awake,
      sprout: c.sprout,
      weapon: c.weapon
    }));
    const itemCds = {};
    for (const k in this.itemCds) {
      if (this.itemCds[k] > 0) itemCds[k] = this.itemCds[k];
    }
    const enemies = this.enemies.map(e => ({
      index: e.index,
      x: e.x,
      y: e.y,
      hp: e.hp,
      dir: e.dir,
      state: e.state,
      t: e.t,
      shotTimer: e.shotTimer,
      weldTimer: e.weldTimer,
      reactTimer: e.reactTimer
    }));
    return {
      levelId: this.levelId,
      x: p.x,
      y: p.y,
      dir: p.dir,
      cameraX: this.camera.x,
      active: p.active,
      characters,
      shield: p.shield,
      shieldTime: p.shieldTime,
      shieldOwnerId: p.shieldOwner ? p.shieldOwner.def.id : null,
      shieldSplashMult: p.shieldSplashMult,
      haste: p.haste,
      paralyzed: p.paralyzed,
      invuln: p.invuln,
      stamina: p.stamina,
      combo: p.combo,
      comboIdle: p.comboIdle,
      itemCds,
      enemies,
      checkpointActive: this.checkpointActive,
      checkpointId: this.checkpointId,
      checkpointX: this.checkpointX,
      checkpointY: this.checkpointY,
      tutorialIndex: this.tutorialIndex,
      cleared: this.cleared,
      state: this.state === 'clear' ? 'clear' : 'playing'
    };
  },

  exportSave() {
    const text = JSON.stringify(this.buildSaveData(), null, 2);
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const safeName = String(this.save.saveName || '控江异闻').replace(/[\\/:*?"<>|]/g, '_').slice(0, 24) || '控江异闻';
    a.download = safeName + '.json';
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    SFX.play('save');
  },

  importSave(text) {
    try {
      const data = JSON.parse(text);
      if (!data || !Array.isArray(data.unlocked)) throw new Error('bad');
      this.save = this.normalizeSave(data);
      this.hasLoadedSave = true;
      return true;
    } catch (e) {
      return false;
    }
  },

  resetStats() {
    this.stats = {
      jump: 0, lightSwing: 0, heavySwing: 0, blocked: 0,
      lightHit: 0, heavyHit: 0,
      perfectBlock: 0, dash: 0, perfectDodge: 0,
      stealth: 0, ult: 0, chest: 0, kills: 0, switchCount: 0, autoSwitch: 0,
      bag: 0, quest: 0, panel: 0, talk: 0,
      sprint: 0, save: 0, pause: 0, map: 0, mapUnlocked: 0,
      upgrade: 0, spike: 0, shield: 0, respawned: 0,
      itemUsed: 0, teleport: 0, achieve: 0, weaponEquipped: 0, skillViewed: 0
    };
  },

  /* ---------------- 开局 / 复活 / 通关 ---------------- */

  newRun() {
    this.resetStats();
    this.player = new Player(this);
    const list = (this.save.unlocked.length ? this.save.unlocked : ['liuhanyi']).slice(0, 4);
    for (const id of list) this.player.addCharacter(id);
    this.warehouse = this.save.unlocked.slice(4);

    // 同一件装备同时只能由一个角色持有
    const usedGear = new Set();
    for (const c of this.player.characters) {
      if (c.weapon && usedGear.has(c.weapon)) c.weapon = null;
      else if (c.weapon) usedGear.add(c.weapon);
    }

    this.hazards = [];
    this.projectiles = [];
    this.effects = [];
    this.texts = [];
    this.itemCds = {};
    this.camera.x = 0;
    this.focusTimer = 0;
    this.hitstop = 0;
    this.shake = 0;
    this.hurtFlash = 0;
    this.spikeCd = 0;
    this.cleared = false;
    this.dialogue = null;
    this.panel = null;
    this.exam = null;
    this.state = 'playing';
    this.last = 0;
    this.tutorialIndex = 0;
    this.tutorialHoldUntil = 0;
    this.tutorialReplay = false;

    this.enterLevel('qian', LEVELS.qian.spawn);

    UI.hideOverlay();
    UI.showHud(true);
    this.checkAchievements(false);
    this.saveGame();
  },

  hasContinue() {
    return !!(this.save && (this.hasLoadedSave || this.save.runtime));
  },

  resumeSave() {
    if (!this.save) return;
    const rt = this.save.runtime;
    if (!rt) { this.newRun(); return; }

    this.resetStats();
    this.player = new Player(this);
    const list = (this.save.unlocked.length ? this.save.unlocked : ['liuhanyi']).slice(0, 4);
    for (const id of list) this.player.addCharacter(id);
    this.warehouse = this.save.unlocked.slice(4);

    this.hazards = [];
    this.projectiles = [];
    this.effects = [];
    this.texts = [];
    this.itemCds = {};
    this.camera.x = 0;
    this.focusTimer = 0;
    this.hitstop = 0;
    this.shake = 0;
    this.hurtFlash = 0;
    this.spikeCd = 0;
    this.cleared = false;
    this.dialogue = null;
    this.panel = null;
    this.exam = null;
    this.state = 'playing';
    this.last = 0;

    const forceTutorial = !!this.tutorialReplay;
    const levelId = forceTutorial ? 'qian' : (LEVELS[rt.levelId] ? rt.levelId : 'qian');
    const lvl = LEVELS[levelId];
    const px = forceTutorial
      ? lvl.spawn.x
      : Math.max(26, Math.min(lvl.width - 26, rt.x));
    const py = (!forceTutorial && Number.isFinite(rt.y)) ? rt.y : lvl.spawn.y;
    this.enterLevel(levelId, { x: px, y: py });

    // 恢复角色状态
    const savedChars = {};
    for (const rc of (rt.characters || [])) savedChars[rc.id] = rc;
    for (const c of this.player.characters) {
      const rc = savedChars[c.def.id];
      if (!rc) continue;
      c.hp = Math.max(0, Math.min(c.hpMax, rc.hp));
      c.ult = Math.max(0, Math.min(c.def.ultMax, rc.ult));
      c.eCd = Math.max(0, rc.eCd);
      c.qCd = Math.max(0, rc.qCd || 0);
      c.stealth = Math.max(0, rc.stealth);
      c.awake = Math.max(0, rc.awake);
      c.sprout = Math.max(0, rc.sprout);
      c.weapon = CFG.weapons[rc.weapon] ? rc.weapon : null;
    }
    this.save.equipped = {};
    for (const c of this.player.characters) {
      if (c.weapon) this.save.equipped[c.def.id] = c.weapon;
    }

    // 恢复当前关卡敌人的状态
    const savedEnemies = {};
    for (const se of (rt.enemies || [])) savedEnemies[se.index] = se;
    for (const e of this.enemies) {
      const se = savedEnemies[e.index];
      if (!se) continue;
      e.x = Math.max(30, Math.min(LEVEL.width - 30, se.x));
      e.y = Number.isFinite(se.y) ? se.y : e.y;
      if (e.baseY !== undefined) e.baseY = e.y;
      e.hp = Math.max(1, Math.min(e.maxHp, se.hp));
      e.dir = se.dir < 0 ? -1 : 1;
      e.state = se.state;
      e.t = se.t;
      if (e.shotTimer !== undefined) e.shotTimer = se.shotTimer;
      if (e.weldTimer !== undefined) e.weldTimer = se.weldTimer;
      if (e.reactTimer !== undefined) e.reactTimer = se.reactTimer;
    }

    let active = Math.max(0, Math.min(this.player.characters.length - 1, rt.active | 0));
    if (!this.player.characters[active] || !this.player.characters[active].alive) {
      const alive = this.player.characters.findIndex(c => c.alive);
      active = alive >= 0 ? alive : 0;
    }
    this.player.active = active;
    this.player.dir = rt.dir < 0 ? -1 : 1;
    this.player.shield = Math.max(0, rt.shield);
    this.player.shieldTime = Math.max(0, rt.shieldTime);
    this.player.shieldOwner = this.player.characters.find(c => c.def.id === rt.shieldOwnerId) || null;
    this.player.shieldSplashMult = Math.max(0, rt.shieldSplashMult ?? CFG.shield.splashMult);
    this.player.haste = Math.max(0, rt.haste);
    this.player.paralyzed = Math.max(0, rt.paralyzed);
    this.player.invuln = Math.max(1.0, rt.invuln || 0);
    this.player.stamina = Math.max(0, Math.min(CFG.stamina.max, rt.stamina));
    this.player.combo = Math.max(0, rt.combo | 0);
    this.player.comboIdle = Math.max(0, rt.comboIdle);
    this.player.dead = false;
    this.player.onLadder = false;
    this.player.ladderLock = false;

    this.itemCds = {};
    for (const k in (rt.itemCds || {})) {
      if (Number.isFinite(Number(rt.itemCds[k]))) this.itemCds[k] = Math.max(0, Number(rt.itemCds[k]));
    }

    this.checkpointActive = !!rt.checkpointActive;
    this.checkpointId = rt.checkpointId || this.checkpointId;
    if (Number.isFinite(rt.checkpointX)) this.checkpointX = rt.checkpointX;
    if (Number.isFinite(rt.checkpointY)) this.checkpointY = rt.checkpointY;
    this.tutorialIndex = Math.max(0, Math.min(LEVEL.tutorial.length, rt.tutorialIndex | 0));
    if (forceTutorial) {
      this.tutorialIndex = 0;
      this.cleared = false;
    }
    this.cleared = !!rt.cleared && !forceTutorial;
    this.camera.x = Math.max(0, Math.min(LEVEL.width - CFG.view.w, Number.isFinite(rt.cameraX) ? rt.cameraX : px - 480));

    this.state = 'playing';
    UI.showHud(true);
    UI.hideOverlay();

    if (rt.state === 'clear' && this.cleared) {
      this.state = 'clear';
      UI.showClear(this, false);
    }
    if (forceTutorial) {
      this.tutorialReplay = false;
      this.state = 'playing';
      UI.hideOverlay();
      UI.toast('版本更新：教学指引已重做，请按新指引重新体验教学关', 4600);
    }
    this.checkAchievements(false);
    this.saveGame();
  },

  enterLevel(levelId, pos, opts) {
    const level = LEVELS[levelId];
    if (!level) return;
    LEVEL = level;
    this.levelId = levelId;
    opts = opts || {};

    this.enemies = [];
    this.projectiles = [];
    this.hazards = [];
    this.effects = [];
    this.texts = [];
    this.spikeCd = 0;

    this.player.x = pos ? pos.x : level.spawn.x;
    this.player.y = pos ? pos.y : level.spawn.y;
    this.player.vx = 0;
    this.player.vy = 0;
    this.player.attack = null;
    this.player.blocking = false;
    this.player.onLadder = false;
    this.player.ladderLock = false;
    this.player.paralyzed = 0;
    this.player.penOut = false;
    this.player.invuln = 1.0;

    this.buildEnemies();
    this.setupHouBoss();
    this.camera.x = Math.max(0, Math.min(LEVEL.width - CFG.view.w, this.player.x - 480));

    // 拿到 💧 并问过荔头后，主线提示统一为去高一十班（后）使用
    const mq = this.save.quests.main.find(q => q && q.id === 'main1');
    if (mq && this.save.world.tearsQuest >= 2 && !this.save.world.liumoJoined) {
      mq.desc = '去高一十班（后）使用💧试试';
    }

    const saved = LEVEL.checkpoints.filter(c => this.save.world.checkpoints.includes(c.id));
    let cp = (pos && LEVEL.checkpoints.find(c => Math.abs(c.x - pos.x) < 6)) ||
             saved[saved.length - 1] || null;
    this.checkpointActive = !!cp;
    this.checkpointId = cp ? cp.id : null;
    this.checkpointX = cp ? cp.x : LEVEL.spawn.x;
    this.checkpointY = cp ? cp.y : LEVEL.spawn.y;

    this.chestOpened = !!this.save.world.chestOpened;
    this.npcTalked = this.save.unlocked.includes('nengrongze');
    this.cleared = false;
    this.dialogue = null;
    this.homeworkFight = null;
    this.exam = null;
    if (this.save.world.tutorialDone) {
      this.tutorialIndex = LEVELS.qian.tutorial.length;
    } else if (this.tutorialIndex > LEVELS.qian.tutorial.length) {
      this.tutorialIndex = 0;
    }

    if (levelId === 'zhong') {
      const main = this.save.quests.main.find(q => q.id === 'main1');
      if (main) {
        if (this.save.world.tearsQuest === 2) {
          main.desc = '去高一十班（后）使用💧试试';
        } else if (this.save.world.tearsQuest === 1) {
          main.desc = '向荔头询问眼泪的信息';
        } else if (!this.save.world.houBossDefeated) {
          main.desc = this.save.world.litouTalked ? '去会会孙点黑' : '找到荔头，获得指引';
        }
      }
      if (!this.save.world.zhongIntroShown) {
        this.save.world.zhongIntroShown = true;
        setTimeout(() => {
          if (this.levelId === 'zhong') {
            UI.toast('新机制：梯子按 W / S 攀爬 · 拾取 🔑 后在背包装备 · 靠近 🔒 按对应道具键开门', 5000);
          }
        }, 220);
      }
      this.saveGame();
    }
    if (levelId === 'hou') {
      const main = this.save.quests.main.find(q => q.id === 'main1');
      if (main && !this.save.world.houBossDefeated) main.desc = '去会会孙点黑';
    }
    this.checkWorldQuest();
    this.panel = null;
    this.saveGame();
  },

  buildEnemies() {
    this.enemies = [];
    const now = Date.now();
    (LEVEL.enemies || []).forEach((spot, i) => {
      const key = LEVEL.id + ':' + i;
      const until = this.save.world.enemyRespawn[key];
      if (until && until > now) return;
      if (until) delete this.save.world.enemyRespawn[key];
      this.enemies.push(this.createEnemy(spot, key));
    });
  },

  createEnemy(spot, key) {
    return spot.type === 'pig' ? new Pig(spot, key) : new Enemy(spot, key);
  },

  setupHouBoss() {
    if (this.levelId !== 'hou') return;
    if (this.save.world.houBossDefeated || !this.save.world.houBossTalked) return;
    if (this.enemies.some(e => e.kind === 'boss' && !e.dead)) return;
    this.enemies.push(new BossSun(1300, false));
  },

  startNewGame() {
    this.save = this.freshSave();
    this.saveGame();
    this.introIndex = 0;
    this.introGuardAt = performance.now();
    this.state = 'intro';
    UI.showHud(false);
    UI.showIntro(this, 0);
  },

  advanceIntro() {
    if (this.state !== 'intro') return;
    // 防止开始游戏的同一次点击立即推进到第二段
    if (performance.now() - this.introGuardAt < 250) return;
    this.introIndex++;
    SFX.play('talk');
    if (this.introIndex >= this.INTRO.length) {
      this.newRun();
      return;
    }
    UI.showIntro(this, this.introIndex);
  },

  respawn() {
    const examWasActive = !!this.exam;
    this.player.resetAt(this.checkpointX, this.checkpointY);
    this.player.active = 0;
    for (const c of this.player.characters) {
      c.hp = c.hpMax;
      c.stealth = 0;
      c.awake = 0;
      c.sprout = 0;
    }
    this.player.shield = 0;
    this.player.shieldTime = 0;
    this.player.shieldOwner = null;
    this.player.shieldSplashMult = CFG.shield.splashMult;
    this.player.paralyzed = 0;
    this.player.onLadder = false;
    this.buildEnemies();
    this.setupHouBoss();
    this.projectiles = [];
    this.hazards = [];
    this.effects = [];
    this.texts = [];
    this.focusTimer = 0;
    this.wipeTimer = 0;
    this.homeworkFight = null;
    this.exam = null;
    this.state = 'playing';
    UI.hideOverlay();
    UI.toast('已在检查点复活');
    if (examWasActive) this.startExam(true);
  },

  onWipe() {
    if (this.state !== 'playing') return;
    this.state = 'wipe';
    this.wipeTimer = CFG.respawnDelay;
    UI.showWipe();
  },

  clearLevel() {
    if (this.state !== 'playing') return;
    this.state = 'clear';
    this.cleared = true;

    const firstClear = this.levelId === 'qian' && !this.save.world.qianCleared;
    if (this.levelId === 'qian') {
      if (!this.save.world.maps.includes('qian')) this.save.world.maps.push('qian');
      if (!this.save.world.maps.includes('zhong')) this.save.world.maps.push('zhong');
      if (!this.save.world.checkpoints.includes('qian-cp')) {
        this.save.world.checkpoints.push('qian-cp');
      }
      if (!this.save.world.checkpoints.includes('zhong-start')) {
        this.save.world.checkpoints.push('zhong-start');
      }
      this.save.world.qianCleared = true;
      if (firstClear) this.stats.mapUnlocked++;
    }
    this.save.world.tutorialDone = true;
    this.grantQuestExp('tutorial', 50);
    this.tutorialIndex = LEVEL.tutorial.length;
    if (this.levelId === 'zhong') {
      this.save.world.zhongGuideDone = true;
      if (!this.save.world.maps.includes('hou')) this.save.world.maps.push('hou');
      if (!this.save.world.checkpoints.includes('hou-start')) {
        this.save.world.checkpoints.push('hou-start');
      }
      if (!this.save.world.checkpoints.includes('zhong-end')) {
        this.save.world.checkpoints.push('zhong-end');
      }
      const main = this.save.quests.main.find(q => q.id === 'main1');
      if (main && this.save.world.tearsQuest === 0 && !this.save.world.houBossDefeated) {
        main.desc = '去会会孙点黑';
      }
    }
    this.saveGame();
    this.checkAchievements(true);

    UI.showClear(this, firstClear);
    if (firstClear) {
      UI.toast('🗺 解锁地图：高一十班（中）　按 M 打开地图', 3200);
    }
  },

  toTitle() {
    if (this.player) this.saveGame();
    this.state = 'title';
    this.player = null;
    this.dialogue = null;
    this.panel = null;
    this.levelId = 'qian';
    LEVEL = LEVELS.qian;
    this.hazards = [];
    UI.showHud(false);
    UI.showTitle(this);
    this.bindTitle();
  },

  bindTitle() {
    const cont = document.getElementById('btnContinue');
    const nw = document.getElementById('btnNew');
    const ld = document.getElementById('btnLoad');
    const st = document.getElementById('btnSettings');
    if (cont) cont.addEventListener('click', () => { SFX.play('click'); this.resumeSave(); });
    if (nw) nw.addEventListener('click', () => { SFX.play('click'); this.startNewGame(); });
    if (ld) ld.addEventListener('click', () => { SFX.play('click'); UI.showLoad(this); this.bindLoad(); });
    if (st) st.addEventListener('click', () => { SFX.play('click'); this.settingsFrom = 'title'; UI.showSettings(this); this.bindSettings(); });
  },

  bindLoad() {
    const zone = document.getElementById('dropZone');
    const input = document.getElementById('fileInput');
    const back = document.getElementById('btnLoadBack');
    if (back) back.addEventListener('click', () => { SFX.play('click'); this.toTitle(); });
    if (input && zone) {
      input.addEventListener('change', () => {
        if (input.files && input.files[0]) this.readSaveFile(input.files[0]);
      });
      zone.addEventListener('click', () => input.click());
    }
    if (!zone) return;
    zone.addEventListener('dragover', (e) => {
      e.preventDefault();
      zone.classList.add('over');
    });
    zone.addEventListener('dragleave', () => zone.classList.remove('over'));
    zone.addEventListener('drop', (e) => {
      e.preventDefault();
      zone.classList.remove('over');
      const f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
      if (f) this.readSaveFile(f);
    });
  },

  bindSettings() {
    const back = document.getElementById('btnSettingsBack');
    if (back) back.onclick = () => {
      SFX.play('click');
      if (this.settingsFrom === 'paused') {
        this.state = 'paused';
        UI.showPause(this);
      } else {
        this.toTitle();
      }
    };

    const range = document.getElementById('volumeRange');
    const volValue = document.getElementById('volValue');
    if (range) {
      range.oninput = () => {
        const v = Number(range.value);
        SFX.setVolume(v / 100);
        Input.saveSettings();
        if (volValue) volValue.textContent = v + '%';
      };
      range.onchange = () => SFX.play('click');
    }

    document.querySelectorAll('.keyBtn').forEach(btn => {
      btn.onclick = () => {
        if (Input.capturing) return;
        const action = btn.dataset.action;
        Input.capturing = action;
        btn.textContent = '按下新键…';
        btn.classList.add('capturing');

        const onKey = (e) => {
          e.preventDefault();
          e.stopPropagation();
          finish(e.code);
        };
        const onMouse = (e) => {
          e.preventDefault();
          e.stopPropagation();
          finish('Mouse' + e.button);
        };
        const finish = (phys) => {
          window.removeEventListener('keydown', onKey, true);
          window.removeEventListener('mousedown', onMouse, true);
          Input.capturing = null;
          if (!phys) return;
          Input.rebind(action, phys);
          SFX.play('click');
          UI.showSettings(this);
          this.bindSettings();
        };

        window.addEventListener('keydown', onKey, true);
        window.addEventListener('mousedown', onMouse, true);
      };
    });
  },

  readSaveFile(file) {
    const reader = new FileReader();
    reader.onload = () => {
      const ok = this.importSave(String(reader.result || ''));
      if (!ok) {
        UI.loadError('存档文件无法读取');
        SFX.play('hurt');
        return;
      }
      this.resumeSave();
      UI.toast('存档已加载');
      SFX.play('pickup');
    };
    reader.onerror = () => UI.loadError('读取文件失败');
    reader.readAsText(file);
  },

  equipWeapon(id, charId) {
    if (!this.player) return;
    if (id && !CFG.weapons[id]) return;
    if (id && !this.save.inventory.equipment.includes(id)) return;
    const st = this.stateOf(charId) || this.player.ch;
    if (id) {
      // 同一件装备同时只能装备给一个角色
      for (const c of this.player.characters) {
        if (c !== st && c.weapon === id) c.weapon = null;
      }
      for (const key in this.save.equipped) {
        if (key !== st.def.id && this.save.equipped[key] === id) delete this.save.equipped[key];
      }
      st.weapon = id;
      this.save.equipped[st.def.id] = id;
    } else {
      st.weapon = null;
      delete this.save.equipped[st.def.id];
    }
    this.player.combo = 0;
    this.player.comboIdle = 0;
    this.player.penOut = false;
    if (id) this.stats.weaponEquipped++;
    this.saveGame();
    SFX.play('pickup');
    UI.showCharacter(this);
  },

  /* ---------------- 暂停与面板 ---------------- */

  handleGlobalInput() {
    if (this.state === 'playing') {
      if (Input.keyPressed('Escape')) { this.stats.pause++; this.togglePause(); return; }
      for (const code of ['KeyZ', 'KeyX', 'KeyC', 'KeyV']) {
        if (Input.keyPressed(code)) { this.useItemSlot(code); return; }
      }
      if (Input.keyPressed('KeyB')) { this.openPanel('bag'); return; }
      if (Input.keyPressed('KeyJ')) { this.openPanel('quest'); return; }
      if (Input.keyPressed('KeyT')) { this.openPanel('char'); return; }
      if (Input.keyPressed('KeyY')) { this.openPanel('achieve'); return; }
      if (Input.keyPressed('KeyM')) { this.openPanel('map'); return; }
      if (Input.keyPressed('KeyP')) { this.openSavePanel(); return; }
    } else if (this.state === 'paused') {
      if (Input.keyPressed('Escape')) this.resume();
    } else if (this.state === 'menu') {
      if (Input.keyPressed('Escape')) this.closePanel();
      else if (this.panel === 'map' && Input.keyPressed('KeyM')) this.closePanel();
    } else if (this.state === 'dialogue') {
      if (Input.rawLeft.pressed) this.advanceDialogue();
    } else if (this.state === 'story') {
      if (Input.rawLeft.pressed) this.advanceStory();
    }
  },

  togglePause() {
    if (this.state === 'playing') {
      this.state = 'paused';
      UI.showPause(this);
    } else if (this.state === 'paused') {
      this.resume();
    }
  },

  resume() {
    this.panel = null;
    this.state = 'playing';
    UI.hideOverlay();
  },

  openPanel(name) {
    if (this.state !== 'playing' && this.state !== 'paused') return;
    if (name === 'map' && !this.save.world.maps.length) {
      UI.toast('地图尚未解锁：通关高一十班（前）后开启');
      return;
    }
    this.menuFrom = this.state === 'paused' ? 'paused' : 'playing';
    this.state = 'menu';
    this.panel = name;
    SFX.play('open');
    if (name === 'bag') { this.stats.bag++; UI.showBag(this); }
    else if (name === 'quest') { this.stats.quest++; UI.showQuests(this); }
    else if (name === 'char') { this.stats.panel++; UI.showCharacter(this); }
    else if (name === 'achieve') { this.stats.panel++; this.stats.achieve++; this.checkAchievements(false); UI.showAchievements(this); }
    else if (name === 'map') { this.stats.map++; UI.showMap(this); }
  },

  closePanel() {
    this.panel = null;
    if (this.menuFrom === 'paused') {
      this.state = 'paused';
      UI.showPause(this);
    } else if (this.menuFrom === 'clear') {
      this.state = 'clear';
      UI.showClear(this, false);
    } else {
      this.state = 'playing';
      UI.hideOverlay();
    }
  },

  openMapFromClear() {
    this.menuFrom = 'clear';
    this.state = 'menu';
    this.panel = 'map';
    this.stats.map++;
    SFX.play('open');
    UI.showMap(this);
  },

  openSavePanel(fromPause) {
    if (!this.checkpointActive) { UI.toast('尚未激活检查点'); return; }
    if (Math.abs(this.player.x - this.checkpointX) > 160) { UI.toast('需在检查点按 P 存档'); return; }
    this.menuFrom = fromPause ? 'paused' : 'playing';
    this.state = 'menu';
    this.panel = 'save';
    this.stats.save++;
    UI.showSavePanel(this);
  },

  openClearSave() {
    this.menuFrom = 'clear';
    this.state = 'menu';
    this.panel = 'save';
    this.stats.save++;
    UI.showSavePanel(this);
  },

  saveToFile() {
    this.saveGame();
    this.exportSave();
    UI.toast('存档文件已生成，请妥善保存');
    setTimeout(() => {
      if (this.panel === 'save') this.closePanel();
    }, 400);
  },

  /* ---------------- 地图 / 传送 ---------------- */

  mapInfo() {
    const anchors = ANCHORS
      .filter(a => this.save.world.maps.includes(a.level))
      .map(a => ({
        id: a.id,
        level: a.level,
        levelName: LEVELS[a.level].name,
        name: a.name,
        unlocked: this.save.world.checkpoints.includes(a.id),
        current: a.level === this.levelId
      }));
    return {
      name: '高一十班',
      emoji: '🏫',
      currentLevel: this.levelId,
      anchors
    };
  },

  teleportTo(id) {
    const a = ANCHORS.find(x => x.id === id);
    if (!a) return;
    if (!this.save.world.checkpoints.includes(a.id)) {
      UI.toast('该传送点尚未解锁');
      return;
    }
    const targetName = LEVELS[a.level] ? LEVELS[a.level].name : a.name;

    if (a.level !== this.levelId) {
      this.enterLevel(a.level, { x: a.x, y: a.y });
      UI.toast('已进入 ' + targetName);
    } else {
      this.player.x = a.x;
      this.player.y = a.y;
      this.player.vx = 0;
      this.player.vy = 0;
      this.player.attack = null;
      this.player.onLadder = false;
      this.camera.x = Math.max(0, Math.min(LEVEL.width - CFG.view.w, a.x - 480));
      this.checkpointActive = true;
      this.checkpointId = a.id;
      this.checkpointX = a.x;
      this.checkpointY = a.y;
      UI.toast('已传送至 ' + a.name);
    }
    this.menuFrom = 'playing';
    this.closePanel();
    this.stats.teleport++;
    SFX.play('pickup');
  },

  solids() {
    if (LEVEL.door && !this.save.world.lockOpened) {
      return LEVEL.platforms.concat([LEVEL.door]);
    }
    return LEVEL.platforms;
  },

  moveEnemy(enemy, dx) {
    if (!dx) return true;
    const prevX = enemy.x;
    enemy.x += dx;
    if (enemy.ledge) enemy.x = Math.max(enemy.a, Math.min(enemy.b, enemy.x));
    const box = enemy.box();
    for (const s of this.solids()) {
      if (aabbBox(box, s)) {
        enemy.x = prevX;
        return false;
      }
    }
    return true;
  },

  projectileBlocked(x, y, r) {
    for (const s of this.solids()) {
      if (circleRect(x, y, r, s)) return true;
    }
    return false;
  },

  bossMelee(boss, radius, mult) {
    const p = this.player;
    const cx = boss.x + boss.dir * 70;
    const cy = boss.y - 38;
    if (Math.hypot(p.x - cx, (p.y - 25) - cy) <= radius) {
      p.takeDamage(boss.atk * mult, boss.x, boss);
    }
  },

  bossLandHit(boss, x) {
    const p = this.player;
    if (Math.abs(p.x - x) <= 62 && Math.abs((p.y - 25) - (LEVEL.floorY - 25)) < 90) {
      p.takeDamage(boss.atk * 2.0, x, boss);
    }
    this.effects.push({ type: 'ring', x, y: LEVEL.floorY - 25, t: 0, life: 0.4, color: '#ff9f6e' });
  },

  spawnBossTotem(boss, type) {
    const totems = this.enemies.filter(e => e.kind === 'totem' && !e.dead);
    if (totems.length >= 3) return;
    let x = this.player.x;
    for (let i = 0; i < 8; i++) {
      if (totems.every(t => Math.abs(t.x - x) > 90)) break;
      x += (i % 2 ? 1 : -1) * (110 + i * 10);
    }
    x = Math.max(60, Math.min(LEVEL.width - 60, x));
    this.enemies.push(new BossTotem(this, boss, x, type));
  },

  spawnTrans(boss) {
    if (this.enemies.some(e => e.kind === 'trans' && !e.dead)) return;
    this.enemies.push(new TransShot(boss, boss.dir));
  },

  onBossDefeated(boss) {
    this.save.records.kills = (this.save.records.kills || 0) + 1;
    this.gainWorldExp(50);
    for (const e of this.enemies) {
      if (e === boss) continue;
      if (e.kind === 'totem' || e.kind === 'trans' ||
          e.kind === 'hourglass' || e.kind === 'rewind' || e.kind === 'pause') {
        e.dead = true;
      }
    }
    this.projectiles = this.projectiles.filter(p => p.boss !== boss && p.kind !== 'pause');

    if (boss.exam) {
      this.completeExam();
      return;
    }

    if (boss.sport) {
      this.save.gold += 100;
      const loot = ['💰 金币×100'];
      if (Math.random() < 0.5) {
        this.save.materials.haochengji = (this.save.materials.haochengji || 0) + 1;
        loot.push('💯 好成绩×1');
      }
      UI.showLoot(loot, 3200, '体育作业完成');
      UI.toast('体育作业完成', 2600);
      this.completeHomework('sport');
      this.homeworkFight = null;
      this.saveGame();
      return;
    }

    if (boss.summoned) {
      const reward = this.worldLevel() >= 2 ? 300 : 100;
      this.save.gold += reward;
      const music = 3 + Math.floor(Math.random() * 3);
      this.save.materials.music = (this.save.materials.music || 0) + music;
      const loot = ['💰 金币×' + reward, `🎶 音乐细菌×${music}`];
      UI.showLoot(loot, 3000, '作业完成');
      UI.toast('心理作业完成', 2600);
      this.completeHomework('psych');
      this.homeworkFight = null;
      this.saveGame();
      return;
    }

    this.save.world.houBossDefeated = true;
    this.grantQuestExp('sundianhei', 100);
    this.save.world.sunGuideDone = true;
    const main = this.save.quests.main.find(q => q.id === 'main1');
    if (main) main.desc = '打开孙点黑留下的宝箱';
    this.saveGame();
    UI.toast('孙点黑已击败 · 宝箱解锁', 3000);
    this.effects.push({ type: 'burst', x: boss.x, y: boss.y - 30, t: 0, life: 0.6 });
  },

  /* ---------------- 背包道具 ---------------- */

  addItem(itemId, n) {
    if (!CFG.items[itemId]) return;
    n = n == null ? 1 : n;
    if (!this.save.inventory.items.includes(itemId)) {
      this.save.inventory.items.push(itemId);
    }
    this.save.itemCounts[itemId] = (this.save.itemCounts[itemId] || 0) + n;
    this.saveGame();
  },

  removeItem(itemId, n) {
    n = n == null ? 1 : n;
    const left = (this.save.itemCounts[itemId] || 0) - n;
    if (left > 0) {
      this.save.itemCounts[itemId] = left;
      this.saveGame();
      return;
    }
    delete this.save.itemCounts[itemId];
    this.save.inventory.items = this.save.inventory.items.filter(id => id !== itemId);
    for (const slot of ['Z', 'X', 'C', 'V']) {
      if (this.save.itemSlots[slot] === itemId) this.save.itemSlots[slot] = null;
    }
    this.saveGame();
  },

  itemCount(itemId) {
    return this.save.itemCounts[itemId] || 0;
  },

  noteItemUsed() {
    this.stats.itemUsed++;
    this.save.world.itemsUsed = (this.save.world.itemsUsed || 0) + 1;
  },

  equipItem(itemId, slot) {
    if (!CFG.items[itemId]) return;
    if (!this.save.inventory.items.includes(itemId)) return;
    if (!['Z', 'X', 'C', 'V'].includes(slot)) return;

    for (const s of ['Z', 'X', 'C', 'V']) {
      if (this.save.itemSlots[s] === itemId) this.save.itemSlots[s] = null;
    }
    const current = this.save.itemSlots[slot];
    if (current !== itemId) this.save.itemSlots[slot] = itemId;
    this.saveGame();
    SFX.play('pickup');
    UI.showBag(this);
  },

  useItemSlot(code) {
    if (this.player && this.player.paralyzed > 0) {
      UI.toast('麻痹中，无法使用道具');
      return;
    }
    const slot = code.replace('Key', '');
    const itemId = this.save.itemSlots[slot];
    if (!itemId) { UI.toast('该栏位没有道具'); return; }
    const item = CFG.items[itemId];
    if (!item) return;

    if (itemId === 'tear') {
      if (this.save.world.liumoJoined) { UI.toast('这里已经没有反应了'); return; }
      if (this.levelId !== 'hou') { UI.toast('需要在 高一十班（后）使用'); return; }
      if (this.enemies.some(e => !e.dead)) { UI.toast('先清理场上的敌人，再使用 💧'); return; }
      if (this.state !== 'playing') return;
      this.removeItem('tear');
      this.startLiumoScene();
      return;
    }

    if (itemId === 'examPaper') {
      if (this.save.world.examDone || this.worldLevel() >= 2) { UI.toast('月考已经结束了'); return; }
      if (this.levelId !== 'hou') { UI.toast('需要在 高一十班（后）使用'); return; }
      if (this.exam) { UI.toast('考试正在进行中'); return; }
      if (this.enemies.some(e => !e.dead)) { UI.toast('先清理场上的敌人，再使用 📄'); return; }
      if (this.state !== 'playing') return;
      this.removeItem('examPaper');
      this.startExam(false);
      this.saveGame();
      return;
    }

    if (item.quest) {
      UI.toast('任务道具，暂时无法使用');
      return;
    }

    if (itemId === 'mathbook') {
      const cd = this.itemCds.mathbook || 0;
      if (cd > 0) { UI.toast('📕 冷却中：' + Math.ceil(cd) + ' 秒'); return; }
      const st = this.player.ch;
      if (st.def.id === 'liuhanyi' && st.awake > 0) {
        UI.toast('睡醒了期间无法获得充能');
        return;
      }
      this.gainUltFor(st, item.charge);
      this.itemCds.mathbook = item.cd;
      this.saveGame();
      this.noteItemUsed();
      UI.showLoot(['📕 数学书 · 充能 +' + item.charge], 1600);
      this.effects.push({ type: 'ring', x: this.player.x, y: this.player.y - 40, t: 0, life: 0.4, color: '#ffd166' });
      SFX.play('quest');
      return;
    }

    if (itemId === 'coffee') {
      this.player.haste = Math.max(this.player.haste, item.haste || 30);
      this.removeItem('coffee');
      this.noteItemUsed();
      UI.showLoot(['☕ 咖啡 · 30 秒内移速 +50%'], 2400);
      this.effects.push({ type: 'ring', x: this.player.x, y: this.player.y - 40, t: 0, life: 0.4, color: '#ff9f6e' });
      SFX.play('quest');
      return;
    }

    if (itemId === 'chocolate') {
      const st = this.player.ch;
      const heal = Math.max(1, Math.round(st.hpMax * (item.healRatio || 0.5)));
      const before = st.hp;
      st.hp = Math.min(st.hpMax, st.hp + heal);
      this.removeItem('chocolate');
      this.noteItemUsed();
      UI.showLoot(['🍫 巧克力 · ' + st.def.name + ' 回复 ' + Math.round(st.hp - before) + ' 生命'], 2400);
      this.effects.push({ type: 'ring', x: this.player.x, y: this.player.y - 40, t: 0, life: 0.4, r0: 8, r1: 60, width: 4, color: '#ff9f6e' });
      this.spawnText(this.player.x, this.player.y - 90, '+' + Math.round(st.hp - before), '#8ef0a0');
      SFX.play('quest');
      return;
    }

    if (itemId === 'classroomKey') {
      if (LEVEL.id !== 'zhong' || !LEVEL.door || this.save.world.lockOpened) {
        UI.toast('附近没有上锁的门');
        return;
      }
      const door = LEVEL.door;
      const near = Math.abs(this.player.x - (door.x + door.w / 2)) < 120 &&
                   Math.abs(this.player.y - (door.y + door.h)) < 110;
      if (!near) { UI.toast('附近没有上锁的门'); return; }
      this.save.world.lockOpened = true;
      this.removeItem('classroomKey');
      this.noteItemUsed();
      this.saveGame();
      UI.showLoot(['🔒 已开启 · 🔑 已消耗'], 2600, '开门');
      this.effects.push({ type: 'ring', x: door.x + door.w / 2, y: door.y + door.h / 2, t: 0, life: 0.6, color: '#ffd166' });
      SFX.play('quest');
      return;
    }

    if (item.homework) {
      if (this.levelId !== 'hou' || !this.save.world.houBossDefeated) {
        UI.toast('该作业道具只能在高一十班（后）使用');
        return;
      }
      if (this.homeworkFight) {
        UI.toast('先完成当前的作业战斗');
        return;
      }
      if (item.homework === 'sport' && this.enemies.some(e => !e.dead)) {
        UI.toast('先清理场上的敌人，再使用 ⏰');
        return;
      }
      if (this.state !== 'playing') return;
      this.removeItem(itemId, 1);
      this.startHomeworkFight(item.homework);
      this.saveGame();
      return;
    }
  },

  /* ---------------- 世界等级 ---------------- */

  worldLevel() {
    return Math.max(1, Math.floor((this.save && this.save.world && this.save.world.worldLevel) || 1));
  },

  worldExp() {
    return Math.max(0, Math.floor((this.save && this.save.world && this.save.world.worldExp) || 0));
  },

  maxCharLevel() { return CFG.upgrade.level.maxPerWorld * this.worldLevel(); },
  maxSkillLevel() { return CFG.upgrade.skillMaxPerWorld * this.worldLevel(); },

  worldExpCap() {
    return this.worldLevel() >= 2 ? CFG.world.expCap2 : CFG.world.expCap;
  },

  gainWorldExp(n) {
    if (!n) return;
    this.save.world.worldExp = this.worldExp() + n;
    this.checkWorldQuest();
  },

  // 任务经验：每个任务只发放一次（存档里用 questExp 记录）
  grantQuestExp(key, n) {
    if (!this.save.world.questExp) this.save.world.questExp = {};
    if (this.save.world.questExp[key]) return false;
    this.save.world.questExp[key] = true;
    this.save.world.worldExp = this.worldExp() + n;
    UI.toast('🌍 世界经验 +' + n, 2200);
    this.checkWorldQuest();
    return true;
  },

  checkWorldQuest() {
    if (this.worldLevel() >= 2 || this.save.world.examDone) return;
    if (this.worldExp() < CFG.world.expCap) return;
    let q = this.save.quests.side.find(x => x && x.id === 'yuekao');
    if (!q) {
      q = { id: 'yuekao', name: '月考', desc: '前往高一十班（后）进行考试', status: 'active' };
      this.save.quests.side.push(q);
    }
    q.desc = '前往高一十班（后）进行考试';
    q.status = 'active';
    if (this.exam) return;
    if (!this.save.inventory.items.includes('examPaper')) {
      this.addItem('examPaper', 1);
      UI.toast('⚠️ 已接取支线任务“月考”', 3000);
      UI.showLoot(['📄 月考试卷×1', '在高一十班（后）使用，开始考试'], 4000, '新任务 · 月考');
      SFX.play('quest');
      this.saveGame();
    }
  },

  enemyScale() {
    // 怪物强度改为按世界等级显式配置，保留此函数以兼容旧调用
    return 1;
  },

  /* ---------------- 升级 ---------------- */

  stateOf(charId) {
    if (!this.player) return null;
    return this.player.characters.find(c => c.def.id === charId) || this.player.ch;
  },

  upgradeCost(kind, charId) {
    const id = (charId || this.player.ch.def.id);
    if (!this.save.progress[id]) this.save.progress[id] = { level: 1, e: 1, q: 1 };
    const lv = this.save.progress[id];
    if (kind === 'level') {
      if (lv.level >= this.maxCharLevel()) return null;
      const cost = { gold: lv.level * CFG.upgrade.level.goldBase };
      // 世界等级 2：角色 10 级突破到 20 级，每级额外消耗 1 个好成绩
      if (lv.level >= 10) {
        cost.mat = 'haochengji';
        cost.matN = 1;
      }
      return cost;
    }
    const cfg = CFG.upgrade.skills[id] && CFG.upgrade.skills[id][kind];
    if (!cfg || cfg.upgradable === false) return null;
    if (lv[kind] >= this.maxSkillLevel()) return null;
    const mat = cfg.mat || 'dianmo';
    return {
      gold: lv[kind] * CFG.upgrade.skillGoldBase,
      mat: mat,
      matN: CFG.upgrade.skillMatStart + (lv[kind] - 1) * CFG.upgrade.skillMatStep
    };
  },

  canAfford(cost) {
    if (!cost) return false;
    if (this.save.gold < cost.gold) return false;
    if (cost.mat && (this.save.materials[cost.mat] || 0) < cost.matN) return false;
    return true;
  },

  upgradeSelected(kind, charId) {
    if (!this.player) return false;
    const id = (charId || this.player.ch.def.id);
    const cost = this.upgradeCost(kind, id);
    if (!cost || !this.canAfford(cost)) return false;
    this.save.gold -= cost.gold;
    if (cost.mat && cost.matN) {
      this.save.materials[cost.mat] = Math.max(0, (this.save.materials[cost.mat] || 0) - cost.matN);
    }
    this.save.progress[id][kind]++;
    if (kind === 'level') {
      const st = this.stateOf(id);
      if (st && st.hp > 0) st.hp = Math.min(st.hpMax, st.hp + CFG.upgrade.level.hp);
    }
    this.stats.upgrade++;
    this.saveGame();
    SFX.play('quest');
    UI.showCharacter(this);
    return true;
  },

  /* ---------------- 作业 ---------------- */

  homeworkNum(n) {
    return ['', '一', '二', '三', '四', '五', '六', '七', '八', '九', '十'][n] || String(n);
  },

  acceptHomework(type) {
    const cfg = CFG.homework[type];
    if (!cfg) return;
    this.addItem(cfg.item, 1);
    const same = this.save.quests.commission.filter(q => q.homeworkType === type);
    const n = same.length + 1;
    const suffix = n > 1 ? this.homeworkNum(n) : '';
    this.save.quests.commission.push({
      id: 'hw_' + type + '_' + Date.now() + '_' + n,
      name: cfg.name + suffix,
      desc: cfg.desc,
      status: 'active',
      homeworkType: type
    });
    this.saveGame();
    UI.toast('已接取：' + cfg.name + suffix, 2200);
    SFX.play('quest');
    UI.showHomework(this);
  },

  completeHomework(type) {
    const idx = this.save.quests.commission.findIndex(q => q.homeworkType === type);
    if (idx >= 0) {
      const name = this.save.quests.commission[idx].name;
      this.save.quests.commission.splice(idx, 1);
      this.save.records.homeworkDone = (this.save.records.homeworkDone || 0) + 1;
      this.saveGame();
      UI.toast('作业完成：' + name, 2400);
      SFX.play('quest');
    }
  },

  startHomeworkFight(type) {
    this.homeworkFight = { type, remaining: 1 };
    const p = this.player;
    if (type === 'psych') {
      const boss = new BossSun(Math.min(LEVEL.width - 200, p.x + 420), true);
      this.enemies.push(boss);
      UI.toast('心理作业：孙点黑出现了', 2400);
    } else if (type === 'math') {
      this.homeworkFight.remaining = 5;
      for (let i = 0; i < 5; i++) {
        const x = Math.max(120, Math.min(LEVEL.width - 120, p.x + 260 + i * 150));
        const e = new Enemy({ x, a: x - 140, b: x + 140 }, 'hw:math:' + Date.now() + ':' + i);
        e.homework = true;
        e.role = 'math';
        this.enemies.push(e);
      }
      UI.toast('数学作业：5 只黑犬出现了', 2400);
    } else if (type === 'tech') {
      const x = Math.min(LEVEL.width - 150, p.x + 380);
      const e = new Pig({ x, a: x - 160, b: x + 160 }, 'hw:tech:' + Date.now());
      e.homework = true;
      e.role = 'tech';
      this.enemies.push(e);
      UI.toast('通技作业：王明猪出现了', 2400);
    } else if (type === 'sport') {
      const x = Math.max(180, Math.min(LEVEL.width - 200, p.x + 460));
      const boss = new TimeDemon(x, { index: 'hw:sport:' + Date.now() });
      boss.sport = true;
      this.enemies.push(boss);
      UI.toast('体育作业：时间恶魔出现了', 2600);
    }
    SFX.play('quest');
  },

  /* ---------------- 月考 ---------------- */

  startExam(restart) {
    this.exam = { wave: 0, timer: 0, restart: !!restart };
    this.homeworkFight = null;
    if (!restart) {
      UI.showLoot(['📄 月考试卷已使用', '三波敌人 · 请做好准备'], 3200, '月考开始');
      UI.toast('月考开始：第一波', 2400);
    } else {
      UI.toast('月考重新开始：第一波', 2400);
    }
    SFX.play('quest');
    this.spawnExamWave(1);
  },

  spawnExamWave(n) {
    const p = this.player;
    const baseX = p ? p.x : 300;
    this.exam.wave = n;
    this.exam.timer = 0;
    if (n === 1) {
      for (let i = 0; i < 5; i++) {
        const x = Math.max(120, Math.min(LEVEL.width - 120, baseX + 220 + i * 130));
        const e = new Enemy({ x, a: x - 160, b: x + 160 }, 'exam:dog:' + Date.now() + ':' + i);
        e.exam = true;
        e.examRole = 'dog';
        this.enemies.push(e);
      }
      UI.toast('第一波：5 只黑犬', 2200);
    } else if (n === 2) {
      for (let i = 0; i < 2; i++) {
        const x = Math.max(140, Math.min(LEVEL.width - 140, baseX + 320 + i * 320));
        const e = new Pig({ x, a: x - 200, b: x + 200 }, 'exam:pig:' + Date.now() + ':' + i);
        e.exam = true;
        e.examRole = 'pig';
        this.enemies.push(e);
      }
      UI.toast('第二波：2 只王明猪', 2200);
    } else if (n === 3) {
      const x = Math.max(200, Math.min(LEVEL.width - 200, baseX + 520));
      const boss = new TimeDemon(x, { index: 'exam:boss:' + Date.now() });
      boss.exam = true;
      this.enemies.push(boss);
      UI.toast('第三波：⏰ 时间恶魔', 2800);
      UI.showLoot(['⏰ 时间恶魔出现了'], 2600, '最终波');
    }
    SFX.play('quest');
  },

  updateExam(dt) {
    if (!this.exam) return;
    const threats = this.enemies.filter(e => !e.dead &&
      (e.kind === 'dog' || e.kind === 'pig' || e.kind === 'boss'));
    if (threats.length) { this.exam.timer = 0; return; }
    if (this.exam.wave >= 3) return;
    this.exam.timer += dt;
    if (this.exam.timer >= 1.5) {
      this.exam.timer = 0;
      this.spawnExamWave(this.exam.wave + 1);
    }
  },

  completeExam() {
    this.exam = null;
    this.save.world.examDone = true;
    this.save.world.worldLevel = 2;
    // 突破消耗世界等级 1 的 500 经验，超出部分继承到世界等级 2
    const inherited = Math.max(0, this.worldExp() - CFG.world.expCap);
    this.save.world.worldExp = inherited;
    this.grantQuestExp('yuekao', 200);
    const q = this.save.quests.side.find(x => x && x.id === 'yuekao');
    if (q) q.status = 'done';
    this.homeworkFight = null;
    this.saveGame();
    const loot = [
      '🌍 世界等级 → 2',
      '🌍 世界经验 +200',
      '角色等级上限 → 20',
      '技能等级上限 → 10',
      '荔头处新增：体育作业'
    ];
    if (inherited > 0) loot.splice(2, 0, '🌍 溢出经验继承 +' + inherited);
    UI.showLoot(loot, 5200, '月考完成');
    UI.toast('世界等级提升至 2', 3600);
    SFX.play('quest');
    this.effects.push({ type: 'burst', x: this.player.x, y: this.player.y - 40, t: 0, life: 0.8 });
    this.effects.push({ type: 'ring', x: this.player.x, y: this.player.y - 40, t: 0, life: 0.8, r0: 10, r1: 160, width: 6, color: '#ffd166' });
  },

  spawnHourglass(boss) {
    const list = this.enemies.filter(e => !e.dead &&
      (e.kind === 'hourglass' || e.kind === 'rewind'));
    if (list.filter(e => e.kind === 'hourglass').length >= CFG.timeDemon.hourglassMax) return;
    if (list.length >= 5) return;
    const p = this.player;
    let x = p.x + (Math.random() < 0.5 ? -1 : 1) * (90 + Math.random() * 90);
    x = Math.max(80, Math.min(LEVEL.width - 80, x));
    this.enemies.push(new TimeHourglass(this, boss, x));
    this.spawnText(x, LEVEL.floorY - 80, '⌛ 倒计时 15s', '#ff6b76');
  },

  spawnRewind(boss) {
    const list = this.enemies.filter(e => !e.dead &&
      (e.kind === 'hourglass' || e.kind === 'rewind'));
    if (list.filter(e => e.kind === 'rewind').length >= CFG.timeDemon.rewindMax) return;
    if (list.length >= 5) return;
    let x = boss.x + (Math.random() < 0.5 ? -1 : 1) * (150 + Math.random() * 160);
    x = Math.max(80, Math.min(LEVEL.width - 80, x));
    this.enemies.push(new TimeRewind(this, boss, x));
    this.spawnText(x, LEVEL.floorY - 80, '⏪ 倒计时 10s', '#ff6b76');
  },

  firePauseShot(boss) {
    if (this.projectiles.some(p => p.kind === 'pause' && !p.dead)) return;
    const shot = new PauseShot(boss);
    const p = this.player;
    const dx = p.x - shot.x;
    const dy = (p.y - 25) - shot.y;
    const d = Math.hypot(dx, dy) || 1;
    const sp = 520;
    shot.vx = (dx / d) * sp;
    shot.vy = (dy / d) * sp;
    this.projectiles.push(shot);
    this.spawnText(boss.x, boss.y - 120, '⏸️', '#c9a6ff');
  },

  /* ---------------- 成就 ---------------- */

  achievementValue(a) {
    const r = this.save.records;
    if (a.kind === 'kills') return r.kills | 0;
    if (a.kind === 'homework') return r.homeworkDone | 0;
    if (a.kind === 'gold') return r.maxGold | 0;
    if (a.kind === 'weapons') {
      return Object.keys(r.weaponKills || {}).filter(id => (r.weaponKills[id] | 0) > 0).length;
    }
    if (a.kind === 'dogs') return r.dogKills | 0;
    if (a.kind === 'flag') {
      if (a.id === 'tear') return (this.itemCount('tear') > 0 || this.save.world.tearsQuest > 0) ? 1 : 0;
      if (a.id === 'newbie') {
        return (this.save.world.maps.includes('qian') || this.save.world.tutorialDone) ? 1 : 0;
      }
      if (a.id === 'pig') {
        return (r.pigKills > 0 || this.save.world.pigDefeated.length > 0) ? 1 : 0;
      }
    }
    return 0;
  },

  checkAchievements(notify) {
    const r = this.save.records;
    r.maxGold = Math.max(r.maxGold | 0, this.save.gold);
    const unlocked = [];
    for (const a of CFG.achievements) {
      if (this.save.achievements[a.id]) continue;
      if (this.achievementValue(a) >= a.goal) {
        this.save.achievements[a.id] = true;
        unlocked.push(a.name);
      }
    }
    if (unlocked.length) {
      this.saveGame();
      if (notify !== false) UI.toast('🏆 成就解锁：' + unlocked.join('、'), 3200);
    }
  },

  recordWeaponKill(weaponId) {
    if (!weaponId) return;
    const wk = this.save.records.weaponKills;
    wk[weaponId] = (wk[weaponId] || 0) + 1;
  },

  /* ---------------- 对话 ---------------- */
