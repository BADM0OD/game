<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Knight: EmojiKnight</title>
<!-- build: redeploy --><!-- build: 2 -->
<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #07090f;
  color: #e9f0ff;
  font-family: "Microsoft YaHei", "PingFang SC", "Segoe UI", system-ui, sans-serif;
  user-select: none;
}

#stage {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 1280px;
  height: 720px;
  transform-origin: center center;
  background: #10141d;
  overflow: hidden;
}

#game {
  display: block;
  width: 1280px;
  height: 720px;
}

#hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

/* ---------- 队伍 ---------- */
#party {
  position: absolute;
  left: 18px;
  top: 16px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.pcard {
  display: flex;
  align-items: center;
  gap: 9px;
  width: 228px;
  padding: 5px 10px 5px 5px;
  border-radius: 12px;
  background: rgba(9, 13, 22, 0.68);
  border: 1px solid rgba(120, 170, 255, 0.16);
  transition: border-color .15s, box-shadow .15s;
}

.pcard.active {
  border-color: rgba(110, 210, 255, 0.85);
  box-shadow: 0 0 16px rgba(70, 190, 255, 0.28);
}

.pcard.dead { opacity: .42; filter: grayscale(1); }

.pavatar {
  width: 38px;
  height: 38px;
  flex: 0 0 38px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 21px;
  line-height: 1;
  border: 1px solid rgba(255,255,255,.35);
}

.pinfo { flex: 1; min-width: 0; }

.pname {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  letter-spacing: .5px;
  color: #dce9ff;
}

.pname .pkey { color: #7f95bb; font-size: 10px; }

.pbar {
  height: 5px;
  margin-top: 3px;
  border-radius: 3px;
  background: rgba(255,255,255,.10);
  overflow: hidden;
}

.pbar i {
  display: block;
  height: 100%;
  width: 100%;
  background: linear-gradient(90deg, #43e0a0, #9cf0c4);
  transition: width .12s linear;
}

.pbar.hp.low i { background: linear-gradient(90deg, #ff5d6c, #ff9f6e); }

.pips { display: flex; gap: 3px; margin-top: 4px; }
.pip { width: 5px; height: 5px; border-radius: 50%; background: rgba(255,255,255,.16); }
.pip.on { background: #ffd166; box-shadow: 0 0 6px rgba(255,209,102,.8); }

/* ---------- 钱包 ---------- */
#wallet {
  position: absolute;
  right: 18px;
  top: 16px;
  text-align: right;
  font-size: 12px;
  line-height: 1.7;
  color: #cfe0ff;
  background: rgba(9, 13, 22, 0.55);
  border: 1px solid rgba(120, 170, 255, 0.12);
  border-radius: 10px;
  padding: 6px 11px;
}

#wallet .muted { color: #8296b8; }

/* ---------- 教学提示 ---------- */
#tutorial {
  position: absolute;
  left: 50%;
  top: 88px;
  transform: translateX(-50%);
  max-width: 880px;
  padding: 13px 28px;
  border-radius: 18px;
  background: rgba(8, 12, 20, .86);
  border: 2px solid rgba(120, 200, 255, .5);
  box-shadow: 0 0 26px rgba(60, 160, 255, .28), inset 0 0 18px rgba(60, 160, 255, .08);
  font-size: 20px;
  font-weight: 700;
  letter-spacing: .6px;
  text-align: center;
  color: #f2f9ff;
  text-shadow: 0 1px 6px rgba(0, 0, 0, .6);
  transition: opacity .25s;
}

#tutorial b { color: #8fe9ff; font-weight: 800; }
#tutorial .idx { color: #9fc0e6; margin-right: 10px; font-size: 15px; font-weight: 700; }
#tutorial .guideSub { display: block; margin-top: 6px; font-size: 15px; font-weight: 500; color: #a9c4e2; }
#tutorial .guideSub b { color: #b6e3ff; }

/* ---------- 战利品提示 ---------- */
#lootFeed {
  position: absolute;
  left: 50%;
  top: 138px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  pointer-events: none;
  z-index: 8;
}

.lootBox {
  min-width: 156px;
  padding: 8px 18px;
  border-radius: 10px;
  background: rgba(8, 12, 20, .8);
  border: 1px solid rgba(255, 209, 102, .38);
  box-shadow: 0 8px 22px rgba(0, 0, 0, .35);
  animation: lootIn .18s ease-out both;
}

.lootBox.out { animation: lootOut .3s ease-in both; }

.lootTitle {
  margin-bottom: 5px;
  text-align: center;
  font-size: 11px;
  letter-spacing: 2px;
  color: #ffd98a;
}

.lootRow {
  font-size: 13px;
  line-height: 1.6;
  letter-spacing: .5px;
  color: #eef6ff;
  text-align: center;
  white-space: nowrap;
}

@keyframes lootIn {
  from { opacity: 0; transform: translateY(-8px); }
  to { opacity: 1; transform: none; }
}

@keyframes lootOut {
  to { opacity: 0; transform: translateY(-6px); }
}

/* ---------- 道具（状态栏上方） ---------- */
#items {
  position: absolute;
  left: 20px;
  bottom: 148px;
  display: flex;
  gap: 8px;
}

.slot {
  position: relative;
  width: 50px;
  height: 50px;
  border-radius: 10px;
  background: rgba(9, 13, 22, .62);
  border: 1px dashed rgba(120, 170, 255, .25);
  display: grid;
  place-items: center;
  color: #5d7190;
  font-size: 11px;
}

.slot .key {
  position: absolute;
  top: 2px;
  left: 5px;
  font-size: 10px;
  color: #7c92b4;
}

.slot .slotIcon {
  font-size: 20px;
  line-height: 1;
}

.slot.has {
  border-style: solid;
  border-color: rgba(255, 209, 102, .5);
  color: #eaf4ff;
}

.slotCd {
  position: absolute;
  right: 4px;
  bottom: 3px;
  font-size: 10px;
  font-weight: 700;
  color: #ffd166;
}

/* ---------- 状态栏 ---------- */
#status {
  position: absolute;
  left: 20px;
  bottom: 18px;
  width: 330px;
  padding: 8px 12px 10px;
  border-radius: 12px;
  background: rgba(9, 13, 22, .66);
  border: 1px solid rgba(120, 170, 255, .14);
}

.srow {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  margin-bottom: 6px;
}

#charName { color: #eaf3ff; letter-spacing: .5px; }

#buffList { display: flex; gap: 5px; flex-wrap: wrap; }

.buff {
  font-size: 10px;
  padding: 1px 7px;
  border-radius: 999px;
  background: rgba(120, 200, 255, .14);
  border: 1px solid rgba(120, 200, 255, .3);
  color: #bfe9ff;
}

.buff.awake { background: rgba(255, 200, 90, .14); border-color: rgba(255, 200, 90, .35); color: #ffe2a3; }
.buff.focus { background: rgba(190, 140, 255, .16); border-color: rgba(190, 140, 255, .4); color: #e2ccff; }
.buff.shield { background: rgba(110, 235, 160, .14); border-color: rgba(110, 235, 160, .35); color: #b9f5cf; }
.buff.sprout { background: rgba(150, 220, 140, .14); border-color: rgba(150, 220, 140, .4); color: #d2f5c8; }
.buff.para { background: rgba(110, 200, 255, .16); border-color: rgba(110, 200, 255, .45); color: #bfe9ff; }
.buff.coffee { background: rgba(230, 170, 120, .16); border-color: rgba(230, 170, 120, .45); color: #ffd9b8; }

.bar {
  position: relative;
  height: 16px;
  margin-top: 5px;
  border-radius: 5px;
  background: rgba(255, 255, 255, .08);
  overflow: hidden;
}

.bar i {
  position: absolute;
  inset: 0 auto 0 0;
  width: 100%;
  border-radius: 5px;
  transition: width .1s linear;
}

.bar.hp i { background: linear-gradient(90deg, #2fbf7d, #6fe3a6); }
.bar.st i { background: linear-gradient(90deg, #c98a2f, #f0c05e); }
.bar span {
  position: relative;
  display: block;
  text-align: center;
  font-size: 10px;
  line-height: 16px;
  color: #0a1017;
  font-weight: 700;
  letter-spacing: .5px;
  text-shadow: 0 1px 0 rgba(255,255,255,.25);
}

/* ---------- 技能（圆形图标） ---------- */
#skills {
  position: absolute;
  right: 24px;
  bottom: 18px;
  display: flex;
  align-items: flex-end;
  gap: 20px;
}

.skillSlot {
  display: flex;
  flex-direction: column;
  align-items: center;
}

.skillLabel {
  font-size: 11px;
  letter-spacing: 1px;
  color: #d7e6ff;
  margin-bottom: 7px;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .85);
}

.skillCircle {
  position: relative;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: radial-gradient(circle at 35% 30%, #ffffff, #e3e8f4 55%, #b8c2d6);
  border: 2px solid #f4f7ff;
  box-shadow: 0 0 14px rgba(255, 255, 255, .18);
  transition: background .15s, box-shadow .15s, border-color .15s, filter .15s;
}

.skillSlot.q .skillCircle { width: 75px; height: 75px; }

.skillCircle.off {
  filter: saturate(.35) brightness(.84);
  box-shadow: none;
}

.skillCircle.full {
  /* 充能完成时的包边由角色主题色在 UI.render 中设置 */
}

.skillFace { font-size: 22px; line-height: 1; }
.skillSlot.q .skillFace { font-size: 32px; }

.skillCircle .skillNum {
  position: absolute;
  font-size: 15px;
  font-weight: 700;
  color: #2a3140;
}

.skillSlot.q .skillNum { font-size: 22px; }

.skillCircle.off .skillNum,
.skillCircle.off .skillFace { color: #3f454f; }

.skillKey {
  position: absolute;
  right: -2px;
  bottom: -2px;
  width: 16px;
  height: 16px;
  border-radius: 50%;
  background: rgba(10, 16, 26, .82);
  color: #9fc6f0;
  font-size: 9px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(140, 190, 255, .35);
}

/* ---------- 遮罩 ---------- */
#overlay {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(4, 7, 12, .84);
  backdrop-filter: blur(3px);
  pointer-events: auto;
  z-index: 10;
}

#overlay.hidden, #toast.hidden, #tutorial.hidden { display: none; }

.panel {
  width: 760px;
  max-width: 92%;
  max-height: 88%;
  overflow: auto;
  padding: 26px 32px 24px;
  border-radius: 18px;
  background: linear-gradient(160deg, rgba(22, 30, 46, .98), rgba(11, 16, 26, .98));
  border: 1px solid rgba(120, 180, 255, .22);
  box-shadow: 0 24px 80px rgba(0, 0, 0, .6), inset 0 0 60px rgba(60, 140, 255, .05);
}

.panel h1 {
  margin: 0;
  font-size: 30px;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #9fe5ff, #ffffff 45%, #ffd98a);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

.panel h2 { margin: 0 0 6px; font-size: 22px; letter-spacing: 1px; color: #eaf4ff; }
.panel .sub { color: #8ea6c9; font-size: 13px; margin-top: 6px; letter-spacing: 1px; }
.panel p { font-size: 13px; color: #b9cbe6; line-height: 1.8; }

.panel .cols { display: flex; gap: 26px; margin-top: 18px; }
.panel .col { flex: 1; }

.kv { display: flex; justify-content: space-between; font-size: 12px; padding: 3px 0; border-bottom: 1px dashed rgba(120, 170, 255, .12); color: #a9bddb; }
.kv b { color: #e6f2ff; font-weight: 600; }

.btnrow { display: flex; gap: 12px; margin-top: 20px; }

button {
  pointer-events: auto;
  cursor: pointer;
  font-family: inherit;
  font-size: 14px;
  letter-spacing: 1px;
  padding: 10px 22px;
  border-radius: 10px;
  border: 1px solid rgba(120, 200, 255, .45);
  background: linear-gradient(180deg, rgba(50, 120, 190, .55), rgba(25, 60, 110, .65));
  color: #eaf6ff;
  transition: transform .08s, filter .15s;
}

button:hover { filter: brightness(1.18); }
button:active { transform: translateY(1px); }
button.ghost { background: rgba(255,255,255,.04); border-color: rgba(160,190,230,.25); color: #c6d6ee; }

.unlockcard {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 14px;
  padding: 10px 14px;
  border-radius: 12px;
  background: rgba(255, 209, 102, .07);
  border: 1px solid rgba(255, 209, 102, .35);
}

.unlockcard .uav {
  width: 44px; height: 44px; border-radius: 50%;
  background: #f2e4c8; border: 1px solid #cbb389;
  display: grid; place-items: center; font-size: 24px;
}

/* ---------- 浮动提示 ---------- */
#toast {
  position: absolute;
  left: 50%;
  top: 24%;
  transform: translateX(-50%);
  padding: 8px 18px;
  border-radius: 999px;
  background: rgba(10, 16, 26, .85);
  border: 1px solid rgba(255, 209, 102, .4);
  color: #ffe6ac;
  font-size: 13px;
  letter-spacing: .5px;
  pointer-events: none;
  z-index: 20;
  white-space: nowrap;
}

/* ---------- 通用隐藏 ---------- */
#hud.hidden { display: none; }

/* ---------- 标题界面（学校风格） ---------- */
.titleScreen {
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background:
    radial-gradient(circle at 22% 10%, rgba(255, 255, 255, .4), transparent 42%),
    linear-gradient(180deg, #efe7d5 0%, #e5dac1 52%, #dbcbaa 100%);
}

.titleBoardBg {
  position: absolute;
  left: 50%;
  top: 62px;
  transform: translateX(-50%);
  width: min(980px, 86%);
  height: 472px;
  border-radius: 8px;
  border: 16px solid #8a6644;
  background:
    radial-gradient(circle at 26% 28%, rgba(255, 255, 255, .05), transparent 42%),
    radial-gradient(circle at 72% 74%, rgba(255, 255, 255, .035), transparent 46%),
    linear-gradient(160deg, #385441, #293f31 68%, #1f3227);
  box-shadow:
    0 18px 40px rgba(60, 40, 20, .35),
    inset 0 0 70px rgba(0, 0, 0, .35);
}

.titleBoardBg::after {
  content: '';
  position: absolute;
  left: -16px;
  right: -16px;
  bottom: -27px;
  height: 13px;
  border-radius: 4px;
  background: linear-gradient(180deg, #b08a60, #8f6a46);
  box-shadow: 0 5px 12px rgba(50, 30, 10, .3);
}

.titleFloor {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  height: 152px;
  border-top: 8px solid #8a6644;
  background:
    repeating-linear-gradient(90deg, rgba(80, 52, 26, .18) 0 2px, transparent 2px 120px),
    repeating-linear-gradient(90deg, #a87e52 0 120px, #9d744b 120px 240px);
  box-shadow: inset 0 10px 22px rgba(60, 40, 20, .18);
}

.schoolDesk {
  position: absolute;
  z-index: 2;
  width: 210px;
  height: 98px;
  bottom: 112px;
}

.schoolDesk::before {
  content: '';
  position: absolute;
  left: 0;
  right: 0;
  top: 0;
  height: 18px;
  border-radius: 6px;
  background: linear-gradient(180deg, #c79a67, #a97c4b);
  box-shadow: 0 6px 12px rgba(50, 30, 10, .25);
}

.schoolDesk::after {
  content: '';
  position: absolute;
  left: 14px;
  right: 14px;
  top: 18px;
  bottom: 0;
  background: linear-gradient(90deg,
    #8a6644 0 12px,
    transparent 12px calc(100% - 12px),
    #8a6644 calc(100% - 12px));
  border-radius: 3px;
}

.schoolDesk.d1 { left: 5%; }
.schoolDesk.d2 { right: 6%; }

.titleContent {
  position: relative;
  z-index: 3;
  width: 100%;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding-bottom: 116px;
}

.titleGlow {
  position: absolute;
  top: 90px;
  left: 50%;
  width: 900px;
  height: 480px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(255, 255, 255, .10), rgba(255, 255, 255, 0) 62%);
  pointer-events: none;
}

.gameTitle {
  position: relative;
  font-size: 92px;
  font-weight: 900;
  letter-spacing: 14px;
  line-height: 1.05;
  color: #f8f6ec;
  text-shadow:
    0 2px 0 rgba(10, 20, 12, .35),
    0 0 22px rgba(255, 255, 255, .22),
    0 0 60px rgba(200, 230, 200, .12);
}

.gameSub {
  position: relative;
  font-size: 34px;
  letter-spacing: 18px;
  color: #ffe08a;
  margin-bottom: 40px;
  text-shadow: 0 0 18px rgba(255, 209, 102, .4), 0 2px 0 rgba(20, 30, 20, .3);
}

.titleMenu {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 11px;
  width: 300px;
}

.titleMenu button {
  width: 100%;
  padding: 12px 20px;
  font-size: 16px;
  letter-spacing: 6px;
  border-radius: 10px;
  background: linear-gradient(180deg, rgba(58, 90, 70, .94), rgba(28, 48, 36, .96));
  border: 2px solid rgba(238, 244, 228, .5);
  color: #f5f6ec;
  text-shadow: 0 1px 0 rgba(0, 0, 0, .4);
  box-shadow: 0 8px 20px rgba(20, 30, 20, .32), inset 0 0 18px rgba(255, 255, 255, .04);
}

.titleMenu button:hover {
  border-color: #fff3c4;
  box-shadow: 0 0 24px rgba(255, 235, 160, .32), inset 0 0 18px rgba(255, 255, 255, .08);
}

/* ---------- 开场动画 ---------- */
.introScreen {
  width: 100%;
  height: 100%;
  background: #000;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 0 150px;
  cursor: pointer;
}

.introText {
  max-width: 900px;
  color: #f2f5fa;
  font-size: 25px;
  line-height: 1.95;
  letter-spacing: 2px;
  text-align: center;
  animation: introFade .45s ease-out both;
}

@keyframes introFade {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.introDots {
  display: flex;
  gap: 8px;
  margin-top: 28px;
}

.introDot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: rgba(255, 255, 255, .18);
  transition: background .2s, box-shadow .2s;
}

.introDot.on {
  background: #ffd166;
  box-shadow: 0 0 8px rgba(255, 209, 102, .8);
}

.introHint {
  position: absolute;
  left: 50%;
  transform: translateX(-50%);
  bottom: 78px;
  font-size: 13px;
  letter-spacing: 3px;
  color: #e0b34e;
  animation: hintPulse 1.6s ease-in-out infinite;
}

@keyframes hintPulse {
  0%, 100% { opacity: .45; }
  50% { opacity: 1; }
}

/* ---------- 加载存档 ---------- */
.dropZone {
  margin-top: 18px;
  height: 240px;
  border-radius: 16px;
  border: 2px dashed rgba(120, 190, 255, .4);
  background: rgba(30, 52, 84, .28);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 10px;
  cursor: pointer;
  transition: border-color .15s, background .15s;
}

.dropZone:hover, .dropZone.over {
  border-color: #8fe0ff;
  background: rgba(50, 110, 170, .26);
}

.dzIcon { font-size: 44px; }
.dzMain { font-size: 15px; color: #dcecff; letter-spacing: 1px; }
.dzHint { font-size: 12px; color: #7e97b9; }

.loadError {
  min-height: 18px;
  margin-top: 10px;
  color: #ff8b96;
  font-size: 12px;
  text-align: center;
}

/* ---------- 设置 ---------- */
.settingsGrid {
  margin-top: 16px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 7px 22px;
  max-height: 430px;
  overflow-y: auto;
  padding-right: 6px;
}

.settingRow {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 4px 10px;
  border-radius: 8px;
  background: rgba(255, 255, 255, .03);
  border: 1px solid rgba(120, 170, 255, .1);
  font-size: 12px;
  color: #c3d6ef;
}

.keyBtn {
  min-width: 96px;
  padding: 4px 10px;
  font-size: 12px;
  letter-spacing: 0;
  border-radius: 7px;
  background: rgba(10, 18, 30, .8);
  border: 1px solid rgba(140, 200, 255, .35);
  color: #9fd7ff;
}

.keyBtn.capturing {
  border-color: #ffd166;
  color: #ffe6ac;
  animation: hintPulse 1s ease-in-out infinite;
}

.volRow {
  margin-top: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  font-size: 13px;
  color: #c3d6ef;
}

.volRow input[type="range"] {
  flex: 1;
  accent-color: #7fd0ff;
  pointer-events: auto;
}

.volRow b { min-width: 46px; text-align: right; color: #9fd7ff; }

/* ---------- 暂停 ---------- */
.pauseMenu {

<script>
'use strict';

const Input = {
  down: {},
  pressed: {},
  released: {},

  mouse: {
    left:  { down: false, pressed: false, released: false, held: 0 },
    right: { down: false, pressed: false, released: false, held: 0 }
  },

  wheel: 0,

  // 物理左键状态：不受键位重映射影响，用于界面/对话推进
  rawLeft: { down: false, pressed: false },

  ACTIONS: [
    { id: 'KeyA', label: '向左移动' },
    { id: 'KeyD', label: '向右移动' },
    { id: 'KeyW', label: '跳跃 / 向上爬' },
    { id: 'KeyS', label: '梯子下降' },
    { id: 'ControlLeft', label: '蹲下' },
    { id: 'ShiftLeft', label: '冲刺 / 疾跑' },
    { id: 'KeyE', label: '技能 E' },
    { id: 'KeyQ', label: '终结技 Q' },
    { id: 'KeyB', label: '背包' },
    { id: 'KeyJ', label: '任务栏' },
    { id: 'KeyT', label: '角色面板' },
    { id: 'KeyY', label: '成就' },
    { id: 'KeyM', label: '地图' },
    { id: 'KeyF', label: '交谈' },
    { id: 'KeyP', label: '检查点存档' },
    { id: 'Escape', label: '暂停' },
    { id: 'Mouse0', label: '普攻（鼠标）' },
    { id: 'Mouse2', label: '格挡（鼠标）' }
  ],

  binds: {},
  settings: { volume: 0.6 },
  capturing: null,

  init(canvas) {
    for (const a of this.ACTIONS) this.binds[a.id] = a.id;
    for (const k of ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'KeyZ', 'KeyX', 'KeyC', 'KeyV']) {
      this.binds[k] = k;
    }
    this.loadSettings();

    const block = [
      'KeyW', 'KeyA', 'KeyS', 'KeyD', 'ShiftLeft', 'ControlLeft',
      'KeyE', 'KeyQ', 'KeyZ', 'KeyX', 'KeyC', 'KeyV', 'KeyB', 'KeyJ', 'KeyT', 'KeyY', 'KeyM', 'KeyF', 'KeyP',
      'Digit1', 'Digit2', 'Digit3', 'Digit4'
    ];

    window.addEventListener('keydown', (e) => {
      if (block.includes(e.code)) e.preventDefault();
      if (this.capturing) return;
      if (e.repeat) return;
      const c = this.resolve(e.code);
      if (c) this.press(c);
    });

    window.addEventListener('keyup', (e) => {
      if (this.capturing) return;
      const c = this.resolve(e.code);
      if (c) this.release(c);
    });

    window.addEventListener('blur', () => {
      this.down = {};
      this.pressed = {};
      this.released = {};
      this.mouse.left.down = false;
      this.mouse.right.down = false;
      this.rawLeft.down = false;
    });

    window.addEventListener('wheel', (e) => {
      this.wheel += Math.sign(e.deltaY);
    }, { passive: true });

    canvas.addEventListener('contextmenu', (e) => e.preventDefault());

    canvas.addEventListener('mousedown', (e) => {
      if (this.capturing) return;
      e.preventDefault();
      if (e.button === 0) {
        if (!this.rawLeft.down) this.rawLeft.pressed = true;
        this.rawLeft.down = true;
      }
      const c = this.resolve('Mouse' + e.button);
      if (c) this.press(c);
    });

    window.addEventListener('mouseup', (e) => {
      if (this.capturing) return;
      if (e.button === 0) this.rawLeft.down = false;
      const c = this.resolve('Mouse' + e.button);
      if (c) this.release(c);
    });
  },

  /* ---------- 键位解析 ---------- */

  resolve(physical) {
    for (const k in this.binds) {
      if (this.binds[k] === physical) return k;
    }
    return null;
  },

  press(c) {
    if (c === 'Mouse0') {
      if (!this.mouse.left.down) this.mouse.left.pressed = true;
      this.mouse.left.down = true;
      this.mouse.left.held = 0;
      return;
    }
    if (c === 'Mouse2') {
      if (!this.mouse.right.down) this.mouse.right.pressed = true;
      this.mouse.right.down = true;
      this.mouse.right.held = 0;
      return;
    }
    this.down[c] = true;
    this.pressed[c] = true;
  },

  release(c) {
    if (c === 'Mouse0') {
      if (this.mouse.left.down) this.mouse.left.released = true;
      this.mouse.left.down = false;
      return;
    }
    if (c === 'Mouse2') {
      if (this.mouse.right.down) this.mouse.right.released = true;
      this.mouse.right.down = false;
      return;
    }
    this.down[c] = false;
    this.released[c] = true;
  },

  rebind(action, physical) {
    const fixed = ['Digit1', 'Digit2', 'Digit3', 'Digit4', 'KeyZ', 'KeyX', 'KeyC', 'KeyV'];
    if (fixed.includes(physical)) return false;
    const other = Object.keys(this.binds).find(k => this.binds[k] === physical && k !== action);
    if (other) this.binds[other] = this.binds[action];
    this.binds[action] = physical;
    this.saveSettings();
    return true;
  },

  keyName(physical) {
    if (!physical) return '未绑定';
    if (physical === 'Mouse0') return '鼠标左键';
    if (physical === 'Mouse1') return '鼠标中键';
    if (physical === 'Mouse2') return '鼠标右键';
    if (physical.startsWith('Mouse')) return '鼠标' + physical.slice(5);
    if (physical.startsWith('Key')) return physical.slice(3);
    if (physical.startsWith('Digit')) return physical.slice(5);
    const map = {
      ShiftLeft: 'Shift', ShiftRight: 'Shift', ControlLeft: 'Ctrl', ControlRight: 'Ctrl',
      AltLeft: 'Alt', AltRight: 'Alt', Space: '空格', Escape: 'Esc', Enter: '回车',
      ArrowLeft: '←', ArrowRight: '→', ArrowUp: '↑', ArrowDown: '↓',
      Backquote: '`', Minus: '-', Equal: '=', BracketLeft: '[', BracketRight: ']',
      Semicolon: ';', Quote: "'", Comma: ',', Period: '.', Slash: '/', Backslash: '\\'
    };
    return map[physical] || physical;
  },

  keyNameOf(action) {
    return this.keyName(this.binds[action]);
  },

  /* ---------- 设置 ---------- */

  loadSettings() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(SETTINGS_KEY)); } catch (e) { data = null; }
    if (!data || typeof data !== 'object') return;
    if (data.binds && typeof data.binds === 'object') {
      for (const a of this.ACTIONS) {
        const v = data.binds[a.id];
        if (typeof v === 'string') this.binds[a.id] = v;
      }
    }
    if (typeof data.volume === 'number') this.settings.volume = Math.max(0, Math.min(1, data.volume));
  },

  saveSettings() {
    try {
      localStorage.setItem(SETTINGS_KEY, JSON.stringify({
        binds: this.binds,
        volume: this.settings.volume
      }));
    } catch (e) { /* 忽略存储失败 */ }
  },

  key(code) { return !!this.down[code]; },
  keyPressed(code) { return !!this.pressed[code]; },
  keyReleased(code) { return !!this.released[code]; },

  update(dt) {
    if (this.mouse.left.down) this.mouse.left.held += dt;
    if (this.mouse.right.down) this.mouse.right.held += dt;
  },

  endFrame() {
    this.pressed = {};
    this.released = {};
    this.mouse.left.pressed = false;
    this.mouse.left.released = false;
    this.mouse.right.pressed = false;
    this.mouse.right.released = false;
    this.rawLeft.pressed = false;
    this.wheel = 0;
  }
};

<script>
'use strict';

const SFX = {
  ctx: null,
  volume: 0.6,

  init() {
    this.volume = Input.settings.volume;
  },

  ensure() {
    try {
      if (!this.ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        this.ctx = new AC();
      }
      if (this.ctx.state === 'suspended') this.ctx.resume();
      return this.ctx;
    } catch (e) {
      return null;
    }
  },

  setVolume(v) {
    this.volume = Math.max(0, Math.min(1, v));
    Input.settings.volume = this.volume;
  },

  tone(freq, dur, type, gain, slideTo) {
    if (this.volume <= 0) return;
    const ctx = this.ensure();
    if (!ctx) return;
    const t0 = ctx.currentTime;
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(Math.max(30, slideTo), t0 + dur);
    const peak = (gain == null ? 0.16 : gain) * this.volume;
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0002, peak), t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.02);
  },

  play(name) {
    switch (name) {
      case 'click': this.tone(640, 0.05, 'square', 0.05); break;
      case 'hit': this.tone(190, 0.09, 'triangle', 0.18, 90); break;
      case 'heavy': this.tone(120, 0.16, 'sawtooth', 0.16, 55); break;
      case 'hurt': this.tone(150, 0.18, 'sawtooth', 0.16, 70); break;
      case 'coin': this.tone(980, 0.09, 'sine', 0.12, 1350); break;
      case 'pickup': this.tone(520, 0.14, 'sine', 0.13, 820); break;
      case 'jump': this.tone(320, 0.09, 'sine', 0.08, 520); break;
      case 'quest': this.tone(660, 0.16, 'sine', 0.12, 880); break;
      case 'perfectBlock':
        this.tone(1568, 0.07, 'sine', 0.14);
        this.tone(2093, 0.12, 'sine', 0.08);
        break;
      case 'talk': this.tone(430, 0.05, 'square', 0.05, 520); break;
      case 'save': this.tone(520, 0.22, 'sine', 0.12, 780); break;
      case 'open': this.tone(360, 0.1, 'sine', 0.1, 540); break;
      default: break;
    }
  }
};

<script>
'use strict';

/* ---------------- 通用工具 ---------------- */

function aabbBox(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function circleRect(cx, cy, r, b) {
  const nx = Math.max(b.x, Math.min(cx, b.x + b.w));
  const ny = Math.max(b.y, Math.min(cy, b.y + b.h));
  const dx = cx - nx;
  const dy = cy - ny;
  return dx * dx + dy * dy <= r * r;
}

function calcDamage(atk, mult, def, critRate, critDmg) {
  let dmg = atk * mult * (100 / Math.max(1, def));
  const crit = Math.random() < critRate;
  if (crit) dmg *= critDmg;
  return { dmg: Math.max(1, Math.round(dmg)), crit };
}

function approach(v, target, step) {
  if (v < target) return Math.min(v + step, target);
  if (v > target) return Math.max(v - step, target);
  return v;
}

/* ---------------- 角色运行时 ---------------- */

class CharacterState {
  constructor(def, game) {
    this.def = def;
    this.game = game;
    this.hp = this.hpMax;
    this.ult = 0;
    this.eCd = 0;
    this.qCd = 0;
    this.stealth = 0;
    this.awake = 0;
    this.weapon = null;
    this.sprout = 0;
  }
  get alive() { return this.hp > 0; }
  get progress() {
    const p = this.game && this.game.save && this.game.save.progress;
    return (p && p[this.def.id]) || { level: 1, e: 1, q: 1 };
  }
  get level() { return this.progress.level || 1; }
  get hpMax() {
    return this.def.hpMax + CFG.upgrade.level.hp * (this.level - 1);
  }
  get atk() {
    return this.def.atk + CFG.upgrade.level.atk * (this.level - 1);
  }
  get defense() {
    return this.def.def + CFG.upgrade.level.def * (this.level - 1);
  }
}

/* ---------------- 玩家 ---------------- */

class Player {
  constructor(game) {
    this.game = game;
    this.characters = [];
    this.active = 0;

    this.w = 50;
    this.h = 50;
    this.x = LEVEL.spawn.x;
    this.y = LEVEL.spawn.y;
    this.vx = 0;
    this.vy = 0;
    this.dir = 1;
    this.grounded = true;
    this.crouching = false;
    this.dead = false;

    this.stamina = CFG.stamina.max;
    this.staminaIdle = 99;

    this.attack = null;
    this.combo = 0;
    this.comboIdle = 0;
    this.queued = false;
    this.holdConsumed = false;
    this.fireTimer = 0;
    this.paperCd = 0;

    this.blocking = false;
    this.blockTime = 0;

    this.dash = { t: 0, cd: 0, airLeft: CFG.dash.air, dir: 1 };
    this.dodgeFlagged = false;

    this.invuln = 0;
    this.hurtFlash = 0;
    this.anim = 0;
    this.trailTimer = 0;
    this.coyote = 0;
    this.jumpBuffer = 0;
    this.switchCd = 0;

    // 针男人护盾（跟随当前场上角色）
    this.shield = 0;
    this.shieldTime = 0;
    this.shieldOwner = null;
    this.shieldSplashMult = CFG.shield.splashMult;

    // 梯子 / 麻痹
    this.onLadder = false;
    this.ladderLock = false;
    this.ladderExitT = 0;
    this.paralyzed = 0;

    // 咖啡加速
    this.haste = 0;
    this.penOut = false;
  }

  get ch() { return this.characters[this.active]; }
  get def() { return this.ch.def; }
  get weapon() { return CFG.weapons[this.ch.weapon] || CFG.weapons.fist; }

  // 柳寒伊的「睡醒了」持续期间无法获得终结技充能；能荣泽可以

  progressOf(id) {
    const s = this.game.save;
    if (!s.progress[id]) s.progress[id] = { level: 1, e: 1, q: 1 };
    return s.progress[id];
  }

  paperMult() {
    const base = CFG.awake.paperMult;
    const lv = this.progressOf('liuhanyi').q || 1;
    return base + CFG.upgrade.skills.liuhanyi.q.multStep * (lv - 1);
  }

  addCharacter(id) {
    const def = CFG.characters[id];
    if (!def) return false;
    const st = new CharacterState(def, this.game);
    const eq = this.game.save && this.game.save.equipped;
    st.weapon = (eq && eq[id]) || null;
    this.characters.push(st);
    return true;
  }

  box() {
    return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h };
  }

  canBeSeen() { return !this.dead && this.ch.stealth <= 0; }
  isDashing() { return this.dash.t > 0; }

  useStamina(n) {
    this.stamina = Math.max(0, this.stamina - n);
    this.staminaIdle = 0;
  }

  resetAt(x, y) {
    this.x = x;
    this.y = y;
    this.vx = 0;
    this.vy = 0;
    this.dir = 1;
    this.dead = false;
    this.attack = null;
    this.blocking = false;
    this.dash.t = 0;
    this.dash.cd = 0;
    this.dash.airLeft = CFG.dash.air;
    this.invuln = 1.2;
    this.stamina = CFG.stamina.max;
    this.staminaIdle = 99;
    this.switchCd = 0;
    this.shield = 0;
    this.shieldTime = 0;
    this.shieldOwner = null;
    this.shieldSplashMult = CFG.shield.splashMult;
    this.paralyzed = 0;
    this.onLadder = false;
    this.ladderLock = false;
    this.ladderExitT = 0;
    this.haste = 0;
    this.penOut = false;
    for (const c of this.characters) {
      c.hp = c.hpMax;
      c.stealth = 0;
      c.awake = 0;
      c.eCd = 0;
    }
  }

  breakStealth(reason) {
    const c = this.ch;
    if (c && c.stealth > 0) {
      c.stealth = 0;
      this.game.onStealthBreak(reason);
    }
  }

  switchTo(index) {
    if (this.switchCd > 0) return;
    if (index === this.active) return;
    if (index < 0 || index >= this.characters.length) return;
    const target = this.characters[index];
    if (!target || !target.alive) return;

    // 柳寒伊的「睡醒了」会在切换角色时提前结束
    const leaving = this.ch;
    if (leaving && leaving.awake > 0) {
      leaving.awake = 0;
      this.game.toast('睡醒了已结束');
    }

    this.breakStealth('switch');
    this.active = index;
    this.switchCd = CFG.switchCd;
    this.attack = null;
    this.blocking = false;
    this.queued = false;
    this.fireTimer = 0;
    this.game.stats.switchCount = (this.game.stats.switchCount || 0) + 1;
    this.game.toast('切换至 ' + target.def.name);
  }

  /* ---------- 更新 ---------- */

  update(dt, wdt) {
    if (this.dead) return;
    const ch = this.ch;

    if (this.crash) {
      this.anim += dt;
      this.invuln = Math.max(0, this.invuln - dt);
      this.hurtFlash = Math.max(0, this.hurtFlash - dt);
      for (const c of this.characters) {
        c.eCd = Math.max(0, c.eCd - wdt);
        c.qCd = Math.max(0, (c.qCd || 0) - wdt);
        if (c.sprout > 0) c.sprout = Math.max(0, c.sprout - wdt);
      }
      if (ch.stealth > 0) ch.stealth = Math.max(0, ch.stealth - wdt);
      if (ch.awake > 0) ch.awake = Math.max(0, ch.awake - wdt);
      this.updateCrash(dt);
      return;
    }

    this.anim += dt;
    this.invuln = Math.max(0, this.invuln - dt);
    this.hurtFlash = Math.max(0, this.hurtFlash - dt);
    this.switchCd = Math.max(0, this.switchCd - wdt);
    this.dash.cd = Math.max(0, this.dash.cd - wdt);
    this.comboIdle += dt;
    this.dash.t = Math.max(0, this.dash.t - dt);
    this.paperCd = Math.max(0, this.paperCd - dt);

    // 所有队伍角色的技能冷却都持续计时，包括后台角色
    for (const c of this.characters) {
      c.eCd = Math.max(0, c.eCd - wdt);
      c.qCd = Math.max(0, (c.qCd || 0) - wdt);
      if (c.sprout > 0) c.sprout = Math.max(0, c.sprout - wdt);
    }
    if (ch.stealth > 0) ch.stealth = Math.max(0, ch.stealth - wdt);
    if (ch.awake > 0) ch.awake = Math.max(0, ch.awake - wdt);
    if (this.shieldTime > 0) {
      this.shieldTime = Math.max(0, this.shieldTime - wdt);
      if (this.shieldTime <= 0) {
        this.shield = 0;
        this.shieldOwner = null;
        this.shieldSplashMult = CFG.shield.splashMult;
      }
    }
    this.paralyzed = Math.max(0, this.paralyzed - dt);
    this.haste = Math.max(0, this.haste - dt);
    this.ladderExitT = Math.max(0, this.ladderExitT - dt);

    this.staminaIdle += dt;
    const heavyLock = this.attack && this.attack.type === 'heavy';
    if (!heavyLock && this.staminaIdle > CFG.stamina.regenDelay) {
      this.stamina = Math.min(CFG.stamina.max, this.stamina + CFG.stamina.regen * dt);
    }

    if (this.paralyzed > 0) {
      this.vx = 0;
      this.attack = null;
      this.blocking = false;
      this.queued = false;
      this.physics(dt);
      return;
    }

    // 切换角色
    for (let i = 0; i < 4; i++) {
      if (Input.keyPressed('Digit' + (i + 1))) this.switchTo(i);
    }

    // 技能
    if (Input.keyPressed('KeyE')) this.castE();
    if (Input.keyPressed('KeyQ')) this.castQ();

    this.handleLadder(dt);
    if (this.onLadder) {
      this.attack = null;
      this.blocking = false;
      this.queued = false;
      this.physics(dt);
      return;
    }
    if (this.ladderLock) {
      this.ladderLock = false;
      this.vx = 0;
      this.vy = 0;
      return;
    }

    this.handleDash();
    this.handleBlock(dt);
    this.handleAttack(dt);
    this.handleMovement(dt);
    this.updateAttack(dt);
    this.physics(dt);
  }

  ladderAt() {
    if (!LEVEL.ladders) return null;
    for (const l of LEVEL.ladders) {
      if (Math.abs(this.x - l.x) > 32) continue;
      if (this.y < l.top - 8 || this.y > l.bottom + 10) continue;
      return l;
    }
    return null;
  }

  handleLadder(dt) {
    const l = this.ladderAt();
    if (!l) { this.onLadder = false; return; }

    if (!this.onLadder) {
      // 按左右时不要重新吸附梯子，否则在顶端按 W/S + A/D 会被卡住
      if (Input.key('KeyA') || Input.key('KeyD')) return;
      if (Input.key('KeyW') || Input.key('KeyS')) {
        this.onLadder = true;
        this.vx = 0;
        this.vy = 0;
        this.grounded = false;
        this.dash.t = 0;
      } else {
        return;
      }
    }

    this.vx = 0;
    this.vy = 0;
    // S 优先：同时按住 W 和 S 时向下
    if (Input.key('KeyS')) this.y += CFG.physics.climb * dt;
    else if (Input.key('KeyW')) this.y -= CFG.physics.climb * dt;

    // 只做每帧内的微调，避免从梯子上瞬移
    if (this.y < l.top) this.y = l.top;
    if (this.y > l.bottom) this.y = l.bottom;

    // 左右移动可主动离开梯子
    if (Input.key('KeyA') || Input.key('KeyD')) {
      if (this.y < l.top) this.y = l.top;
      if (this.y > l.bottom) this.y = l.bottom;
      this.onLadder = false;
      this.grounded = false;
      this.ladderLock = true;
      this.ladderExitT = 0.18;
      return;
    }
    // 到达顶端后松开 W（或底端松开 S）再下梯
    if (this.y <= l.top && !Input.key('KeyW')) {
      this.onLadder = false;
      this.grounded = true;
      this.ladderLock = true;
      this.ladderExitT = 0.18;
    } else if (this.y >= l.bottom && !Input.key('KeyS')) {
      this.onLadder = false;
      this.grounded = true;
      this.ladderLock = true;
      this.ladderExitT = 0.18;
    }
  }

  paralyze(seconds) {
    this.paralyzed = Math.max(this.paralyzed, seconds);
    this.attack = null;
    this.blocking = false;
    this.game.spawnText(this.x, this.y - 98, '麻痹', '#8fd7ff');
  }

  // 定身：无法进行任何行动（与麻痹同一套停止逻辑，仅表现不同）
  root(seconds) {
    this.paralyzed = Math.max(this.paralyzed, seconds);
    this.attack = null;
    this.blocking = false;
    this.queued = false;
    this.vx = 0;
    this.game.spawnText(this.x, this.y - 98, '定身 ' + seconds.toFixed(0) + 's', '#c9a6ff');
  }

  castE() {
    const ch = this.ch;
    const e = ch.def.e;
    if (e.id === 'none') { this.game.toast('该角色技能未设计'); return; }
    if (ch.eCd > 0) return;
    if (e.id === 'stealth') {
      ch.stealth = CFG.stealth.duration;
      ch.eCd = e.cd;
      this.game.stats.stealth++;
      this.game.toast('隐匿 · 10 秒');
    } else if (e.id === 'shield') {
      const lv = Math.max(1, ch.progress.e || 1);
      const ratio = CFG.shield.hpRatio + CFG.shield.hpRatioStep * (lv - 1);
      this.shield = Math.round(ch.hpMax * ratio);
      this.shieldTime = CFG.shield.duration;
      this.shieldOwner = ch;
      this.shieldSplashMult = CFG.shield.splashMult + CFG.shield.splashStep * (lv - 1);
      ch.eCd = e.cd;
      this.game.stats.shield++;
      this.game.toast('针男人 · 护盾 ' + this.shield);
    } else if (e.id === 'crash') {
      ch.eCd = e.cd;
      this.startCrash();
      this.game.stats.crash = (this.game.stats.crash || 0) + 1;
    }
  }

  startCrash() {
    let target = null;
    let best = Infinity;
    for (const e of this.game.enemies) {
      if (e.dead) continue;
      if (e.kind === 'totem' || e.kind === 'trans') continue;
      const d = Math.abs(e.x - this.x);
      if (d < best) { best = d; target = e; }
    }
    const lv = Math.max(1, this.ch.progress.e || 1);
    // 跃到最近敌人的头顶（脚下高度 = 敌人头顶上方一点）
    let top;
    if (target) {
      const eh = (target.def && target.def.h) || (target.h || 54);
      top = Math.max(50, target.y - eh - 26);
    } else {
      top = Math.max(80, this.y - 260);
    }
    this.crash = {
      phase: 'up',
      mult: 0.8 + 0.1 * (lv - 1),
      x0: this.x,
      x1: target ? target.x : this.x,
      y0: this.y,
      top,
      // 落在敌人所在的平面（平台/地面），不穿过平台落到地面
      landY: target ? target.y : this.y,
      target
    };
    this.attack = null;
    this.queued = false;
    this.blocking = false;
    this.onLadder = false;
    this.vx = 0;
    this.vy = 0;
    this.invuln = Math.max(this.invuln, 1.4);
    this.game.effects.push({ type: 'ring', x: this.x, y: this.y - 25, t: 0, life: 0.4, r0: 8, r1: 70, width: 4, color: '#c9c9d6' });
    this.game.toast('坠机！');
  }

  updateCrash(dt) {
    const c = this.crash;
    if (!c) return;
    // 目标移动时，落点跟着敌人所在平面走
    if (c.target && !c.target.dead) {
      c.x1 = c.target.x;
      c.landY = c.target.y;
      const eh = (c.target.def && c.target.def.h) || (c.target.h || 54);
      c.top = Math.min(c.top, Math.max(50, c.landY - eh - 26));
    }
    if (c.phase === 'up') {
      this.y -= 500 * dt;
      const span = Math.max(1, c.y0 - c.top);
      const k = Math.min(1, Math.max(0, (c.y0 - this.y) / span));
      this.x = c.x0 + (c.x1 - c.x0) * k;
      if (this.y <= c.top) {
        this.y = c.top;
        c.phase = 'down';
        this.game.effects.push({ type: 'ring', x: this.x, y: this.y + 10, t: 0, life: 0.3, r0: 8, r1: 60, width: 4, color: '#ffd166' });
      }
    } else {
      this.y += 600 * dt;
      if (this.y >= c.landY) {
        this.y = c.landY;
        this.grounded = true;
        this.crash = null;
        this.landCrash(c.mult);
      }
    }
  }

  landCrash(mult) {
    const g = this.game;
    const cx = this.x;
    const cy = this.y - 25;
    g.effects.push({ type: 'ring', x: cx, y: cy, t: 0, life: 0.45, r0: 12, r1: 118, width: 6, color: '#ffd166' });
    g.effects.push({ type: 'ring', x: cx, y: cy, t: 0, life: 0.3, r0: 6, r1: 70, width: 4, color: '#efe6ff' });
    g.shake = Math.max(g.shake, 8);
    SFX.play('heavy');
    for (const e of g.enemies) {
      if (e.dead) continue;
      if (!circleRect(cx, cy, 100, e.box())) continue;
      const d = calcDamage(this.ch.atk, mult, e.def.def, this.ch.def.critRate, this.ch.def.critDmg);
      e.hurt(d.dmg, Math.sign(e.x - cx) || this.dir, g);
      g.spawnDamage(e.x, e.y - 60, d.dmg, d.crit);
      g.gainUltFor(this.ch, CFG.ult.perHit);
    }
  }

  castQ() {
    const ch = this.ch;
    const q = ch.def.q;
    if (q.id === 'none') { this.game.toast('该角色技能未设计'); return; }
    if ((ch.qCd || 0) > 0) {
      this.game.toast('终结技冷却中：' + Math.ceil(ch.qCd) + ' 秒');
      return;
    }
    if (ch.ult < ch.def.ultMax) {
      this.game.toast('终结技充能不足（' + Math.floor(ch.ult) + '/' + ch.def.ultMax + '）');
      return;
    }
    if (q.id === 'awake') {
      ch.ult = 0;
      ch.qCd = q.cd || 0;
      ch.awake = q.duration;
      this.fireTimer = 0;
      this.paperCd = 0;
      this.breakStealth('skill');
      this.game.stats.ult++;
      this.game.toast('睡醒了 · 普攻变为纸球');
    } else if (q.id === 'sprout') {
      ch.ult = 0;
      ch.qCd = q.cd || 0;
      ch.sprout = CFG.sprout.duration;
      this.game.stats.ult++;
      this.game.toast('交际花 · 头顶 🌵 虚影');
    } else if (q.id === 'book') {
      ch.ult = 0;
      ch.qCd = q.cd || 0;
      this.game.projectiles.push(new BookShot(this));
      this.game.stats.ult++;
      this.game.toast('一心只读圣贤书 · 📖');
    }
  }

  handleDash() {
    const pressed = Input.keyPressed('ShiftLeft');
    if (!pressed) return;
    if (this.dash.cd > 0 || this.blocking) return;
    if (this.stamina < CFG.stamina.dash) return;
    if (!this.grounded && this.dash.airLeft <= 0) return;

    // 冲刺打断普攻/技能
    this.attack = null;
    this.queued = false;

    if (!this.grounded) this.dash.airLeft--;
    this.useStamina(CFG.stamina.dash);
    this.dash.t = CFG.dash.time;
    this.dash.cd = CFG.dash.cd;
    this.dash.dir = this.vx !== 0 ? Math.sign(this.vx) : this.dir;
    this.dir = this.dash.dir;
    this.dodgeFlagged = false;
    this.breakStealth('dash');
    this.game.stats.dash++;
  }

  handleBlock(dt) {
    const want = Input.mouse.right.down && !this.isDashing() && this.stamina > 0;

    // 格挡打断普攻/技能
    if (want && this.attack) {
      this.attack = null;
      this.queued = false;
    }

    if (want && !this.blocking) {
      this.blocking = true;
      this.blockTime = 0;
    }
    if (!want) this.blocking = false;

    if (this.blocking) {
      this.blockTime += dt;
      if (this.blockTime > CFG.block.perfectWindow) {
        this.useStamina(CFG.stamina.block * dt);
        if (this.stamina <= 0) this.blocking = false;
      }
    }
  }

  handleAttack(dt) {
    const L = Input.mouse.left;
    const ch = this.ch;

    if (ch.awake > 0) {
      this.holdConsumed = false;
      if (this.blocking) return;
      if (L.down && this.paperCd <= 0) {
        this.firePaper();
        this.paperCd = CFG.awake.fireInterval;
      }
      return;
    }

    if (!L.down) this.holdConsumed = false;
    if (this.blocking || this.isDashing()) return;

    if (this.attack) {
      if (L.pressed) this.queued = true;
    } else if (L.pressed) {
      this.startLight();
    }

    // 按住达到阈值后触发重击；每次按住只触发一次
    if (L.down && !this.holdConsumed && L.held >= CFG.attack.holdThreshold) {
      if (this.startHeavy()) this.holdConsumed = true;
    }
  }

  startLight() {
    if (this.blocking || this.isDashing()) return;
    const bonus = this.ch.stealth > 0;
    if (bonus) this.breakStealth('attack');
    if (this.comboIdle > 0.9) this.combo = 0;

    const baseW = this.weapon;
    const W = (baseW.id === 'pen' && this.penOut) ? CFG.weapons.fist : baseW;
    const list = W.lightCombo;
    const stage = list ? (this.combo % list.length) : 0;
    const A = list ? list[stage] : W.light;
    this.attack = {
      type: 'light', t: 0, hitAt: A.hitAt, time: A.time,
      mult: A.mult, range: A.range, stage: stage, weaponId: W.id, hitDone: false, bonus
    };
    this.combo = (this.combo + 1) % (list ? list.length : 3);
    this.comboIdle = 0;
    this.queued = false;
    this.game.stats.lightSwing++;
  }

  startHeavy() {
    if (this.stamina < CFG.stamina.heavy) return false;
    if (this.attack && this.attack.type === 'heavy') return false;
    this.useStamina(CFG.stamina.heavy);
    const bonus = this.ch.stealth > 0;
    if (bonus) this.breakStealth('attack');

    const baseW = this.weapon;
    if (baseW.id === 'pen' && !this.penOut) {
      this.throwPen();
      this.game.stats.heavySwing++;
      return true;
    }

    const W = (baseW.id === 'pen' && this.penOut) ? CFG.weapons.fist : baseW;
    const H = W.heavy;
    this.attack = {
      type: 'heavy', t: 0, hitAt: H.hitAt, time: H.time,
      mult: H.mult, range: H.range, weaponId: W.id, hitDone: false, bonus
    };
    this.queued = false;
    this.game.stats.heavySwing++;
    return true;
  }

  throwPen() {
    this.penOut = true;
    this.game.projectiles.push(new PenWeaponShot(this.game.player, this.ch));
    this.game.effects.push({ type: 'ring', x: this.x, y: this.y - 34, t: 0, life: 0.2, color: '#ffffff' });
    SFX.play('heavy');
  }

  firePaper() {
    const mult = this.paperMult();
    this.game.projectiles.push(new PaperBall(this, this.ch.atk * mult, mult));
    this.game.stats.lightHit++;
    this.game.trySpike(this.dir);
  }

  updateAttack(dt) {
    if (!this.attack) return;
    const a = this.attack;
    a.t += dt;

    if (!a.hitDone && a.t >= a.hitAt) {
      a.hitDone = true;
      this.resolveHit(a);
    }

    if (a.t >= a.time) {
      const wasLight = a.type === 'light';
      this.attack = null;
      if (!wasLight) this.staminaIdle = CFG.stamina.regenDelay;
      if (wasLight && this.queued) {
        this.queued = false;
        this.startLight();
      }
    }
  }

  resolveHit(a) {
    const cx = this.x + this.dir * 40;
    const cy = this.y - 25;
    const r = a.range || (a.type === 'heavy' ? 80 : 60);
    const mult = a.mult * (a.bonus ? 2 : 1);

    for (const e of this.game.enemies) {
      if (e.dead) continue;
      if (!circleRect(cx, cy, r, e.box())) continue;

      const d = calcDamage(this.ch.atk, mult, e.def.def, this.ch.def.critRate, this.ch.def.critDmg);
      e.hurt(d.dmg, this.dir, this.game);
      this.game.onPlayerHitEnemy(e);
      if (e.dead) this.game.recordWeaponKill(a.weaponId || this.weapon.id);
      this.game.spawnDamage(e.x, e.y - 60, d.dmg, d.crit);
      this.game.gainUltFor(this.ch, CFG.ult.perHit);
      this.game.hitstop = Math.max(this.game.hitstop, 0.05);
      this.game.shake = Math.max(this.game.shake, a.type === 'heavy' ? 9 : 4);
      this.game.effects.push({ type: 'slash', x: cx, y: cy, dir: this.dir, t: 0, life: 0.18 });
    }

    if (a.type === 'heavy') this.game.stats.heavyHit++;
    else this.game.stats.lightHit++;
    // 交际花：只要出手就发射尖刺
    this.game.trySpike(this.dir);
    SFX.play(a.type === 'heavy' ? 'heavy' : 'hit');
  }

  handleMovement(dt) {
    const ch = this.ch;
    const left = Input.key('KeyA');
    const right = Input.key('KeyD');
    let mx = (right ? 1 : 0) - (left ? 1 : 0);
    if (mx !== 0) this.dir = mx;

    this.crouching = Input.key('ControlLeft') && this.grounded && !this.attack && !this.blocking;
    this.w = this.crouching ? 30 : 50;
    this.h = this.crouching ? 30 : 50;

    if (this.isDashing()) return;

    let speed = CFG.physics.move;
    if (ch.stealth > 0) speed *= 1.5;
    if (ch.awake > 0) speed *= 1.5;
    if (this.crouching) speed = CFG.physics.crouch;

    const wantSprint = Input.key('ShiftLeft') && mx !== 0 && this.stamina > 0 &&
      !this.blocking && !this.crouching;
    if (wantSprint) {
      speed = CFG.physics.sprint;
      if (ch.stealth > 0) speed *= 1.5;
      if (ch.awake > 0) speed *= 1.5;
      this.useStamina(CFG.stamina.sprint * dt);
      if (!this.game.stats.sprint) this.game.stats.sprint = 1;

      this.trailTimer -= dt;
      if (this.trailTimer <= 0) {
        this.trailTimer = 0.04;
        this.game.effects.push({
          type: 'trail', x: this.x - this.dir * 12, y: this.y - 26,
          dir: this.dir, t: 0, life: 0.25
        });
      }
    } else {
      this.trailTimer = 0;
    }

    if (this.blocking) speed *= 0.55;
    if (this.haste > 0) speed *= 1.5;

    const target = mx * speed;
    const accel = this.grounded ? 4200 : 2600;
    this.vx = approach(this.vx, target, accel * dt);

    // 跳跃
    if (this.grounded) {
      this.coyote = CFG.physics.coyote;
      this.dash.airLeft = CFG.dash.air;
    } else {
      this.coyote -= dt;
    }
    if (Input.keyPressed('KeyW')) this.jumpBuffer = CFG.physics.jumpBuffer;
    else this.jumpBuffer -= dt;

    if (this.jumpBuffer > 0 && this.coyote > 0 && !this.blocking) {
      this.vy = -CFG.physics.jump;
      this.grounded = false;
      this.coyote = 0;
      this.jumpBuffer = 0;
      this.game.stats.jump++;
    }

    // 可变跳跃高度
    if (!Input.key('KeyW') && this.vy < 0) this.vy += CFG.physics.gravity * 0.9 * dt;
  }

  physics(dt) {
    if (this.onLadder) {
      this.vx = 0;
      this.vy = 0;
      return;
    }
    if (this.isDashing()) {
      this.vx = this.dash.dir * CFG.dash.speed;
      this.vy = 0;
      this.moveX(dt);
      return;
    }

    this.vy = Math.min(CFG.physics.maxFall, this.vy + CFG.physics.gravity * dt);
    this.moveX(dt);
    this.moveY(dt);
  }

  moveX(dt) {
    this.x += this.vx * dt;
    if (this.x < 26) { this.x = 26; this.vx = 0; }
    if (this.x > LEVEL.width - 26) { this.x = LEVEL.width - 26; this.vx = 0; }

    // 刚离开梯子时短暂忽略横向平台碰撞，避免被平台边缘吸附
    if (this.ladderExitT > 0) return;

    const box = this.box();
    for (const p of this.game.solids()) {
      if (!aabbBox(box, p)) continue;
      if (this.vx > 0) this.x = p.x - this.w / 2;
      else if (this.vx < 0) this.x = p.x + p.w + this.w / 2;
      this.vx = 0;
      break;
    }
  }

  moveY(dt) {
    const prevBottom = this.y;
    this.y += this.vy * dt;
    this.grounded = false;
    const box = this.box();
    for (const p of this.game.solids()) {
      if (!aabbBox(box, p)) continue;
      if (this.vy > 0) {
        // 只有从平台上方落下才落在平台上；
        // 从梯子/平台内部向下移动时不能被“吸”到平台顶部
        if (prevBottom > p.y + 10) continue;
        this.y = p.y;
        this.vy = 0;
        this.grounded = true;
      } else if (this.vy < 0) {
        const prevTop = prevBottom - this.h;
        if (prevTop < p.y + p.h - 1) continue;
        this.y = p.y + p.h + this.h;
        this.vy = 0;
      }
      break;
    }
    if (this.y > LEVEL.floorY) {
      this.y = LEVEL.floorY;
      this.vy = 0;
      this.grounded = true;
    }
  }

  /* ---------- 受伤 / 死亡 ---------- */

  takeDamage(rawAtk, srcX, attacker) {
    if (this.dead || this.invuln > 0) return;
    const ch = this.ch;

    if (this.isDashing()) {
      this.perfectDodge();
      return;
    }

    this.onLadder = false;

    let dmg = rawAtk * (100 / Math.max(1, ch.defense));

    if (this.blocking) {
      if (this.blockTime <= CFG.block.perfectWindow) {
        this.game.gainUltFor(ch, CFG.ult.perPerfectBlock);
        if (attacker && typeof attacker.onPerfectBlocked === 'function') {
          attacker.onPerfectBlocked(this.game);
        }
        this.game.stats.perfectBlock++;
        this.game.spawnText(this.x, this.y - 90, '完美格挡', '#7fe0ff');
        this.game.effects.push({ type: 'ring', x: this.x, y: this.y - 34, t: 0, life: 0.35, r0: 10, r1: 62, width: 4, color: '#7fe0ff' });
        this.game.shake = Math.max(this.game.shake, 6);
        SFX.play('perfectBlock');
        return;
      }
      dmg *= 1 - CFG.block.reduce;
      this.game.stats.blocked++;
    }

    // 角色每次受击获得 2 点终结技充能
    this.game.gainUltFor(ch, 2);

    dmg = Math.max(1, Math.round(dmg));

    // 针男人护盾吸收伤害，并在受伤时向周围溅射
    if (this.shield > 0) {
      const absorbed = Math.min(this.shield, dmg);
      this.shield -= absorbed;
      dmg -= absorbed;
      this.invuln = CFG.attack.invuln;
      this.hurtFlash = 0.12;
      this.game.spawnText(this.x, this.y - 92, '护盾 -' + absorbed, '#8ef0a0');
      this.game.shieldSplash(this.shieldOwner || ch);
      SFX.play('hit');
      if (this.shield <= 0) {
        this.shield = 0;
        this.shieldTime = 0;
        this.shieldOwner = null;
        this.shieldSplashMult = CFG.shield.splashMult;
      }
      if (dmg <= 0) return;
    }

    ch.hp = Math.max(0, ch.hp - dmg);
    this.invuln = CFG.attack.invuln;
    this.hurtFlash = 0.22;
    this.vx = Math.sign(this.x - srcX) * 300 || 300;
    this.vy = -260;
    this.grounded = false;

    this.breakStealth('hit');
    this.game.spawnDamage(this.x, this.y - 70, dmg, false, true);
    this.game.shake = Math.max(this.game.shake, 7);
    this.game.hurtFlash = 0.25;
    SFX.play('hurt');

    if (ch.hp <= 0) this.die();
  }

  die() {
    this.attack = null;
    this.blocking = false;
    this.breakStealth('death');
    this.game.onCharacterDown();
  }

  perfectDodge() {
    if (this.dodgeFlagged) return;
    this.dodgeFlagged = true;
    this.game.stats.perfectDodge++;
    this.game.triggerFocus();
    this.game.spawnText(this.x, this.y - 90, '完美闪避', '#d6b3ff');
  }
}

/* ---------------- 黑犬 ---------------- */

class Enemy {
  constructor(spot, index) {
    this.kind = 'dog';
    this.type = 'dog';
    // 复制一份配置，方便世界等级 2 对单体数值做覆盖
    this.def = Object.assign({}, CFG.enemy.dog);
    const wl = (typeof Game !== 'undefined' && Game.worldLevel) ? Game.worldLevel() : 1;
    if (wl >= 2) {
      // 世界等级 2：血量 600，攻击力提升到 150（atkMult 0.5 后正好 150），防御 120
      this.def.hp = 600;
      this.def.atk = 300;
      this.def.def = 120;
    }
    this.index = index;
    this.x = spot.x;
    this.y = spot.y || LEVEL.floorY;
    this.ledge = !!spot.y;
    this.a = spot.a;
    this.b = spot.b;
    this.dir = (this.x - this.a < this.b - this.x) ? -1 : 1;
    this.hp = Math.round(this.def.hp);
    this.maxHp = this.hp;
    this.atk = this.def.atk;
    this.toughMax = this.def.toughness || 1;
    this.tough = this.toughMax;
    this.weak = 0;
    this.markT = 0;
    this.state = 'patrol';
    this.t = 0;
    this.flash = 0;
    this.dead = false;
    this.lastSeen = this.x;
    this.hitApplied = false;
  }

  box() {
    return {
      x: this.x - this.def.w / 2,
      y: this.y - this.def.h,
      w: this.def.w,
      h: this.def.h
    };
  }

  update(wdt, game) {
    if (this.dead) return;
    const p = game.player;
    const d = this.def;
    this.flash = Math.max(0, this.flash - wdt);
    this.t += wdt;
    if (this.markT > 0) this.markT = Math.max(0, this.markT - wdt);

    // 韧性归零后的虚弱：原地不动，结束后恢复韧性
    if (this.weak > 0) {
      this.weak -= wdt;
      if (this.weak <= 0) {
        this.weak = 0;
        this.tough = this.toughMax;
        this.state = 'search';
        this.t = 0;
        game.spawnText(this.x, this.y - 80, '韧性恢复', '#ffd166');
      }
      return;
    }

    const canSee = p.canBeSeen() &&
      Math.abs(p.x - this.x) < d.detect &&
      Math.abs(p.y - this.y) < 150;

    if (canSee) this.lastSeen = p.x;

    switch (this.state) {
      case 'patrol': {
        if (canSee) { this.state = 'chase'; this.t = 0; break; }
        if (!game.moveEnemy(this, this.dir * d.patrolSpeed * wdt)) this.dir *= -1;
        if (this.x <= this.a) this.dir = 1;
        if (this.x >= this.b) this.dir = -1;
        break;
      }

      case 'chase': {
        if (!canSee) { this.state = 'search'; this.t = 0; break; }
        const dx = p.x - this.x;
        this.dir = Math.sign(dx) || this.dir;
        if (Math.abs(dx) <= d.attackRange && Math.abs(p.y - this.y) < 70) {
          this.state = 'windup';
          this.t = 0;
          this.hitApplied = false;
        } else {
          game.moveEnemy(this, this.dir * d.speed * wdt);
        }
        break;
      }

      case 'search': {
        if (canSee) { this.state = 'chase'; this.t = 0; break; }
        if (this.t >= d.loseAggro) { this.state = 'patrol'; this.t = 0; break; }
        const delta = this.lastSeen - this.x;
        if (Math.abs(delta) > 24) {
          this.dir = Math.sign(delta);
          game.moveEnemy(this, this.dir * d.patrolSpeed * 0.7 * wdt);
        }
        break;
      }

      case 'windup': {
        if (p.ch.stealth > 0) {
          this.state = 'search';
          this.t = 0;
          this.lastSeen = p.x;
          break;
        }
        if (this.t >= d.windup) {
          this.state = 'recover';
          this.t = 0;
          this.strike(game);
        }
        break;
      }

      case 'recover': {
        if (this.t >= d.recover) {
          this.state = canSee ? 'chase' : 'search';
          this.t = 0;
        }
        break;
      }
    }
  }

  strike(game) {
    const p = game.player;
    const d = this.def;
    if (Math.abs(p.x - this.x) > d.attackRange + 12) return;
    if (Math.abs(p.y - this.y) > 80) return;
    if (p.ch.stealth > 0) return;
    p.takeDamage((this.atk || d.atk) * d.atkMult, this.x, this);
    const px = this.x + this.dir * 46;
    const py = this.y - 26;
    game.effects.push({ type: 'bite', x: px, y: py, t: 0, life: 0.18, dir: this.dir });
  }

  enterWeak(game) {
    this.tough = 0;
    this.weak = this.def.weakTime || 3;
    this.state = 'weak';
    this.t = 0;
    game.spawnText(this.x, this.y - 80, '虚弱', '#7fe0ff');
    game.effects.push({ type: 'ring', x: this.x, y: this.y - 32, t: 0, life: 0.4, r0: 8, r1: 58, width: 4, color: '#7fe0ff' });
  }

  onPerfectBlocked(game) {
    if (this.dead || this.weak > 0) return;
    this.tough -= CFG.enemy.perfectBlockTough;
    if (this.tough <= 0) this.enterWeak(game);
  }

  hurt(dmg, dir, game) {
    if (this.dead) return;
    this.hp -= dmg;
    game.onPlayerHitEnemy(this);
    this.flash = 0.14;
    this.x += dir * 6;
    if (this.ledge) this.x = Math.max(this.a, Math.min(this.b, this.x));
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      game.onEnemyKilled(this);
      return;
    }
    if (this.weak <= 0) {
      this.tough -= CFG.enemy.toughPerHit;
      if (this.tough <= 0) this.enterWeak(game);
    }
  }
}

class Pig {

    this.maxHp = this.hp;
    this.atk = this.def.atk;
    this.toughMax = this.def.toughness || 1;
    this.tough = this.toughMax;
    this.weak = 0;
    this.markT = 0;
    this.state = 'patrol';
    this.t = 0;
    this.flash = 0;
    this.dead = false;
    this.lastSeen = this.x;
    this.shotTimer = 0;
    this.weldTimer = 3.5;
    this.reactTimer = 0;
  }

  box() {
    return {
      x: this.x - this.def.w / 2,
      y: this.y - this.def.h,
      w: this.def.w,
      h: this.def.h
    };
  }

  update(wdt, game) {
    if (this.dead) return;
    const p = game.player;
    const d = this.def;
    this.flash = Math.max(0, this.flash - wdt);
    this.t += wdt;
    if (this.markT > 0) this.markT = Math.max(0, this.markT - wdt);

    if (this.weak > 0) {
      this.weak -= wdt;
      if (this.weak <= 0) {
        this.weak = 0;
        this.tough = this.toughMax;
        this.state = 'search';
        this.t = 0;
        game.spawnText(this.x, this.y - 92, '韧性恢复', '#ffd166');
      }
      return;
    }

    const dx = p.x - this.x;
    const adx = Math.abs(dx);
    const canSee = p.canBeSeen() && adx < d.detect && Math.abs(p.y - this.y) < 280;
    if (canSee) this.lastSeen = p.x;

    if (canSee) {
      if (this.state !== 'chase') {
        this.state = 'chase';
        this.t = 0;
        this.reactTimer = d.reaction || 0.9;
      }
      this.dir = Math.sign(dx) || this.dir;
    } else if (this.state === 'chase') {
      // 开启隐匿或脱离视野后立刻丢失锁定，进入搜索，不再攻击
      this.state = 'search';
      this.t = 0;
      this.reactTimer = d.reaction || 0.9;
    }
    this.reactTimer = Math.max(0, this.reactTimer - wdt);

    if (this.state === 'chase') {
      if (adx > 400) game.moveEnemy(this, Math.sign(dx) * d.speed * wdt);
      else if (adx < 240) game.moveEnemy(this, -Math.sign(dx) * d.speed * 0.55 * wdt);

      if (this.reactTimer <= 0) {
        this.shotTimer -= wdt;
        if (this.shotTimer <= 0 && adx < d.attackRange) {
          this.shotTimer = d.shotCd;
          game.projectiles.push(new PenShot(this, this.dir));
        }

        this.weldTimer -= wdt;
        if (this.weldTimer <= 0) {
          this.weldTimer = d.weldCd;
          game.hazards.push(new WeldZone(game, this, p.x, p.y));
          game.spawnText(this.x, this.y - 92, '电焊！', '#7fd0ff');
        }
      }
    } else if (this.state === 'search') {
      if (canSee) {
        this.state = 'chase';
        this.t = 0;
        this.reactTimer = d.reaction || 0.9;
      } else if (this.t >= (d.loseAggro || 3)) {
        this.state = 'patrol';
        this.t = 0;
      } else {
        const delta = this.lastSeen - this.x;
        if (Math.abs(delta) > 24) {
          this.dir = Math.sign(delta);
          game.moveEnemy(this, this.dir * d.patrolSpeed * 0.6 * wdt);
        }
      }
    } else {
      if (!game.moveEnemy(this, this.dir * d.patrolSpeed * wdt)) this.dir *= -1;
      if (this.x <= this.a) this.dir = 1;
      if (this.x >= this.b) this.dir = -1;
    }

    if (this.ledge) this.x = Math.max(this.a, Math.min(this.b, this.x));
    this.x = Math.max(30, Math.min(LEVEL.width - 30, this.x));
    this.y = this.baseY;
  }

  hurt(dmg, dir, game) {
    if (this.dead) return;
    this.hp -= dmg;
    game.onPlayerHitEnemy(this);
    this.flash = 0.14;
    this.x += dir * 4;
    if (this.ledge) this.x = Math.max(this.a, Math.min(this.b, this.x));
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      game.onEnemyKilled(this);
      return;
    }
    if (this.weak <= 0) {
      this.tough -= CFG.enemy.toughPerHit;
      if (this.tough <= 0) this.enterWeak(game);
    }
  }

  enterWeak(game) {
    this.tough = 0;
    this.weak = this.def.weakTime || 3;
    this.state = 'weak';
    this.t = 0;
    game.spawnText(this.x, this.y - 92, '虚弱', '#7fe0ff');
    game.effects.push({ type: 'ring', x: this.x, y: this.y - 40, t: 0, life: 0.4, r0: 8, r1: 66, width: 4, color: '#7fe0ff' });
  }

  onPerfectBlocked(game) {
    if (this.dead || this.weak > 0) return;
    this.tough -= CFG.enemy.perfectBlockTough;
    if (this.tough <= 0) this.enterWeak(game);
  }
}

class PenWeaponShot {

    this.life = 1.5;
    this.returning = false;
    this.dead = false;
    this.r = 10;
  }

  update(wdt, game) {
    if (this.dead) return;
    if (!this.returning) {
      this.x += this.vx * wdt;
      this.life -= wdt;
      if (this.life <= 0 || this.x < 0 || this.x > LEVEL.width ||
          game.projectileBlocked(this.x, this.y, this.r)) {
        this.returning = true;
      } else {
        for (const e of game.enemies) {
          if (e.dead) continue;
          if (!circleRect(this.x, this.y, this.r + 6, e.box())) continue;
          const d = calcDamage(this.owner.atk, 0.8, e.def.def, this.owner.def.critRate, this.owner.def.critDmg);
          e.hurt(d.dmg, this.dir, game);
          game.onPlayerHitEnemy(e);
          if (e.dead) game.recordWeaponKill('pen');
          game.spawnDamage(e.x, e.y - 60, d.dmg, d.crit);
          game.gainUltFor(this.owner, CFG.ult.perHit);
          this.returning = true;
          break;

      const p = game.player;
      const tx = p.x;
      const ty = p.y - 34;
      const dx = tx - this.x;
      const dy = ty - this.y;
      const d = Math.hypot(dx, dy);
      if (d < 28) {
        this.dead = true;
        game.player.penOut = false;
        return;
      }
      const sp = 900;
      this.x += (dx / (d || 1)) * sp * wdt;
      this.y += (dy / (d || 1)) * sp * wdt;
    }
  }
}
