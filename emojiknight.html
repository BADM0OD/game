  },

  drawHazards(cam) {
    const ctx = this.ctx;
    for (const h of this.hazards) {
      const x = h.x - cam;
      const cy = h.y - 25;
      const p = Math.min(1, h.t / h.delay);
      const r = Math.max(4, h.radius * p);
      ctx.save();
      ctx.fillStyle = `rgba(60, 160, 255, ${0.10 + p * 0.14})`;
      ctx.beginPath();
      ctx.arc(x, cy, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = `rgba(120, 210, 255, ${0.55 + p * 0.35})`;
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.strokeStyle = 'rgba(120, 210, 255, .25)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, cy, h.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.font = (16 + p * 18) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('⚡️', x, cy);
      ctx.restore();
    }
  },

  /* ---------------- 剧情演出（鎏知寞） ---------------- */

  drawScene(cam) {
    const sc = this.scene;
    if (!sc) return;
    const ctx = this.ctx;
    const emojiFont = '"Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';

    // 💧 被丢在地上
    const te = sc.tear;
    const tx = te.x - cam;
    ctx.save();
    ctx.fillStyle = 'rgba(20, 12, 8, .25)';
    ctx.beginPath();
    ctx.ellipse(tx, LEVEL.floorY - 3, 14, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.font = '30px ' + emojiFont;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(12,16,24,.9)';
    ctx.lineWidth = 3;
    ctx.strokeText('💧', tx, te.y - 16);
    ctx.fillText('💧', tx, te.y - 16);
    ctx.restore();

    // 🐱 鎏知寞
    const a = sc.actor;
    const ax = a.x - cam;
    const bob = sc.phase === 'walk' ? Math.abs(Math.sin(a.walk * 9)) * 4 : 0;
    const cy = a.y - 25 - bob;
    ctx.save();
    ctx.fillStyle = 'rgba(20, 12, 8, .3)';
    ctx.beginPath();
    ctx.ellipse(ax, a.y - 3, 22, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#4a4a52';
    ctx.beginPath();
    ctx.arc(ax, cy, 25, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#2b2b30';
    ctx.lineWidth = 3;
    ctx.stroke();
    ctx.font = '27px ' + emojiFont;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐱', ax, cy + 1);
    ctx.restore();

    // 头顶对话框
    if (sc.phase === 'talk') {
      const line = sc.lines[sc.line];
      if (line) {
        const isPlayer = line.who === 'player';
        const cx = isPlayer ? this.player.x - cam : ax;
        const top = isPlayer ? this.player.y - 66 : cy - 34;
        this.drawBubble(line.text, cx, top, isPlayer ? '#9fd7ff' : '#ffd9a8');
      }
      ctx.save();
      ctx.fillStyle = 'rgba(210, 228, 250, .65)';
      ctx.font = '13px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('左键继续', CFG.view.w / 2, 690);
      ctx.restore();
    }
  },

  drawBubble(text, cx, bottomY, color) {
    const ctx = this.ctx;
    ctx.save();
    ctx.font = 'bold 17px "Microsoft YaHei", sans-serif';
    const maxW = 540;
    const rows = [];
    let cur = '';
    for (const ch of String(text)) {
      if (cur && ctx.measureText(cur + ch).width > maxW) {
        rows.push(cur);
        cur = ch;
      } else {
        cur += ch;
      }
    }
    if (cur) rows.push(cur);

    let bw = 0;
    for (const r of rows) bw = Math.max(bw, ctx.measureText(r).width);
    const w = Math.min(CFG.view.w - 80, bw + 34);
    const h = rows.length * 24 + 22;
    let x = cx - w / 2;
    x = Math.max(24, Math.min(CFG.view.w - w - 24, x));
    const y = bottomY - h;

    ctx.fillStyle = 'rgba(12, 16, 24, .92)';
    ctx.strokeStyle = color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, 12);
    ctx.fill();
    ctx.stroke();

    // 小尾巴
    ctx.fillStyle = 'rgba(12, 16, 24, .92)';
    ctx.beginPath();
    ctx.moveTo(cx - 8, y + h);
    ctx.lineTo(cx + 8, y + h);
    ctx.lineTo(cx, y + h + 12);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#f2f8ff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    rows.forEach((r, i) => ctx.fillText(r, x + w / 2, y + 20 + i * 24));
    ctx.restore();
  },

  drawDialogue(cam) {
    const d = this.dialogue;
    if (!d) return;
    const line = d.lines[d.index];
    if (!line) return;

    const ctx = this.ctx;
    const npc = d.npc || { x: this.player.x, y: this.player.y };
    const sx = line.who === 'player' ? this.player.x - cam : npc.x - cam;
    const sy = line.who === 'player' ? this.player.y - 96 : npc.y - 100;

    ctx.save();
    ctx.font = '16px "Microsoft YaHei", sans-serif';
    const tw = ctx.measureText(line.text).width;
    const bw = Math.max(120, tw + 34);
    const bh = 36;
    let bx = sx - bw / 2;
    bx = Math.max(12, Math.min(CFG.view.w - bw - 12, bx));
    const by = Math.max(16, sy - bh);

    ctx.fillStyle = 'rgba(250, 252, 255, .96)';
    ctx.strokeStyle = 'rgba(140, 190, 255, .8)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(bx, by, bw, bh, 10);
    ctx.fill();
    ctx.stroke();

    const tailX = Math.max(bx + 14, Math.min(bx + bw - 14, sx));
    ctx.beginPath();
    ctx.moveTo(tailX - 7, by + bh);
    ctx.lineTo(tailX + 7, by + bh);
    ctx.lineTo(tailX, by + bh + 9);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#1c2433';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(line.text, bx + bw / 2, by + bh / 2 + 1);

    // 左键推进指引
    const hint = '🖱 点击鼠标左键继续';
    ctx.font = 'bold 13px "Microsoft YaHei", sans-serif';
    const hw = ctx.measureText(hint).width + 30;
    const hx = (CFG.view.w - hw) / 2;
    const hy = CFG.view.h - 62;
    const pulse = 0.6 + Math.sin(performance.now() / 260) * 0.25;
    ctx.fillStyle = 'rgba(8, 12, 20, .82)';
    ctx.strokeStyle = `rgba(255, 209, 102, ${pulse})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.roundRect(hx, hy, hw, 32, 16);
    ctx.fill();
    ctx.stroke();
    ctx.fillStyle = '#ffe6ac';
    ctx.fillText(hint, CFG.view.w / 2, hy + 17);
    ctx.restore();
  },

  drawEnemy(e, cam) {
    const ctx = this.ctx;
    const sx = e.x - cam;
    if (sx < -120 || sx > 1400) return;

    if (e.kind === 'boss') {
      const cy = e.y - 44;

      if (e.type === 'timedemon') {
        ctx.fillStyle = 'rgba(20, 12, 8, .28)';
        ctx.beginPath();
        ctx.ellipse(sx, LEVEL.floorY - 4, 42, 11, 0, 0, Math.PI * 2);
        ctx.fill();
        if (e.weak > 0) {
          ctx.strokeStyle = 'rgba(120, 220, 255, .8)';
          ctx.lineWidth = 2;
          for (let i = 0; i < 3; i++) {
            const a = performance.now() / 150 + i * 2.1;
            ctx.beginPath();
            ctx.arc(sx, cy, 48 + i * 6, a, a + 0.8);
            ctx.stroke();
          }
        }
        if (e.state === 'dashwind') {
          ctx.save();
          ctx.globalAlpha = 0.6;
          ctx.fillStyle = '#ff6b76';
          ctx.beginPath();
          ctx.moveTo(sx, cy + 10);
          ctx.lineTo(sx + e.dir * 150, cy - 14);
          ctx.lineTo(sx + e.dir * 150, cy + 34);
          ctx.closePath();
          ctx.fill();
          ctx.restore();
        }
        ctx.save();
        ctx.translate(sx, cy);
        if (e.dir < 0) ctx.scale(-1, 1);
        ctx.globalAlpha = e.flash > 0 ? 0.75 : 1;
        ctx.font = this.bodyEmojiSize(42) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(12, 16, 24, .9)';
        ctx.lineWidth = 3;
        if (e.phase2) {
          ctx.shadowColor = 'rgba(255, 120, 90, .85)';
          ctx.shadowBlur = 22;
        }
        ctx.strokeText('⏰', 0, 6);
        ctx.fillText('⏰', 0, 6);
        ctx.restore();

        if (e.state === 'melee') {
          const p = 1 - Math.max(0, e.meleeT) / 0.65;
          const drop = p < 0.65 ? 0 : (p - 0.65) / 0.35;
          const gx = sx + e.dir * (20 + drop * 46);
          const gy = cy - 72 + drop * 100;
          ctx.save();
          ctx.font = '40px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.lineJoin = 'round';
          ctx.strokeStyle = 'rgba(12, 16, 24, .95)';
          ctx.lineWidth = 3;
          ctx.strokeText('⏳', gx, gy);
          ctx.fillText('⏳', gx, gy);
          ctx.restore();
        }
        if (e.markT > 0) {
          ctx.save();
          ctx.globalAlpha = e.markT < 2 ? (0.4 + 0.6 * Math.abs(Math.sin(performance.now() / 200))) : 0.95;
          ctx.font = '18px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText('📖', sx, cy - 66);
          ctx.restore();
        }
        return;
      }

      ctx.fillStyle = 'rgba(20, 12, 8, .28)';
      ctx.beginPath();
      ctx.ellipse(sx, LEVEL.floorY - 4, 42, 11, 0, 0, Math.PI * 2);
      ctx.fill();
      if (e.weak > 0) {
        ctx.strokeStyle = 'rgba(120, 220, 255, .8)';
        ctx.lineWidth = 2;
        for (let i = 0; i < 3; i++) {
          const a = performance.now() / 150 + i * 2.1;
          ctx.beginPath();
          ctx.arc(sx, cy, 48 + i * 6, a, a + 0.8);
          ctx.stroke();
        }
      }
      ctx.save();
      ctx.translate(sx, cy);
      if (e.dir < 0) ctx.scale(-1, 1);
      ctx.fillStyle = e.flash > 0 ? '#ffc2c8' : '#e8e4dc';
      ctx.beginPath();
      ctx.arc(0, 0, 42, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = e.flying ? '#8fd7ff' : '#9b968d';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.font = this.bodyEmojiSize(42) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🙄', 0, 6);
      ctx.restore();

      if (e.state === 'melee') {
        const prog = 1 - Math.max(0, e.meleeT) / 0.5;
        const hx = sx + e.dir * (34 + prog * 38);
        const hy = cy + 6;
        ctx.save();
        ctx.translate(hx, hy);
        if (e.dir < 0) ctx.scale(-1, 1);
        ctx.font = '38px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.strokeStyle = 'rgba(12, 16, 24, .95)';
        ctx.lineWidth = 3;
        ctx.strokeText('🤏', 0, 0);
        ctx.fillText('🤏', 0, 0);
        ctx.restore();
      }
      if (e.markT > 0) {
        ctx.save();
        ctx.globalAlpha = e.markT < 2 ? (0.4 + 0.6 * Math.abs(Math.sin(performance.now() / 200))) : 0.95;
        ctx.fillStyle = 'rgba(240, 240, 255, .18)';
        ctx.beginPath();
        ctx.arc(sx, cy - 66, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = '18px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('📖', sx, cy - 66);
        ctx.restore();
      }
      return;
    }

    if (e.kind === 'hourglass' || e.kind === 'rewind') {
      const cy = e.y - 22;
      ctx.fillStyle = 'rgba(20, 12, 8, .25)';
      ctx.beginPath();
      ctx.ellipse(sx, LEVEL.floorY - 3, 16, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      if (e.flying) {
        const glow = ctx.createRadialGradient(sx, cy, 2, sx, cy, 26);
        glow.addColorStop(0, e.kind === 'rewind' ? 'rgba(200, 160, 255, .8)' : 'rgba(255, 120, 110, .8)');
        glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(sx, cy, 26, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.save();
      ctx.font = '36px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(12, 16, 24, .95)';
      ctx.lineWidth = 3;
      const sym = e.kind === 'rewind' ? '⏪' : '⌛';
      ctx.globalAlpha = e.flash > 0 ? 0.7 : 1;
      ctx.strokeText(sym, sx, cy);
      ctx.fillText(sym, sx, cy);
      ctx.restore();
      if (!e.flying) {
        ctx.fillStyle = '#ff5d6c';
        ctx.font = 'bold 12px "Microsoft YaHei", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(Math.ceil(e.life) + 's', sx, cy - 30);
        ctx.fillStyle = 'rgba(0,0,0,.5)';
        ctx.fillRect(sx - 18, cy - 22, 36, 4);
        ctx.fillStyle = e.kind === 'rewind' ? '#c79cff' : '#ff9f6e';
        ctx.fillRect(sx - 18, cy - 22, 36 * (Math.max(0, e.hp) / e.maxHp), 4);
      }
      return;
    }

    if (e.kind === 'totem') {
      const cy = e.y - 20;
      ctx.fillStyle = 'rgba(20, 12, 8, .25)';
      ctx.beginPath();
      ctx.ellipse(sx, LEVEL.floorY - 3, 16, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '30px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(12, 16, 24, .9)';
      ctx.lineWidth = 2.5;
      ctx.strokeText(e.emoji, sx, cy);
      ctx.fillText(e.emoji, sx, cy);
      if (e.landed) {
        ctx.fillStyle = 'rgba(0,0,0,.5)';
        ctx.fillRect(sx - 20, cy - 30, 40, 5);
        ctx.fillStyle = '#ff6b76';
        ctx.fillRect(sx - 20, cy - 30, 40 * (e.hp / e.maxHp), 5);
      }
      return;
    }

    if (e.kind === 'trans') {
      const r = Math.max(5, e.r);
      ctx.save();
      ctx.font = (r * 2.4) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.strokeStyle = 'rgba(12, 16, 24, .9)';
      ctx.lineWidth = 2.5;
      ctx.strokeText('⚧️', sx, e.y);
      ctx.fillText('⚧️', sx, e.y);
      ctx.restore();
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(sx - 20, e.y - r - 18, 40, 4);
      ctx.fillStyle = '#c79cff';
      ctx.fillRect(sx - 20, e.y - r - 18, 40 * (Math.max(0, e.hp) / e.maxHp), 4);
      return;
    }

    if (sx < -80 || sx > 1360) return;

    if (e.kind === 'pig') {
      const cy = e.y - 34;
      ctx.fillStyle = 'rgba(20, 12, 8, .3)';
      ctx.beginPath();
      ctx.ellipse(sx, e.y - 3, 32, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      ctx.translate(sx, cy);
      if (e.dir < 0) ctx.scale(-1, 1);
      ctx.fillStyle = e.flash > 0 ? '#ffc2c8' : '#f6c9d2';
      ctx.beginPath();
      ctx.arc(0, 0, 33, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = e.state === 'chase' ? '#e88fa3' : '#c99aa6';
      ctx.lineWidth = 3;
      ctx.stroke();
      ctx.font = this.bodyEmojiSize(33) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🐷', 0, 2);
      ctx.restore();

      const w = 84;
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(sx - w / 2, cy - 56, w, 6);
      ctx.fillStyle = '#ff6b76';
      ctx.fillRect(sx - w / 2, cy - 56, w * (e.hp / e.maxHp), 6);
      ctx.fillStyle = 'rgba(0,0,0,.5)';
      ctx.fillRect(sx - w / 2, cy - 48, w, 5);
      ctx.fillStyle = e.weak > 0 ? '#ffd166' : '#8fd7ff';
      ctx.fillRect(sx - w / 2, cy - 48, w * (Math.max(0, e.tough) / e.toughMax), 5);
      ctx.fillStyle = '#ffd166';
      ctx.font = 'bold 11px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('精英 · 王明猪', sx, cy - 63);
      if (e.markT > 0) {
        ctx.save();
        ctx.globalAlpha = e.markT < 2 ? (0.4 + 0.6 * Math.abs(Math.sin(performance.now() / 200))) : 0.95;
        ctx.fillStyle = 'rgba(240, 240, 255, .18)';
        ctx.beginPath();
        ctx.arc(sx, cy - 88, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.font = '18px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('📖', sx, cy - 88);
        ctx.restore();
      }
      if (e.weak > 0) {
        ctx.fillStyle = '#7fe0ff';
        ctx.fillText('虚弱 ' + e.weak.toFixed(1) + 's', sx, cy - 75);
      } else if (e.state === 'chase') {
        ctx.fillStyle = '#ff9f6e';
        ctx.font = 'bold 18px "Microsoft YaHei", sans-serif';
        ctx.fillText('!', sx, cy - 70);
      }
      return;
    }

    const cy = e.y - 32;

    // 影子
    ctx.fillStyle = 'rgba(20, 12, 8, .28)';
    ctx.beginPath();
    ctx.ellipse(sx, e.y - 3, 24, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // 普攻动作：举起 🐾 向下拍
    let pawX = 0, pawY = 0, showPaw = false;
    if (e.state === 'windup') {
      const p = Math.min(1, e.t / e.def.windup);
      const lift = p < 0.55 ? p / 0.55 : 1 - (p - 0.55) / 0.45;
      const drop = p < 0.55 ? 0 : (p - 0.55) / 0.45;
      pawX = sx + e.dir * (14 + drop * 30);
      pawY = cy + 6 - 62 * lift;
      showPaw = true;
    } else if (e.state === 'recover' && e.t < 0.2) {
      pawX = sx + e.dir * 44;
      pawY = cy + 12;
      showPaw = true;
    }

    // 身体
    ctx.save();
    ctx.translate(sx, cy);
    // 🐕 的 emoji 本身朝左，向右移动时才需要镜像
    if (e.dir > 0) ctx.scale(-1, 1);

    ctx.fillStyle = e.flash > 0 ? '#8a3a48' : '#3b2d3a';
    ctx.beginPath();
    ctx.arc(0, 0, 25, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = e.state === 'chase' || e.state === 'windup' ? '#d9717f' : '#6d5265';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    ctx.font = this.bodyEmojiSize(25) + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🐕', 0, 2);
    ctx.restore();

    // 🐾 只在普攻时显示
    if (showPaw) {
      ctx.save();
      ctx.font = '40px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(12, 16, 24, .9)';
      ctx.lineWidth = 3;
      ctx.strokeText('🐾', pawX, pawY);
      ctx.fillText('🐾', pawX, pawY);
      ctx.restore();
    }

    // 血条 + 韧性条
    const bw = 46;
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(sx - bw / 2, cy - 44, bw, 5);
    ctx.fillStyle = '#ff6b76';
    ctx.fillRect(sx - bw / 2, cy - 44, bw * (e.hp / e.maxHp), 5);
    ctx.fillStyle = 'rgba(0,0,0,.5)';
    ctx.fillRect(sx - bw / 2, cy - 37, bw, 4);
    ctx.fillStyle = e.weak > 0 ? '#ffd166' : '#8fd7ff';
    ctx.fillRect(sx - bw / 2, cy - 37, bw * (Math.max(0, e.tough) / e.toughMax), 4);

    // 📖 印记
    if (e.markT > 0) {
      ctx.save();
      ctx.globalAlpha = e.markT < 2 ? (0.4 + 0.6 * Math.abs(Math.sin(performance.now() / 200))) : 0.95;
      ctx.fillStyle = 'rgba(240, 240, 255, .18)';
      ctx.beginPath();
      ctx.arc(sx, cy - 60, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.font = '18px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('📖', sx, cy - 60);
      ctx.restore();
    }

    // 状态标记
    if (e.weak > 0) {
      ctx.fillStyle = '#7fe0ff';
      ctx.font = 'bold 11px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('虚弱 ' + e.weak.toFixed(1) + 's', sx, cy - 50);
    } else if (e.state === 'chase' || e.state === 'windup') {
      ctx.fillStyle = '#ff9f6e';
      ctx.font = 'bold 18px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('!', sx, cy - 50);
    }
  },

  // 圆形身体内的 emoji 字号：约填满 88% 直径，非圆形 emoji 用 scale 微调
  bodyEmojiSize(r, scale) {
    const s = (scale == null) ? 1 : scale;
    return Math.max(10, Math.round(r * 2 * 0.88 * s));
  },

  drawPlayer(cam) {
    const p = this.player;
    if (!p || !p.ch) return;
    const ctx = this.ctx;
    const sx = p.x - cam;
    const cy = p.y - 25;
    const ch = p.ch;
    const stealthed = ch.stealth > 0;

    // 影子
    ctx.fillStyle = 'rgba(20, 12, 8, .3)';
    ctx.beginPath();
    ctx.ellipse(sx, p.y - 3, 20, 6, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.save();
    if (stealthed) ctx.globalAlpha = 0.38;

    // 睡醒光环
    if (ch.awake > 0) {
      const t = performance.now() / 200;
      const glow = ctx.createRadialGradient(sx, cy, 16, sx, cy, 66);
      glow.addColorStop(0, 'rgba(255, 209, 102, .30)');
      glow.addColorStop(1, 'rgba(255, 209, 102, 0)');
      ctx.fillStyle = glow;
      ctx.fillRect(sx - 72, cy - 72, 144, 144);

      ctx.strokeStyle = 'rgba(255, 220, 130, .8)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(sx, cy, 34 + Math.sin(t) * 3, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 冲刺拖影
    if (p.isDashing()) {
      ctx.fillStyle = 'rgba(180, 220, 255, .25)';
      for (let i = 1; i <= 3; i++) {
        ctx.beginPath();
        ctx.arc(sx - p.dash.dir * i * 18, cy, 21 - i * 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 身体（圆形角色）
    ctx.fillStyle = ch.def.bg;
    ctx.beginPath();
    ctx.arc(sx, cy, 25, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = ch.def.edge;
    ctx.lineWidth = 3;
    ctx.stroke();

    // 受击闪红
    if (p.hurtFlash > 0) {
      ctx.fillStyle = `rgba(255, 70, 90, ${p.hurtFlash * 2.4})`;
      ctx.beginPath();
      ctx.arc(sx, cy, 25, 0, Math.PI * 2);
      ctx.fill();
    }

    // emoji
    ctx.font = '27px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(ch.def.emoji, sx, cy + 1);

    if (stealthed) {
      ctx.strokeStyle = 'rgba(160, 215, 255, .8)';
      ctx.setLineDash([5, 5]);
      ctx.beginPath();
      ctx.arc(sx, cy, 31, 0, Math.PI * 2);
      ctx.stroke();
      ctx.setLineDash([]);
    }

    ctx.restore();

    // 武器（悬浮在角色旁边）
    this.drawWeapon(p, sx, cy);

    // 针男人护盾（跟随当前场上角色）
    if (p.shield > 0) {
      const t = performance.now() / 300;
      ctx.strokeStyle = 'rgba(120, 235, 170, .9)';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(sx, cy, 36 + Math.sin(t) * 2, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(120, 235, 170, .10)';
      ctx.beginPath();
      ctx.arc(sx, cy, 36, 0, Math.PI * 2);
      ctx.fill();
    }

    // 麻痹
    if (p.paralyzed > 0) {
      ctx.save();
      ctx.strokeStyle = 'rgba(140, 220, 255, .9)';
      ctx.lineWidth = 2;
      for (let i = 0; i < 3; i++) {
        const a = performance.now() / 140 + i * 2.1;
        ctx.beginPath();
        ctx.arc(sx, cy, 28 + i * 5, a, a + 0.9);
        ctx.stroke();
      }
      ctx.restore();
    }

    // 交际花：头顶小 🌵 虚影
    const sprout = this.sproutOwner();
    if (sprout) {
      const bob = Math.sin(performance.now() / 320) * 3;
      ctx.save();
      ctx.globalAlpha = 0.72;
      ctx.fillStyle = 'rgba(150, 220, 140, .35)';
      ctx.beginPath();
      ctx.arc(sx, cy - 48 + bob, 10, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = 'rgba(160, 230, 150, .8)';
      ctx.lineWidth = 2;
      ctx.stroke();
      ctx.font = '12px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('🌵', sx, cy - 47 + bob);
      ctx.restore();
    }

    // 格挡盾
    if (p.blocking) {
      const fresh = p.blockTime <= CFG.block.perfectWindow;
      ctx.strokeStyle = fresh ? 'rgba(127, 224, 255, .95)' : 'rgba(160, 190, 230, .55)';
      ctx.lineWidth = fresh ? 5 : 3;
      ctx.beginPath();
      ctx.arc(sx, cy, 40, p.dir > 0 ? -1.1 : Math.PI - 1.1, p.dir > 0 ? 1.1 : Math.PI + 1.1);
      ctx.stroke();
    }
  },

  drawWeapon(p, sx, cy) {
    // 睡醒期间不显示武器；港督的笔飞出时显示空手 👊
    if (p.ch.awake > 0) return;
    const W = (p.penOut && p.weapon.id === 'pen') ? CFG.weapons.fist : p.weapon;
    const ctx = this.ctx;
    let fx = sx + p.dir * W.offset;
    let fy = cy + 4 + Math.sin(p.anim * 5) * 2;
    let angle = p.dir * 0.1;

    if (p.attack) {
      const a = p.attack;
      const prog = Math.min(1, a.t / a.time);
      if (a.type === 'light') {
        if (W.id === 'ruler') {
          const stage = a.stage || 0;
          if (stage < 3) {
            // 前三段：向前戳
            fx = sx + p.dir * (W.offset + Math.sin(prog * Math.PI) * 34);
            fy = cy + 2;
            angle = p.dir * (0.2 - prog * 0.45);
          } else if (a.t < a.hitAt) {
            // 后两段：抬起
            const k = a.t / a.hitAt;
            fx = sx + p.dir * (26 + k * 6);
            fy = cy - 26 - k * 38;
            angle = p.dir * -1.1;
          } else {
            // 后两段：向下砸
            const k = Math.min(1, (a.t - a.hitAt) / (a.time - a.hitAt));
            fx = sx + p.dir * (40 + k * 22);
            fy = cy - 20 + k * 32;
            angle = p.dir * 1.3;
          }
        } else {
          fx += p.dir * Math.sin(prog * Math.PI) * 26;
          fy -= Math.sin(prog * Math.PI) * 4;
          angle = p.dir * (0.4 - prog * 0.8);
        }
      } else {
        if (a.t < a.hitAt) {
          const k = a.t / a.hitAt;
          fx = sx + p.dir * (24 + k * 10);
          fy = cy - 30 - k * 42;
          angle = p.dir * -1.2;
        } else {
          const k = Math.min(1, (a.t - a.hitAt) / (a.time - a.hitAt));
          fx = sx + p.dir * (40 + k * 24);
          fy = cy - 4 + k * 20;
          angle = p.dir * 1.25;
        }
      }
    }

    if (p.blocking) {
      fx = sx + p.dir * 26;
      fy = cy + 4;
      angle = p.dir * 0.9;
    }

    // ✒️ 的笔尖朝向固定在左上：角色在右侧时翻转，保证笔尖始终朝外
    if (W.id === 'pen' && p.dir > 0) angle += Math.PI;

    ctx.save();
    ctx.translate(fx, fy);
    ctx.rotate(angle);
    ctx.font = W.size + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    // 深色描边让武器更实、更醒目
    ctx.lineJoin = 'round';
    ctx.strokeStyle = 'rgba(16, 20, 28, .92)';
    ctx.lineWidth = 3.5;
    ctx.strokeText(W.emoji, 0, 0);
    ctx.fillStyle = '#ffffff';
    ctx.fillText(W.emoji, 0, 0);
    ctx.restore();
  },

  drawProjectiles(cam) {
    const ctx = this.ctx;
    const emoji = (ch, size, x, y) => {
      ctx.font = size + 'px "Segoe UI Emoji", "Apple Color Emoji", "Noto Color Emoji", sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.strokeStyle = 'rgba(12, 16, 24, .95)';
      ctx.lineWidth = 2.5;
      ctx.strokeText(ch, x, y);
      ctx.fillText(ch, x, y);
    };
    for (const b of this.projectiles) {
      const x = b.x - cam;
      if (b.kind === 'penweapon') {
        ctx.save();
        emoji('✒️', 30, x, b.y);
        ctx.restore();
        continue;
      }
      if (b.kind === 'finger') {
        ctx.save();
        emoji('🖕', 38, x, b.y);
        ctx.restore();
        continue;
      }
      if (b.kind === 'rainbow') {
        ctx.save();
        emoji('🏳️‍🌈', 27, x, b.y);
        ctx.restore();
        continue;
      }
      if (b.kind === 'pause') {
        ctx.save();
        const glow = ctx.createRadialGradient(x, b.y, 2, x, b.y, 26);
        glow.addColorStop(0, 'rgba(200, 160, 255, .85)');
        glow.addColorStop(1, 'rgba(160, 120, 255, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, b.y, 26, 0, Math.PI * 2);
        ctx.fill();
        emoji('⏸️', 34, x, b.y);
        ctx.restore();
        continue;
      }
      if (b.kind === 'pen') {
        ctx.save();
        const glow = ctx.createRadialGradient(x, b.y, 1, x, b.y, 20);
        glow.addColorStop(0, 'rgba(80, 120, 255, .8)');
        glow.addColorStop(1, 'rgba(80, 120, 255, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, b.y, 20, 0, Math.PI * 2);
        ctx.fill();
        emoji('🖋️', 24, x, b.y);
        ctx.restore();
        continue;
      }
      if (b.kind === 'book') {
        ctx.save();
        ctx.globalAlpha = 0.75;
        const glow = ctx.createRadialGradient(x, b.y, 4, x, b.y, 58);
        glow.addColorStop(0, 'rgba(200, 205, 235, .55)');
        glow.addColorStop(1, 'rgba(160, 160, 200, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, b.y, 58, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 0.9;
        emoji('📖', 58, x, b.y);
        ctx.restore();
        continue;
      }
      if (b.kind === 'spike') {
        const glow = ctx.createRadialGradient(x, b.y, 1, x, b.y, 14);
        glow.addColorStop(0, 'rgba(160, 255, 170, .9)');
        glow.addColorStop(1, 'rgba(90, 220, 120, 0)');
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(x, b.y, 14, 0, Math.PI * 2);
        ctx.fill();

        ctx.save();
        ctx.translate(x, b.y);
        ctx.fillStyle = '#8ef0a0';
        ctx.strokeStyle = 'rgba(12, 60, 24, .95)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(b.dir * 12, 0);
        ctx.lineTo(-b.dir * 6, -5);
        ctx.lineTo(-b.dir * 6, 5);
        ctx.closePath();
        ctx.fill();
        ctx.stroke();
        ctx.restore();
        continue;
      }

      const glow = ctx.createRadialGradient(x, b.y, 1, x, b.y, 18);
      glow.addColorStop(0, 'rgba(255,255,255,.95)');
      glow.addColorStop(1, 'rgba(200, 235, 255, 0)');
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, b.y, 18, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = 'rgba(20, 30, 45, .9)';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(x, b.y, 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = 'rgba(255,255,255,.5)';
      ctx.beginPath();
      ctx.arc(x - b.dir * 12, b.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  },

  drawEffects(cam) {
    const ctx = this.ctx;
    for (const fx of this.effects) {
      const k = fx.t / fx.life;
      const a = 1 - k;
      const x = fx.x - cam;
      ctx.save();
      ctx.globalAlpha = a;

      if (fx.type === 'slash') {
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 5;
        ctx.beginPath();
        const start = fx.dir > 0 ? -0.9 : Math.PI - 0.9;
        ctx.arc(x, fx.y, 48 + k * 16, start, start + 1.8);
        ctx.stroke();
      } else if (fx.type === 'trail') {
        ctx.strokeStyle = 'rgba(185, 228, 255, .85)';
        ctx.lineWidth = 3;
        for (let i = 0; i < 3; i++) {
          ctx.globalAlpha = a * (0.65 - i * 0.16);
          ctx.beginPath();
          ctx.moveTo(x - fx.dir * (4 + i * 7), fx.y - 8 + i * 8);
          ctx.lineTo(x - fx.dir * (24 + i * 12), fx.y - 8 + i * 8);
          ctx.stroke();
        }
      } else if (fx.type === 'cross') {
        // 黄色十字闪光：一长一短，细而半透明，不遮挡敌人动作
        const base = fx.size == null ? 14 : fx.size;
        const s = base * (1 + k * 0.5);
        const sw = s * (fx.ratio == null ? 0.32 : fx.ratio);
        ctx.globalAlpha = a * (fx.alpha == null ? 0.72 : fx.alpha);
        ctx.strokeStyle = fx.color || '#ffd166';
        ctx.lineWidth = fx.width || 2.4;
        ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(x, fx.y - s); ctx.lineTo(x, fx.y + s);
        ctx.moveTo(x - sw, fx.y); ctx.lineTo(x + sw, fx.y);
        ctx.stroke();
      } else if (fx.type === 'ring') {
        const r0 = fx.r0 == null ? 12 : fx.r0;
        const r1 = fx.r1 == null ? 52 : fx.r1;
        ctx.strokeStyle = fx.color || '#ffffff';
        ctx.lineWidth = fx.width || 3;
        ctx.beginPath();
        ctx.arc(x, fx.y, r0 + k * (r1 - r0), 0, Math.PI * 2);
        ctx.stroke();
      } else if (fx.type === 'bite') {
        ctx.strokeStyle = '#ff6b76';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(x, fx.y, 26, fx.dir > 0 ? -0.6 : Math.PI - 0.6, fx.dir > 0 ? 0.6 : Math.PI + 0.6);
        ctx.stroke();
      } else if (fx.type === 'burst') {
        for (let i = 0; i < 6; i++) {
          const ang = (i / 6) * Math.PI * 2;
          const d = 10 + k * 40;
          ctx.fillStyle = '#ffe9b0';
          ctx.beginPath();
          ctx.arc(x + Math.cos(ang) * d, fx.y + Math.sin(ang) * d, 3 * a + 1, 0, Math.PI * 2);
          ctx.fill();
        }
      }
      ctx.restore();
    }
  },

  drawTexts(cam) {
    const ctx = this.ctx;
    for (const t of this.texts) {
      const a = 1 - t.t / t.life;
      ctx.save();
      ctx.globalAlpha = Math.max(0, a);
      ctx.font = `bold ${t.size}px "Microsoft YaHei", sans-serif`;
      ctx.textAlign = 'center';
      ctx.lineWidth = 4;
      ctx.strokeStyle = 'rgba(10, 10, 16, .8)';
      ctx.strokeText(t.text, t.x - cam, t.y);
      ctx.fillStyle = t.color;
      ctx.fillText(t.text, t.x - cam, t.y);
      ctx.restore();
    }
  },

  drawBossBar() {
    const boss = this.enemies.find(e => e.kind === 'boss' && !e.dead);
    if (!boss) return;
    const ctx = this.ctx;
    const w = 520;
    const x = (CFG.view.w - w) / 2;
    const y = 16;

    ctx.save();
    ctx.fillStyle = 'rgba(8, 12, 20, .78)';
    ctx.strokeStyle = 'rgba(255, 209, 102, .35)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.roundRect(x - 14, y - 8, w + 28, 68, 10);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ffe6ac';
    ctx.font = 'bold 13px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'middle';
    const bossName = boss.type === 'timedemon'
      ? ('时间恶魔' + (boss.phase2 ? ' · 二阶段' : ''))
      : ('孙点黑' + (boss.phase === 2 ? ' · 二阶段' : ''));
    ctx.fillText(bossName, x, y + 7);
    if (boss.weak > 0) {
      ctx.fillStyle = '#7fe0ff';
      ctx.textAlign = 'right';
      ctx.fillText('虚弱 ' + boss.weak.toFixed(1) + 's', x + w, y + 7);
    } else if (boss.flying) {
      ctx.fillStyle = '#8fd7ff';
      ctx.textAlign = 'right';
      ctx.fillText('飞空', x + w, y + 7);
    } else if (boss.type === 'timedemon') {
      ctx.textAlign = 'right';
      if (boss.healing) {
        ctx.fillStyle = '#8ef0a0';
        ctx.fillText('回复中 +' + CFG.timeDemon.healPerSec + '/s', x + w, y + 7);
      } else {
        const left = Math.max(0, CFG.timeDemon.healDelay - boss.noDmgT);
        ctx.fillStyle = left <= 3 ? '#ff9f6e' : '#9fb3d1';
        ctx.fillText('回血倒计时 ' + left.toFixed(1) + 's', x + w, y + 7);
      }
    }

    // HP
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(x, y + 17, w, 14);
    ctx.fillStyle = '#ff5d6c';
    ctx.fillRect(x, y + 17, w * Math.max(0, boss.hp / boss.maxHp), 14);
    ctx.strokeStyle = 'rgba(255,255,255,.25)';
    ctx.strokeRect(x, y + 17, w, 14);
    ctx.fillStyle = '#ffffff';
    ctx.font = '10px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(Math.ceil(boss.hp) + ' / ' + boss.maxHp, x + w / 2, y + 24);

    // 韧性
    ctx.fillStyle = 'rgba(0,0,0,.55)';
    ctx.fillRect(x, y + 36, w, 8);
    ctx.fillStyle = '#8fd7ff';
    ctx.fillRect(x, y + 36, w * Math.max(0, boss.tough / boss.toughMax), 8);
    ctx.strokeStyle = 'rgba(255,255,255,.2)';
    ctx.strokeRect(x, y + 36, w, 8);
    ctx.restore();
  },

  drawScreenFx() {
    const ctx = this.ctx;

    if (this.focusTimer > 0) {
      const a = Math.min(1, this.focusTimer * 1.6);
      ctx.save();
      ctx.fillStyle = `rgba(70, 40, 120, ${0.16 * a})`;
      ctx.fillRect(0, 0, 1280, 720);

      const vig = ctx.createRadialGradient(640, 360, 220, 640, 360, 760);
      vig.addColorStop(0, 'rgba(120, 80, 200, 0)');
      vig.addColorStop(1, `rgba(70, 40, 130, ${0.5 * a})`);
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, 1280, 720);

      ctx.fillStyle = `rgba(5, 8, 18, ${0.5 * a})`;
      ctx.fillRect(0, 0, 1280, 42);
      ctx.fillRect(0, 678, 1280, 42);

      ctx.fillStyle = `rgba(220, 200, 255, ${0.75 * a})`;
      ctx.font = 'bold 13px "Microsoft YaHei", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('F O C U S', 640, 26);
      ctx.restore();
    }

    if (this.hurtFlash > 0) {
      const vig = ctx.createRadialGradient(640, 360, 300, 640, 360, 760);
      vig.addColorStop(0, 'rgba(255, 40, 60, 0)');
      vig.addColorStop(1, `rgba(255, 30, 50, ${0.42 * this.hurtFlash})`);
      ctx.fillStyle = vig;
      ctx.fillRect(0, 0, 1280, 720);
    }
  }
};

window.addEventListener('DOMContentLoaded', () => Game.init());

</script>
