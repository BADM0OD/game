    const defBonus = wl >= 2 ? 50 : 0;
    this.hp = CFG.bossSun.hp + hpBonus;
    this.maxHp = this.hp;
    this.atk = CFG.bossSun.atk + atkBonus;
    this.def = { atk: this.atk, def: CFG.bossSun.def + defBonus, critRate: 0, critDmg: 1.5, w: CFG.bossSun.w, h: CFG.bossSun.h };
    this.toughMax = CFG.bossSun.toughness;
    this.tough = this.toughMax;
    this.weak = 0;
    this.markT = 0;
    this.phase = 1;
    this.flown = false;
    this.flying = false;
    this.flyT = 0;
    this.rainTimer = 0;
    this.state = 'intro';
    this.introT = 0.8;
    this.atkTimer = 1.4;
    this.skillTimer = 4;
    this.skill2Timer = 15;
    this.meleeT = 0;
    this.meleeHit = false;
    this.t = 0;
    this.flash = 0;
    this.dead = false;
    this.w = CFG.bossSun.w;
    this.h = CFG.bossSun.h;
  }

  box() {
    return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h };
  }

  update(wdt, game) {
    if (this.dead) return;
    this.t += wdt;
    this.flash = Math.max(0, this.flash - wdt);
    if (this.markT > 0) this.markT = Math.max(0, this.markT - wdt);
    if (this.introT > 0) { this.introT -= wdt; return; }

    // 半血时进入二阶段；若正处于虚弱，提前结束虚弱
    if (this.phase === 1 && !this.flown && this.hp <= this.maxHp * 0.5) {
      this.enterPhase2(game);
      return;
    }

    if (this.weak > 0) {
      this.weak -= wdt;
      if (this.weak <= 0) {
        this.weak = 0;
        this.tough = this.toughMax;
        game.spawnText(this.x, this.y - 120, '韧性恢复', '#ffd166');
      }
      return;
    }

    if (this.flying) {
      this.y = LEVEL.floorY - 320;
      this.flyT += wdt;
      this.rainTimer -= wdt;
      if (this.flyT < 5 && this.rainTimer <= 0) {
        this.rainTimer = 0.5;
        game.projectiles.push(new RainbowShot(this, game.player));
      }
      if (this.flyT >= 5) {
        this.flying = false;
        this.y = LEVEL.floorY;
        this.state = 'ground';
        this.skill2Timer = 1;
        this.skillTimer = 5;
        game.spawnText(this.x, this.y - 100, '落地', '#ffd166');
      }
      return;
    }

    const p = game.player;
    const dx = p.x - this.x;
    this.dir = Math.sign(dx) || this.dir;

    // 地面移动
    if (Math.abs(dx) > 280) game.moveEnemy(this, this.dir * 220 * wdt);
    else if (Math.abs(dx) < 150) game.moveEnemy(this, -this.dir * 160 * wdt);

    // 普攻：两个阶段都会使用
    if (this.state === 'melee') {
      this.meleeT -= wdt;
      if (!this.meleeHit && this.meleeT <= 0.25) {
        this.meleeHit = true;
        game.bossMelee(this, 100, 1.0);
      }
      if (this.meleeT <= 0) this.state = 'idle';
    } else {
      this.atkTimer -= wdt;
      if (this.atkTimer <= 0) {
        this.atkTimer = 2.0;
        if (Math.abs(dx) < 300) {
          this.state = 'melee';
          this.meleeT = 0.5;
          this.meleeHit = false;
        } else {
          this.fireFinger(game);
        }
      }
    }

    if (this.phase === 1) {
      this.skillTimer -= wdt;
      if (this.skillTimer <= 0) {
        this.skillTimer = 6;
        game.spawnBossTotem(this, 'male');
      }
    } else {
      this.skill2Timer -= wdt;
      if (this.skill2Timer <= 0) {
        this.skill2Timer = 15;
        game.spawnTrans(this);
      }
      this.skillTimer -= wdt;
      if (this.skillTimer <= 0) {
        this.skillTimer = 7;
        game.spawnBossTotem(this, 'female');
      }
    }
  }

  enterPhase2(game) {
    if (this.phase >= 2) return;
    this.phase = 2;
    this.flown = true;
    this.flying = true;
    this.flyT = 0;
    this.rainTimer = 0;
    this.state = 'fly';
    this.weak = 0;
    this.tough = this.toughMax;
    game.spawnText(this.x, this.y - 120, '二阶段', '#ff9f6e');
  }

  triggerWeak(game) {
    this.tough = 0;
    this.weak = CFG.bossSun.weak;
    this.state = 'weak';
    if (this.flying) {
      this.flying = false;
      this.flyT = 0;
      this.y = LEVEL.floorY;
    }
    game.spawnText(this.x, this.y - 120, '虚弱', '#7fe0ff');
    game.effects.push({ type: 'ring', x: this.x, y: this.y - 40, t: 0, life: 0.45, r0: 12, r1: 110, width: 5, color: '#7fe0ff' });
  }

  onPerfectBlocked(game) {
    if (this.dead || this.weak > 0) return;
    this.tough -= CFG.bossSun.perfectBlockTough || 100;
    if (this.tough <= 0) this.triggerWeak(game);
  }

  fireFinger(game) {
    if (game.projectiles.some(p => p.kind === 'finger' && !p.dead)) return;
    game.projectiles.push(new FingerShot(this));
  }

  hurt(dmg, dir, game) {
    if (this.dead) return;
    this.hp -= dmg;
    game.onPlayerHitEnemy(this);
    this.flash = 0.14;
    this.x += dir * 3;
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      game.onBossDefeated(this);
      return;
    }
    if (this.phase === 1 && !this.flown && this.hp <= this.maxHp * 0.5) {
      this.enterPhase2(game);
      return;
    }
    if (this.weak <= 0) {
      this.tough -= CFG.bossSun.toughPerHit;
      if (this.tough <= 0) this.triggerWeak(game);
    }
  }

  onTotemDestroyed(game) {
    if (this.dead || this.weak > 0) return;
    this.tough -= CFG.bossSun.toughPerTotem;
    if (this.tough <= 0) this.triggerWeak(game);
  }
}

/* ---------------- 孙点黑的召唤物 🚹 / 🚺 ---------------- */

class BossTotem {
  constructor(game, boss, x, type) {
    this.kind = 'totem';
    this.type = 'totem';
    this.boss = boss;
    this.index = 'hou:totem:' + Date.now() + ':' + Math.floor(Math.random() * 1000);
    this.x = x;
    this.startY = LEVEL.floorY - 360;
    this.y = this.startY;
    this.fallT = 1.5;
    this.landed = false;
    this.life = 20;
    this.hp = 100;
    this.maxHp = 100;
    this.emoji = type === 'female' ? '🚺' : '🚹';
    this.dead = false;
    this.flash = 0;
    this.def = { def: 100 };
  }

  box() {
    return { x: this.x - 16, y: this.y - 32, w: 32, h: 32 };
  }

  update(wdt, game) {
    if (this.dead) return;
    this.flash = Math.max(0, this.flash - wdt);
    if (!this.landed) {
      this.fallT -= wdt;
      const k = 1 - Math.max(0, this.fallT) / 1.5;
      this.y = this.startY + (LEVEL.floorY - this.startY) * k;
      if (this.fallT <= 0) {
        this.landed = true;
        this.y = LEVEL.floorY;
        this.life = 20;
        game.bossLandHit(this.boss, this.x);
      }
      return;
    }
    this.life -= wdt;
    if (this.life <= 0) this.dead = true;
  }

  hurt(dmg, dir, game) {
    if (this.dead || !this.landed) return;
    this.hp -= dmg;
    this.flash = 0.14;
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      if (this.boss) this.boss.onTotemDestroyed(game);
    }
  }
}

/* ---------------- 孙点黑飞行物 ---------------- */

class FingerShot {
  constructor(boss) {
    this.kind = 'finger';
    this.boss = boss;
    this.dir = boss.dir;
    this.x = boss.x + this.dir * 40;
    this.y = boss.y - 34;
    this.vx = this.dir * CFG.bossSun.fingerSpeed;
    this.life = 999;
    this.dead = false;
    this.r = 15;
  }

  update(wdt, game) {
    if (this.dead) return;
    this.x += this.vx * wdt;
    if (this.x < 0 || this.x > LEVEL.width) { this.dead = true; return; }
    if (game.projectileBlocked(this.x, this.y, this.r)) { this.dead = true; return; }
    const p = game.player;
    if (Math.abs(this.x - p.x) < 26 + this.r && Math.abs(this.y - (p.y - 25)) < 34 + this.r) {
      p.takeDamage(this.boss.atk * 2.0, this.x, this.boss);
      this.dead = true;
    }
  }
}

class RainbowShot {
  constructor(boss, player) {
    this.kind = 'rainbow';
    this.boss = boss;
    const p = player;
    const dx = p.x - boss.x;
    const dy = (p.y - 25) - (boss.y - 25);
    const d = Math.hypot(dx, dy) || 1;
    this.vx = (dx / d) * CFG.bossSun.rainbowSpeed;
    this.vy = (dy / d) * CFG.bossSun.rainbowSpeed;
    this.x = boss.x;
    this.y = boss.y - 30;
    this.life = 6;
    this.dead = false;
    this.r = 11;
  }

  update(wdt, game) {
    if (this.dead) return;
    this.x += this.vx * wdt;
    this.y += this.vy * wdt;
    this.life -= wdt;
    if (this.life <= 0 || this.x < 0 || this.x > LEVEL.width || this.y < 0 || this.y > 720) {
      this.dead = true;
      return;
    }
    if (game.projectileBlocked(this.x, this.y, this.r)) { this.dead = true; return; }
    const p = game.player;
    if (Math.abs(this.x - p.x) < 26 + this.r && Math.abs(this.y - (p.y - 25)) < 34 + this.r) {
      p.takeDamage(this.boss.atk * 2.0, this.x, this.boss);
      this.dead = true;
    }
  }
}

/* ---------------- ⏰ 时间恶魔 ---------------- */

class TimeDemon {
  constructor(x, opts) {
    opts = opts || {};
    this.kind = 'boss';
    this.type = 'timedemon';
    this.index = opts.index || ('time:' + Date.now());
    this.x = x;
    this.y = LEVEL.floorY;
    this.baseY = this.y;
    this.dir = -1;
    const wl = (typeof Game !== 'undefined' && Game.worldLevel) ? Game.worldLevel() : 1;
    // 世界等级 2：首领同样获得生命 +1000 / 攻击 +50 / 防御 +50
    const hpBonus = wl >= 2 ? 1000 : 0;
    const atkBonus = wl >= 2 ? 50 : 0;
    const defBonus = wl >= 2 ? 50 : 0;
    this.hp = CFG.timeDemon.hp + hpBonus;
    this.maxHp = this.hp;
    this.atk = CFG.timeDemon.atk + atkBonus;
    this.def = { atk: this.atk, def: CFG.timeDemon.def + defBonus, critRate: 0, critDmg: 1.5, w: CFG.timeDemon.w, h: CFG.timeDemon.h };
    this.toughMax = CFG.timeDemon.toughness;
    this.tough = this.toughMax;
    this.weak = 0;
    this.markT = 0;
    this.phase = 1;
    this.phase2 = false;
    this.state = 'idle';
    this.introT = 1.0;
    this.atkTimer = 2.4;
    this.dashCd = 8;
    this.skill1T = 5;
    this.skill4T = 7;
    this.skill5T = 11;
    this.meleeT = 0;
    this.meleeHit = false;
    this.dashWindT = 0;
    this.dashT = 0;
    this.dashDir = 1;
    this.dashHit = false;
    this.noDmgT = 0;
    this.healing = false;
    this.healAcc = 0;
    this.healTick = 0;
    this.t = 0;
    this.flash = 0;
    this.dead = false;
    this.w = CFG.timeDemon.w;
    this.h = CFG.timeDemon.h;
  }

  box() {
    return { x: this.x - this.w / 2, y: this.y - this.h, w: this.w, h: this.h };
  }

  enterPhase2(game) {
    if (this.phase2) return;
    this.phase2 = true;
    this.phase = 2;
    this.skill4T = 1.2;
    this.skill5T = 3;
    this.skill1T = Math.min(this.skill1T, 3);
    game.spawnText(this.x, this.y - 120, '二阶段', '#ff9f6e');
    game.effects.push({ type: 'ring', x: this.x, y: this.y - 44, t: 0, life: 0.6, r0: 20, r1: 150, width: 6, color: '#ff9f6e' });
    game.shake = Math.max(game.shake, 10);
  }

  triggerWeak(game) {
    this.tough = 0;
    this.weak = CFG.timeDemon.weak;
    this.state = 'idle';
    this.dashT = 0;
    this.dashWindT = 0;
    game.spawnText(this.x, this.y - 120, '虚弱', '#7fe0ff');
    game.effects.push({ type: 'ring', x: this.x, y: this.y - 40, t: 0, life: 0.45, r0: 12, r1: 110, width: 5, color: '#7fe0ff' });
  }

  onPerfectBlocked(game) {
    if (this.dead || this.weak > 0) return;
    this.tough -= CFG.timeDemon.perfectBlockTough;
    if (this.tough <= 0) this.triggerWeak(game);
  }

  hurt(dmg, dir, game) {
    if (this.dead) return;
    this.hp -= dmg;
    this.noDmgT = 0;
    this.healing = false;
    game.onPlayerHitEnemy(this);
    this.flash = 0.14;
    this.x += dir * 3;
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      game.onBossDefeated(this);
      return;
    }
    if (!this.phase2 && this.hp <= this.maxHp * 0.5) {
      this.enterPhase2(game);
      return;
    }
    if (this.weak <= 0) {
      this.tough -= CFG.timeDemon.toughPerHit;
      if (this.tough <= 0) this.triggerWeak(game);
    }
  }

  update(wdt, game) {
    if (this.dead) return;
    this.t += wdt;
    this.flash = Math.max(0, this.flash - wdt);
    if (this.markT > 0) this.markT = Math.max(0, this.markT - wdt);
    if (this.introT > 0) { this.introT -= wdt; return; }

    if (!this.phase2 && this.hp <= this.maxHp * 0.5) this.enterPhase2(game);

    // 技能 3：连续 10 秒未受伤则每秒回复 20，直到再次受伤
    this.noDmgT += wdt;
    if (!this.healing && this.noDmgT >= CFG.timeDemon.healDelay && this.hp < this.maxHp) {
      this.healing = true;
      this.healAcc = 0;
      this.healTick = 0;
      game.spawnText(this.x, this.y - 120, '时间回溯 · 回复中', '#8ef0a0');
    }
    if (this.healing) {
      if (this.hp >= this.maxHp) {
        this.healing = false;
      } else {
        this.healAcc += CFG.timeDemon.healPerSec * wdt;
        if (this.healAcc >= 1) {
          const n = Math.floor(this.healAcc);
          this.healAcc -= n;
          this.hp = Math.min(this.maxHp, this.hp + n);
          this.healTick += n;
          if (this.healTick >= 20) {
            this.healTick = 0;
            game.spawnText(this.x, this.y - 110, '+' + 20, '#8ef0a0');
          }
        }
      }
    }

    if (this.weak > 0) {
      this.weak -= wdt;
      if (this.weak <= 0) {
        this.weak = 0;
        this.tough = this.toughMax;
        game.spawnText(this.x, this.y - 120, '韧性恢复', '#ffd166');
      }
      return;
    }

    const p = game.player;
    const dx = p.x - this.x;
    this.dir = Math.sign(dx) || this.dir;

    // 技能 2：冲撞
    if (this.state === 'dashwind') {
      this.dashWindT -= wdt;
      if (this.dashWindT <= 0) {
        this.state = 'dash';
        this.dashT = 0.75;
        this.dashDir = this.dir;
        this.dashHit = false;
      }
      return;
    }
    if (this.state === 'dash') {
      this.x += this.dashDir * CFG.timeDemon.dashSpeed * wdt;
      this.x = Math.max(40, Math.min(LEVEL.width - 40, this.x));
      if (!this.dashHit &&
          Math.abs(p.x - this.x) < 70 && Math.abs(p.y - this.y) < 120) {
        this.dashHit = true;
        p.takeDamage(this.atk * CFG.timeDemon.dashMult, this.x, this);
      }
      this.dashT -= wdt;
      if (this.dashT <= 0) {
        this.state = 'idle';
        this.atkTimer = 1.2;
      }
      return;
    }

    // 普攻 1：举起 ⏳ 向下砸（半径 150）
    if (this.state === 'melee') {
      this.meleeT -= wdt;
      if (!this.meleeHit && this.meleeT <= 0.3) {
        this.meleeHit = true;
        game.bossMelee(this, CFG.timeDemon.slamRadius, CFG.timeDemon.slamMult);
      }
      if (this.meleeT <= 0) this.state = 'idle';
      return;
    }

    // 地面移动
    if (Math.abs(dx) > 340) game.moveEnemy(this, this.dir * 230 * wdt);
    else if (Math.abs(dx) < 210) game.moveEnemy(this, -this.dir * 170 * wdt);

    // 普攻计时
    this.atkTimer -= wdt;
    if (this.atkTimer <= 0) {
      this.atkTimer = 2.4;
      if (Math.abs(dx) < 420) {
        this.state = 'melee';
        this.meleeT = 0.65;
        this.meleeHit = false;
      }
    }

    // 技能 2 冷却
    this.dashCd -= wdt;
    if (this.dashCd <= 0 && Math.abs(dx) < 700) {
      this.dashCd = 9;
      this.state = 'dashwind';
      this.dashWindT = 0.6;
    }

    // 技能 1：召唤 ⌛
    this.skill1T -= wdt;
    if (this.skill1T <= 0) {
      this.skill1T = 8;
      game.spawnHourglass(this);
    }

    // 二阶段技能
    if (this.phase2) {
      this.skill4T -= wdt;
      if (this.skill4T <= 0) {
        this.skill4T = 9;
        game.firePauseShot(this);
      }
      this.skill5T -= wdt;
      if (this.skill5T <= 0) {
        this.skill5T = 11;
        game.spawnRewind(this);
      }
    }
  }
}

/* ---------------- ⌛ 时间恶魔的沙漏 ---------------- */

class TimeHourglass {
  constructor(game, boss, x) {
    this.kind = 'hourglass';
    this.type = 'hourglass';
    this.boss = boss;
    this.index = 'time:hg:' + Date.now() + ':' + Math.floor(Math.random() * 10000);
    this.x = x;
    this.y = LEVEL.floorY;
    this.hp = CFG.timeDemon.hourglassHp;
    this.maxHp = this.hp;
    this.life = CFG.timeDemon.hourglassCd;
    this.flying = false;
    this.vx = 0;
    this.vy = 0;
    this.dead = false;
    this.flash = 0;
    this.def = { def: 100 };
    this.r = 18;
  }

  box() {
    return { x: this.x - 18, y: this.y - 42, w: 36, h: 42 };
  }

  update(wdt, game) {
    if (this.dead) return;
    this.flash = Math.max(0, this.flash - wdt);
    if (!this.flying) {
      this.life -= wdt;
      if (this.life <= 0) {
        this.flying = true;
        const p = game.player;
        const dx = p.x - this.x;
        const dy = (p.y - 25) - (this.y - 25);
        const d = Math.hypot(dx, dy) || 1;
        this.vx = (dx / d) * CFG.timeDemon.hourglassSpeed;
        this.vy = (dy / d) * CFG.timeDemon.hourglassSpeed;
        game.spawnText(this.x, this.y - 70, '时间到！', '#ff6b76');
        SFX.play('heavy');
      }
      return;
    }
    // 轻度追踪：每次只把速度方向朝玩家偏转一点
    const p = game.player;
    const dx = p.x - this.x;
    const dy = (p.y - 25) - (this.y - 25);
    const d = Math.hypot(dx, dy) || 1;
    const sp = CFG.timeDemon.hourglassSpeed;
    this.vx += ((dx / d) * sp - this.vx) * Math.min(1, 2.2 * wdt);
    this.vy += ((dy / d) * sp - this.vy) * Math.min(1, 2.2 * wdt);
    const v = Math.hypot(this.vx, this.vy) || 1;
    this.vx = (this.vx / v) * sp;
    this.vy = (this.vy / v) * sp;
    this.x += this.vx * wdt;
    this.y += this.vy * wdt;
    if (this.x < -40 || this.x > LEVEL.width + 40 || this.y < -80 || this.y > 780) {
      this.dead = true;
      return;
    }
    if (Math.abs(this.x - p.x) < 22 + this.r && Math.abs((this.y - 25) - (p.y - 25)) < 30 + this.r) {
      p.takeDamage(this.boss.atk * CFG.timeDemon.hourglassMult, this.x, this.boss);
      this.dead = true;
    }
  }

  hurt(dmg, dir, game) {
    if (this.dead || this.flying) return;
    this.hp -= dmg;
    this.flash = 0.14;
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      game.spawnText(this.x, this.y - 54, '破坏', '#7fe0ff');
    }
  }
}

  }

  box() {
    return { x: this.x - 18, y: this.y - 42, w: 36, h: 42 };
  }

  update(wdt, game) {
    if (this.dead) return;
    this.flash = Math.max(0, this.flash - wdt);
    if (!this.flying) {
      this.life -= wdt;
      if (this.life <= 0) {
        this.flying = true;
        game.spawnText(this.x, this.y - 70, '倒带！', '#c9a6ff');
        SFX.play('quest');
      }
      return;
    }
    const b = this.boss;
    if (!b || b.dead) { this.dead = true; return; }
    const tx = b.x;
    const ty = b.y - 44;
    const dx = tx - this.x;
    const dy = ty - this.y;
    const d = Math.hypot(dx, dy) || 1;
    const sp = 900;
    this.x += (dx / d) * sp * wdt;
    this.y += (dy / d) * sp * wdt;
    if (d < 34) {
      this.dead = true;
      b.hp = Math.min(b.maxHp, b.hp + CFG.timeDemon.rewindHeal);
      game.spawnText(b.x, b.y - 120, '+' + CFG.timeDemon.rewindHeal, '#8ef0a0');
      game.effects.push({ type: 'ring', x: b.x, y: b.y - 44, t: 0, life: 0.4, r0: 10, r1: 80, width: 4, color: '#8ef0a0' });
    }
  }

  hurt(dmg, dir, game) {
    if (this.dead || this.flying) return;
    this.hp -= dmg;
    this.flash = 0.14;
    if (this.hp <= 0) {
      this.hp = 0;
      this.dead = true;
      game.spawnText(this.x, this.y - 54, '破坏', '#7fe0ff');
    }
  }
}

/* ---------------- ⏸️ 时间恶魔的定身弹 ---------------- */

class PauseShot {
  constructor(boss) {
    this.kind = 'pause';
    this.boss = boss;
    this.x = boss.x + boss.dir * 40;
    this.y = boss.y - 44;
    this.vx = boss.dir * 520;
    this.vy = 0;
    this.life = 4;
    this.dead = false;
    this.r = 16;
  }

  update(wdt, game) {
    if (this.dead) return;
    this.x += this.vx * wdt;
    this.y += this.vy * wdt;
    this.life -= wdt;
    if (this.life <= 0 || this.x < 0 || this.x > LEVEL.width) {
      this.dead = true;
      return;
    }
    if (game.projectileBlocked(this.x, this.y, this.r)) {
      this.dead = true;
      return;
    }
    const p = game.player;
    if (Math.abs(this.x - p.x) < 24 + this.r && Math.abs(this.y - (p.y - 25)) < 32 + this.r) {
      this.dead = true;
      if (p.isDashing()) {
        // 完美闪避：不受伤害，也不被定身
        p.perfectDodge();
      } else {
        // 完美格挡：不受伤害，但依然会被定身
        p.takeDamage(this.boss.atk * CFG.timeDemon.pauseMult, this.x, this.boss);
        p.root(CFG.timeDemon.pauseRoot);
      }
    }
  }
}

/* ---------------- ⚧️ 飞行物（可被破坏） ---------------- */

class TransShot {
  constructor(boss, dir) {
    this.kind = 'trans';
    this.type = 'trans';
    this.boss = boss;
    this.index = 'hou:trans:' + Date.now();
    this.dir = dir;
    this.x = boss.x + dir * 44;
    this.y = boss.y - 40;
    this.vx = dir * CFG.bossSun.transSpeed;
    this.r = 5;
    this.hp = CFG.bossSun.transHp;
    this.maxHp = this.hp;
    this.life = 12;
    this.dead = false;
    this.flash = 0;
    this.def = { def: 100 };
  }

  box() {
    return { x: this.x - this.r, y: this.y - this.r, w: this.r * 2, h: this.r * 2 };
  }

  update(wdt, game) {
    if (this.dead) return;
    this.flash = Math.max(0, this.flash - wdt);
    this.r += 5 * wdt;
    this.x += this.vx * wdt;
    this.life -= wdt;
    if (this.life <= 0 || this.x < 0 || this.x > LEVEL.width ||
        game.projectileBlocked(this.x, this.y, this.r)) {
      this.dead = true;
      return;
    }
    const p = game.player;
    if (Math.abs(this.x - p.x) < 26 + this.r && Math.abs(this.y - (p.y - 25)) < 34 + this.r) {
      p.takeDamage(this.boss.atk * 2.0, this.x, this.boss);
      this.dead = true;
    }
  }

  hurt(dmg, dir, game) {
    if (this.dead) return;
    this.hp -= dmg;
    this.flash = 0.14;
    if (this.hp <= 0) {
      this.dead = true;
      game.spawnText(this.x, this.y - 40, '破坏', '#7fe0ff');
    }
  }
}

/* ---------------- 王明猪的钢笔弹 ---------------- */

class PenShot {
  constructor(owner, dir) {
    this.kind = 'pen';
    this.owner = owner;
    this.dir = dir;
    this.x = owner.x + dir * 36;
    this.y = owner.y - 34;
    this.vx = dir * CFG.enemy.pig.shotSpeed;
    this.life = 4;
    this.dead = false;
    this.r = CFG.enemy.pig.shotRadius;
  }

  update(wdt, game) {
    if (this.dead) return;
    this.x += this.vx * wdt;
    this.life -= wdt;
    if (this.life <= 0 || this.x < 0 || this.x > LEVEL.width) {
      this.dead = true;
      return;
    }
    if (game.projectileBlocked(this.x, this.y, this.r)) {
      this.dead = true;
      return;
    }

    const p = game.player;
    if (!p || p.dead) return;
    if (Math.abs(this.x - p.x) < 26 + this.r && Math.abs(this.y - (p.y - 25)) < 32 + this.r) {
      p.takeDamage((this.owner.atk || this.owner.def.atk) * CFG.enemy.pig.shotMult, this.x, this.owner);
      game.effects.push({ type: 'ring', x: this.x, y: this.y, t: 0, life: 0.18, color: '#333333' });
      this.dead = true;
    }
  }
}

/* ---------------- 电焊区域 ---------------- */

class WeldZone {
  constructor(game, owner, x, y) {
    this.owner = owner;
    this.x = x;
    this.y = y;
    this.t = 0;
    this.delay = CFG.enemy.pig.weldDelay;
    this.radius = CFG.enemy.pig.weldRadius;
    this.hit = false;
    this.dead = false;
  }

  update(dt, game) {
    this.t += dt;
    if (!this.hit && this.t >= this.delay) {
      this.hit = true;
      const p = game.player;
      const dodged = p.isDashing();
      const inRange = Math.hypot(p.x - this.x, (p.y - 25) - (this.y - 25)) <= this.radius;
      if (inRange && !dodged && p.invuln <= 0) {
        p.takeDamage((this.owner.atk || this.owner.def.atk) * CFG.enemy.pig.weldMult, this.x, this.owner);
        p.paralyze(CFG.enemy.pig.para);
      }
      game.effects.push({ type: 'ring', x: this.x, y: this.y - 25, t: 0, life: 0.4, color: '#7fd0ff' });
      SFX.play('heavy');
    }
    if (this.t >= this.delay + 0.45) this.dead = true;
  }
}

</script>
<script>
'use strict';

const UI = {
  els: {},
  cards: [],
  partySig: '',
  toastTimer: 0,
  bagTab: 'equipment',
  questTab: 'main',
  charView: 'stats',
  upgSel: 'level',
  upgOpen: { e: false, q: false },
  hwSel: 'psych',
  itemsSig: '',
  charId: null,

  init() {
    this.els.party = document.getElementById('party');
    this.els.wallet = document.getElementById('wallet');
    this.els.tutorial = document.getElementById('tutorial');
    this.els.items = document.getElementById('items');
    this.els.status = document.getElementById('status');
    this.els.skills = document.getElementById('skills');
    this.els.overlay = document.getElementById('overlay');
    this.els.toast = document.getElementById('toast');
    this.els.charName = document.getElementById('charName');
    this.els.buffList = document.getElementById('buffList');
    this.els.hpFill = document.getElementById('hpFill');
    this.els.hpText = document.getElementById('hpText');
    this.els.stFill = document.getElementById('stFill');
    this.els.stText = document.getElementById('stText');
    this.els.loot = document.getElementById('lootFeed');

    const keys = ['Z', 'X', 'C', 'V'];
    this.els.items.innerHTML = keys.map(k =>
      `<div class="slot"><span class="key">${k}</span>空</div>`
    ).join('');

    this.els.skills.innerHTML = `
      <div class="skillSlot e" id="skillE">
        <div class="skillLabel"></div>
        <div class="skillCircle">
          <span class="skillFace"></span>
          <span class="skillKey">E</span>
        </div>
      </div>
      <div class="skillSlot q" id="skillQ">
        <div class="skillLabel"></div>
        <div class="skillCircle">
          <span class="skillNum"></span>
          <span class="skillKey">Q</span>
        </div>
      </div>`;
  },

  showHud(show) {
    const hud = document.getElementById('hud');
    if (hud) hud.classList.toggle('hidden', !show);
  },

  buildParty(game) {
    const sig = game.player.characters.map(c => c.def.id).join(',') + '|' + game.player.active;
    if (sig === this.partySig) return;
    this.partySig = sig;

    this.els.party.innerHTML = '';
    this.cards = game.player.characters.map((c, i) => {
      const el = document.createElement('div');
      el.className = 'pcard';
      el.innerHTML = `
        <div class="pavatar" style="background:${c.def.bg}">${c.def.emoji}</div>
        <div class="pinfo">
          <div class="pname"><span>${c.def.name}</span><span class="pkey">${i + 1}</span></div>
          <div class="pbar hp"><i></i></div>
          <div class="pips"></div>
        </div>`;
      this.els.party.appendChild(el);
      return { el, hp: el.querySelector('.pbar i'), pips: el.querySelector('.pips'), ch: c };
    });

    this.renderParty(game);
  },

  renderParty(game) {
    const p = game.player;
    this.cards.forEach((card, i) => {
      const c = p.characters[i];
      if (!c) return;
      card.el.classList.toggle('active', i === p.active);
      card.el.classList.toggle('dead', !c.alive);

      const ratio = Math.max(0, c.hp / c.hpMax);
      card.hp.style.width = (ratio * 100) + '%';
      card.hp.parentElement.classList.toggle('low', ratio < 0.3);

      const stages = 6;
      const filled = Math.floor((c.ult / c.def.ultMax) * stages + 1e-9);
      let pips = '';
      for (let k = 0; k < stages; k++) {
        pips += `<span class="pip ${k < filled ? 'on' : ''}"></span>`;
      }
      if (card.pips.innerHTML !== pips) card.pips.innerHTML = pips;
    });
  },

  render(game) {
    const p = game.player;
    if (!p || !p.ch) return;
    this.buildParty(game);
    this.renderParty(game);

    const ch = p.ch;
    this.els.charName.textContent = ch.def.name + ' ' + ch.def.emoji;

    let buffs = '';
    if (ch.stealth > 0) buffs += `<span class="buff">隐匿 ${ch.stealth.toFixed(1)}s</span>`;
    if (ch.awake > 0) buffs += `<span class="buff awake">睡醒了 ${ch.awake.toFixed(1)}s</span>`;
    if (p.shield > 0) buffs += `<span class="buff shield">🛡 ${Math.ceil(p.shield)} · ${p.shieldTime.toFixed(1)}s</span>`;
    if (p.haste > 0) buffs += `<span class="buff coffee">☕ 疾行 ${p.haste.toFixed(1)}s</span>`;
    if (p.paralyzed > 0) buffs += `<span class="buff para">⚡ 麻痹 ${p.paralyzed.toFixed(1)}s</span>`;
    const sproutState = p.characters.find(c => c.def.id === 'nengrongze' && c.sprout > 0);
    if (sproutState) buffs += `<span class="buff sprout">🌵 交际花 ${sproutState.sprout.toFixed(1)}s</span>`;
    if (game.focusTimer > 0) buffs += `<span class="buff focus">焦点 ${game.focusTimer.toFixed(1)}s</span>`;
    if (buffs !== this.els.buffList.innerHTML) this.els.buffList.innerHTML = buffs;

    const hpRatio = Math.max(0, ch.hp / ch.hpMax);
    this.els.hpFill.style.width = (hpRatio * 100) + '%';
    this.els.hpFill.style.background = hpRatio < 0.3
      ? 'linear-gradient(90deg,#ff5d6c,#ff9f6e)'
      : 'linear-gradient(90deg,#2fbf7d,#6fe3a6)';
    this.els.hpText.textContent = Math.ceil(ch.hp) + ' / ' + ch.hpMax;

    this.els.stFill.style.width = (p.stamina / CFG.stamina.max * 100) + '%';
    this.els.stText.textContent = '体力 ' + Math.round(p.stamina);

    this.els.wallet.innerHTML = `<div>💰 金币 <b>${game.save.gold}</b></div>`;

    const keys = ['KeyZ', 'KeyX', 'KeyC', 'KeyV'];
    const itemsHtml = keys.map(k => {
      const id = game.save.itemSlots[k.slice(3)];
      const it = id && CFG.items[id];
      const cd = it && it.id === 'mathbook' ? Math.ceil(game.itemCds.mathbook || 0) : 0;
      return `<div class="slot ${it ? 'has' : ''}">
        <span class="key">${k.slice(3)}</span>
        <span class="slotIcon">${it ? it.emoji : '空'}</span>
        ${cd > 0 ? `<span class="slotCd">${cd}</span>` : ''}
      </div>`;
    }).join('');
    if (itemsHtml !== this.itemsSig) {
      this.itemsSig = itemsHtml;
      this.els.items.innerHTML = itemsHtml;
    }

    const eEl = document.getElementById('skillE');
    const qEl = document.getElementById('skillQ');
    if (eEl && qEl) {
      const e = ch.def.e;
      const q = ch.def.q;
      const eCircle = eEl.querySelector('.skillCircle');
      const qCircle = qEl.querySelector('.skillCircle');
      const themeBg = `radial-gradient(circle at 35% 30%, #ffffff, ${ch.def.bg} 55%, ${ch.def.edge})`;

      eEl.querySelector('.skillLabel').textContent = e.name;
      eEl.querySelector('.skillFace').textContent =
        e.id === 'none' ? '—' : (ch.eCd > 0 ? Math.ceil(ch.eCd) : (e.icon || ''));
      const eReady = e.id !== 'none' && ch.eCd <= 0;
      eCircle.style.background = themeBg;
      eCircle.style.borderColor = ch.def.edge;
      eCircle.classList.toggle('off', !eReady);
      eCircle.classList.remove('full');

      qEl.querySelector('.skillLabel').textContent = q.name;
      const qCd = ch.qCd || 0;
      const qReady = q.id !== 'none' && ch.ult >= ch.def.ultMax && qCd <= 0;
      qEl.querySelector('.skillNum').textContent =
        q.id === 'none' ? '—' : (qCd > 0 ? String(Math.ceil(qCd)) : (ch.ult > 0 ? String(Math.floor(ch.ult)) : ''));
      const ultColor = ch.def.ultColor || ch.def.edge;
      qCircle.style.background = themeBg;
      qCircle.style.borderColor = qReady ? ultColor : ch.def.edge;
      qCircle.style.boxShadow = qReady
        ? `0 0 0 3px ${this.hexToRgba(ultColor, .45)}, 0 0 20px ${this.hexToRgba(ultColor, .85)}, 0 0 42px ${this.hexToRgba(ultColor, .35)}`
        : '';
      qCircle.classList.toggle('full', qReady);
      qCircle.classList.toggle('off', q.id === 'none' || !qReady);
    }

    let tip = '';
    let tipKey = '';
    let sticky = false;
    if (game.levelId === 'hou' && game.enemies.some(e => e.kind === 'boss' && !e.dead)) {
      const boss = game.enemies.find(e => e.kind === 'boss' && !e.dead);
      if (boss && boss.type === 'timedemon') {
        tipKey = 'timedemon';
        tip = `<span class="idx">BOSS</span>时间恶魔：所有攻击都可以格挡　·　完美格挡 -100 韧性` +
          `<span class="guideSub">打碎 ⌛ / ⏪ 阻止倒计时　·　连续 10 秒不受伤会开始回血　·　半血进入二阶段</span>`;
      } else if (!game.save.world.sunGuideDone) {
        tipKey = 'sun';
        tip = `<span class="idx">BOSS</span>孙点黑的所有攻击都可以格挡　·　完美格挡 -100 韧性` +
          `<span class="guideSub">击破 🚹 / 🚺 -250 韧性　·　韧性归零虚弱 5 秒　·　半血进入二阶段</span>`;
      }
    } else if (game.levelId === 'zhong' && !game.cleared && !game.save.world.zhongGuideDone) {
      tip = this.zhongGuide(game);
      tipKey = 'zhong:' + tip;
    } else {
      const step = LEVEL.tutorial[game.tutorialIndex];
      if (step && !game.cleared && !game.save.world.tutorialDone) {
        tipKey = 'tut:' + game.tutorialIndex;
        sticky = true;
        tip = `<span class="idx">${game.tutorialIndex + 1}/${LEVEL.tutorial.length}</span>${step.text}`;
      }
    }

    // 非教学指引：显示 5 秒后自动消失
    const now = performance.now();
    if (tipKey !== this.tipKey) {
      this.tipKey = tipKey;
      this.tipUntil = tip ? (sticky ? Infinity : now + 5000) : 0;
      if (tip) this.els.tutorial.innerHTML = tip;
    }
    const visible = !!tip && now < (this.tipUntil || 0);
    if (visible) {
      this.els.tutorial.classList.remove('hidden');
    } else {
      this.els.tutorial.classList.add('hidden');
    }
  },

  hexToRgba(hex, a) {
    if (!hex || hex[0] !== '#') return `rgba(255,255,255,${a})`;
    const h = hex.length === 4
      ? '#' + hex[1] + hex[1] + hex[2] + hex[2] + hex[3] + hex[3]
      : hex;
    const n = parseInt(h.slice(1), 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
  },

  zhongGuide(game) {
    const w = game.save.world;
    const keyEquipped = Object.values(game.save.itemSlots).includes('classroomKey');
    let obj;
    if (!w.keyTaken) obj = '在高处寻找 🔑 十班的钥匙';
    else if (!keyEquipped && !w.lockOpened) obj = '按 <b>B</b> 打开背包 → 道具页，把 🔑 装备到 Z / X / C / V';
    else if (!w.lockOpened) obj = '靠近上锁的 🚪，按装备 🔑 的对应道具键开门';
    else if (!w.litouTalked) obj = '进入荔头办公室，找 👩🏻荔头交谈';
    else obj = '前往终点 🚪；击败王明猪可解锁宝箱，小心电焊';
    return `<span class="idx">指引</span>${obj}<span class="guideSub">梯子靠近后按 <b>W / S</b> 上下攀爬，到顶后按 <b>A / D</b> 离开梯子　·　道具栏 Z / X / C / V 可使用装备的道具</span>`;
  },

  toast(msg, dur) {
    this.els.toast.textContent = msg;
    this.els.toast.classList.remove('hidden');
    clearTimeout(this.toastTimer);
    this.toastTimer = setTimeout(() => {
      this.els.toast.classList.add('hidden');
    }, dur || 1700);
  },

  showLoot(lines, dur, title) {
    if (!this.els.loot) return;
    const box = document.createElement('div');
    box.className = 'lootBox';
    box.innerHTML = (title ? `<div class="lootTitle">${title}</div>` : '') +
      lines.map(l => `<div class="lootRow">${l}</div>`).join('');
    this.els.loot.appendChild(box);
    while (this.els.loot.children.length > 4) {
      this.els.loot.removeChild(this.els.loot.firstChild);
    }
    setTimeout(() => {
      box.classList.add('out');
      setTimeout(() => box.remove(), 320);
    }, dur || 2000);
  },

  showOverlay(html) {
    this.els.overlay.innerHTML = `<div class="panel">${html}</div>`;
    this.els.overlay.classList.remove('hidden');
    this.els.overlay.onclick = null;
  },

  showRaw(html) {
    this.els.overlay.innerHTML = html;
    this.els.overlay.classList.remove('hidden');
    this.els.overlay.onclick = null;
  },

  hideOverlay() {
    this.els.overlay.classList.add('hidden');
    this.els.overlay.innerHTML = '';
    this.els.overlay.onclick = null;
  },

  /* ---------------- 标题 ---------------- */

  showTitle(game) {
    this.showRaw(`
      <div class="titleScreen">
        <div class="titleBoardBg"></div>
        <div class="titleFloor"></div>
        <div class="schoolDesk d1"></div>
        <div class="schoolDesk d2"></div>
        <div class="titleContent">
          <div class="titleGlow"></div>
          <div class="gameTitle">THE KNIGHT</div>
          <div class="gameSub">EMOJIKNIGHT</div>
          <div class="titleMenu">
            ${game && game.hasContinue() ? '<button id="btnContinue">继续游戏</button>' : ''}
            <button id="btnNew">新游戏</button>
            <button id="btnLoad">加载存档</button>
            <button id="btnSettings">设置</button>
          </div>
        </div>
      </div>`);
  },

  /* ---------------- 开场动画 ---------------- */

  showIntro(game, index) {
    const text = game.INTRO[index] || '';
    const dots = game.INTRO.map((_, i) =>
      `<span class="introDot ${i === index ? 'on' : ''}"></span>`).join('');
    this.showRaw(`
      <div class="introScreen">
        <div class="introText">${text}</div>
        <div class="introDots">${dots}</div>
        <div class="introHint">按鼠标左键继续</div>
      </div>`);
    this.els.overlay.onclick = () => game.advanceIntro();
  },

  /* ---------------- 剧情文本 ---------------- */

  showStory(game, index) {
    const text = game.story ? (game.story.lines[index] || '') : '';
    this.showRaw(`
      <div class="introScreen">
        <div class="introText">${text}</div>
        <div class="introHint">点击鼠标左键继续</div>
      </div>`);
    this.els.overlay.onclick = () => game.advanceStory();
  },

  /* ---------------- 加载存档 ---------------- */

  showLoad(game) {
    this.showOverlay(`
      <h2>加载存档</h2>
      <div class="sub">把存档文件拖入下方区域</div>
      <div id="dropZone" class="dropZone">
        <div class="dzIcon">📂</div>
        <div class="dzMain">拖入 Emojiknight-save.json</div>
        <div class="dzHint">或点击此处选择文件</div>
        <input type="file" id="fileInput" accept=".json,application/json" hidden>
      </div>
      <div id="loadError" class="loadError"></div>
      <div class="btnrow">
        <button id="btnLoadBack" class="ghost">返回</button>
      </div>
    `);

  loadError(msg) {
    const el = document.getElementById('loadError');
    if (el) el.textContent = msg;
  },

  /* ---------------- 设置 ---------------- */

    const rows = Input.ACTIONS.map(a => `
      <div class="settingRow">
        <span>${a.label}</span>
        <button class="keyBtn" data-action="${a.id}">${Input.keyNameOf(a.id)}</button>

      <h2>设置</h2>

      <div class="settingsGrid">${rows}</div>
      <div class="volRow">
        <span>音量</span>
        <input type="range" id="volumeRange" min="0" max="100" value="${vol}">

      </div>
      <div class="btnrow">
        <button id="btnSettingsBack" class="ghost">返回</button>
      </div>
    `);
  },

  /* ---------------- 暂停 ---------------- */

  showPause(game) {
    const w = game.save;
    const name = String(w.saveName || '控江异闻').replace(/[<>&"]/g, c => ({ '<': '&lt;', '>': '&gt;', '&': '&amp;', '"': '&quot;' }[c]));
    const avatars = AVATARS.map(a =>
      `<button class="avatarPick ${w.avatar === a ? 'on' : ''}" data-avatar="${a}">${a}</button>`
    ).join('');
    const exp = game.worldExp();
    const need = game.worldExpCap();
    const pct = Math.min(100, (exp / need) * 100);

    this.showOverlay(`
      <h2>存档主页</h2>
      <div class="homeHead">
        <div class="homeNameWrap">
          <div class="homeLabel">存档名字</div>
          <input id="saveNameInput" class="saveNameInput" maxlength="24" value="${name}">
        </div>
        <div class="homeAvatarWrap">
          <div class="homeLabel">头像</div>
          <div class="avatarRow">${avatars}</div>
        </div>
      </div>
      <div class="worldRow">
        <div class="worldBar"><i style="width:${pct}%"></i><span>世界经验 ${exp} / ${need}</span></div>
        <div class="worldLv">世界等级 <b>${game.worldLevel()}</b></div>
      </div>
      <div class="pauseMenu">
        <button id="btnHomeSave">存档</button>
        <button id="btnPauseTitle" class="ghost">返回标题</button>
        <button id="btnResume">继续游戏</button>
        <button id="btnPauseSettings">设定</button>
      </div>
    `);

    const nameInput = document.getElementById('saveNameInput');
    if (nameInput) {
      nameInput.onchange = () => {
        const v = nameInput.value.trim().slice(0, 24) || '控江异闻';
        game.save.saveName = v;
        nameInput.value = v;
        game.saveGame();
      };
    }
    document.querySelectorAll('[data-avatar]').forEach(btn => {
      btn.onclick = () => {
        game.save.avatar = btn.dataset.avatar;
        game.saveGame();
        SFX.play('click');
        this.showPause(game);
      };
    });

    const resume = document.getElementById('btnResume');
    const save = document.getElementById('btnHomeSave');
    const settings = document.getElementById('btnPauseSettings');
    const title = document.getElementById('btnPauseTitle');
    if (resume) resume.onclick = () => { SFX.play('click'); game.resume(); };
    if (save) save.onclick = () => {
      game.saveGame();
      SFX.play('save');
      this.toast('已保存', 1400);
    };
    if (settings) settings.onclick = () => {
      SFX.play('click');
      game.settingsFrom = 'paused';
      this.showSettings(game);
      game.bindSettings();
    };
    if (title) title.onclick = () => { SFX.play('click'); game.toTitle(); };
  },

  /* ---------------- 检查点存档 ---------------- */

  showSavePanel(game) {
    this.showOverlay(`
      <h2>存档</h2>
      <div class="sub">将当前进度保存为文件，另存在电脑上</div>
      <div class="saveBox">
        <div class="kv"><span>当前位置</span><b>${LEVEL.name}</b></div>
        <div class="kv"><span>金币</span><b>${game.save.gold}</b></div>
        <div class="kv"><span>队伍</span><b>${game.save.unlocked.map(id => CFG.characters[id] ? CFG.characters[id].name : '').filter(Boolean).join('、')}</b></div>

  /* ---------------- 背包 ---------------- */

  showBag(game) {
    const tab = this.bagTab;
    const tabs = `
      <div class="tabRow">
        <button class="tab ${tab === 'equipment' ? 'on' : ''}" data-bag="equipment">装备</button>
        <button class="tab ${tab === 'items' ? 'on' : ''}" data-bag="items">道具</button>
        <button class="tab ${tab === 'materials' ? 'on' : ''}" data-bag="materials">材料</button>
      </div>`;

    let body = '';
    if (tab === 'equipment') {
      const eq = game.save.inventory.equipment;
      if (!eq.length) {
        body = `<div class="emptyNote">装备栏为空</div>`;
      } else {
        body = eq.map(id => {
          const w = CFG.weapons[id];
          if (!w) return '';
          const holders = game.player.characters
            .filter(c => c.weapon === id)
            .map(c => c.def.name)
            .join('、');
          return `<div class="itemRow">
            <div class="itemIcon">${w.emoji}</div>
            <div class="itemInfo">
              <div class="itemName">${w.name}</div>
              <div class="itemDesc">${w.desc || `普攻 ${Math.round(w.light.mult * 100)}% · ${w.light.time}s / 重击 ${Math.round(w.heavy.mult * 100)}% · ${w.heavy.time}s`}</div>
            </div>
            <div class="itemTag">${holders ? '装备中：' + holders : '未装备'}</div>
          </div>`;
        }).join('');
      }
    } else if (tab === 'items') {
      const items = game.save.inventory.items;
      if (!items.length) {
        body = `<div class="emptyNote">暂无道具</div>`;
      } else {
        const summary = ['Z', 'X', 'C', 'V'].map(s => {
          const id = game.save.itemSlots[s];
          const it = id && CFG.items[id];
          return `<span class="slotChip">${s} · ${it ? it.emoji + it.name : '空'}</span>`;
        }).join('');
        body = `<div class="slotSummary">${summary}</div>` + items.map(id => {
          const it = CFG.items[id];
          if (!it) return '';
          const cd = it.id === 'mathbook' ? Math.ceil(game.itemCds.mathbook || 0) : 0;
          const buttons = ['Z', 'X', 'C', 'V'].map(s =>
            `<button class="slotBtn ${game.save.itemSlots[s] === id ? 'on' : ''}" data-item="${id}" data-slot="${s}">${s}</button>`
          ).join('');
          return `<div class="itemRow">
            <div class="itemIcon">${it.emoji}</div>
            <div class="itemInfo">
              <div class="itemName">${it.name}<span class="itemCount">×${game.itemCount(id)}</span></div>
              <div class="itemDesc">${it.desc}</div>
              ${it.cd ? `<div class="itemDesc">使用冷却：${it.cd}s</div>` : ''}
              ${cd > 0 ? `<div class="itemDesc">冷却中：${cd}s</div>` : ''}
            </div>
            <div class="itemSlots">${buttons}</div>
          </div>`;
        }).join('');
      }
    } else {
      const mats = [
        { id: 'goldenPythonSkin', emoji: '💩', name: '黄金巨蟒皮', desc: '稀有材料，可用于锻造' },
        { id: 'dianmo', emoji: '⚫️', name: '点墨', desc: '黑犬掉落的墨色结晶' },
        { id: 'haochengji', emoji: '💯', name: '好成绩', desc: '等级突破材料' },
        { id: 'gear', emoji: '⚙️', name: '齿轮', desc: '通技老师的遗产' },
        { id: 'music', emoji: '🎶', name: '音乐细菌', desc: '升级材料' }
      ].filter(m => (game.save.materials[m.id] || 0) > 0);

      body = mats.length
        ? mats.map(m => `
          <div class="itemRow">
            <div class="itemIcon">${m.emoji}</div>
            <div class="itemInfo"><div class="itemName">${m.name}</div><div class="itemDesc">${m.desc}</div></div>
            <div class="itemTag">×${game.save.materials[m.id]}</div>
          </div>`).join('')
        : `<div class="emptyNote">暂无材料</div>`;
    }

    this.showOverlay(`
      <h2>背包</h2>
      <div class="sub">装备 · 道具 · 材料</div>
      ${tabs}
      <div class="listBox">${body}</div>
      <div class="btnrow"><button id="btnBagClose" class="ghost">返回</button></div>
    `);

    document.querySelectorAll('[data-bag]').forEach(b => {
      b.onclick = () => {
        this.bagTab = b.dataset.bag;
        SFX.play('click');
        this.showBag(game);
      };
    });
    document.querySelectorAll('[data-item]').forEach(btn => {
      btn.onclick = () => {
        game.equipItem(btn.dataset.item, btn.dataset.slot);
      };
    });
    const close = document.getElementById('btnBagClose');
    if (close) close.onclick = () => { SFX.play('click'); game.closePanel(); };
  },

  /* ---------------- 作业面板 ---------------- */

  showHomework(game) {
    const order = ['psych', 'math', 'tech'];
    // 完成月考（世界等级 2）后，荔头处自动多出体育作业
    if (game.worldLevel() >= 2) order.push('sport');
    if (!order.includes(this.hwSel)) this.hwSel = 'psych';
    const sel = this.hwSel;
    const cfg = CFG.homework[sel];
    const list = order.map(key => {
      const h = CFG.homework[key];
      return `<button class="hwItem ${key === sel ? 'on' : ''}" data-hw="${key}">${h.name}</button>`;
    }).join('');

    this.showOverlay(`
      <h2>作业</h2>
      <div class="sub">选择左侧作业，在右侧接取</div>
      <div class="hwPanel">
        <div class="hwList">${list}</div>
        <div class="hwDetail">
          <div class="hwName">${cfg.name}</div>
          <div class="hwDesc">${cfg.desc}</div>
          <button id="btnHwAccept">接取作业</button>
        </div>
      </div>
      <div class="btnrow"><button id="btnHwClose" class="ghost">返回</button></div>
    `);

    document.querySelectorAll('[data-hw]').forEach(btn => {
      btn.onclick = () => {
        this.hwSel = btn.dataset.hw;
        SFX.play('click');
        this.showHomework(game);
      };
    });

    if (accept) accept.onclick = () => { SFX.play('click'); game.acceptHomework(sel); };

    if (close) close.onclick = () => { SFX.play('click'); game.closePanel(); };
  },

  /* ---------------- 成就 ---------------- */

  showAchievements(game) {
    const rows = CFG.achievements.map(a => {
      const unlocked = !!game.save.achievements[a.id];
      const val = Math.min(a.goal, game.achievementValue(a));
      const pct = Math.min(100, Math.round((val / a.goal) * 100));
      const flag = a.kind === 'flag';
      const progress = flag ? (unlocked ? '已达成' : '未达成') : `${val} / ${a.goal}`;
      return `<div class="achCard ${unlocked ? 'on' : ''}">
        <div class="achIcon">${unlocked ? '🏆' : '🔒'}</div>
        <div class="achInfo">
          <div class="achName">${a.name}</div>
          <div class="achDesc">${a.desc}</div>
          <div class="achBar"><i style="width:${pct}%"></i></div>
        </div>
        <div class="achState">${unlocked ? '已解锁' : progress}</div>
      </div>`;
    }).join('');
    const count = CFG.achievements.filter(a => game.save.achievements[a.id]).length;

    this.showOverlay(`
      <h2>成就</h2>
      <div class="sub">已解锁 ${count} / ${CFG.achievements.length}</div>
      <div class="achList">${rows}</div>
      <div class="btnrow"><button id="btnAchClose" class="ghost">返回</button></div>
    `);
    const close = document.getElementById('btnAchClose');
    if (close) close.onclick = () => { SFX.play('click'); game.closePanel(); };
  },

  /* ---------------- 任务 ---------------- */

  showQuests(game) {
    const tab = this.questTab;
    const tabs = `
      <div class="tabRow">
        <button class="tab ${tab === 'main' ? 'on' : ''}" data-quest="main">主线任务</button>
        <button class="tab ${tab === 'side' ? 'on' : ''}" data-quest="side">支线任务</button>
        <button class="tab ${tab === 'commission' ? 'on' : ''}" data-quest="commission">委托任务</button>
